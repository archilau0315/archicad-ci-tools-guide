      - generic [ref=e134]:
        - generic [ref=e135]:
          - generic [ref=e136]: "02"
          - heading "1.2 Manage Case Exceptions" [level=3] [ref=e137]
        - link "MyCi 官方原文 ↗" [ref=e139] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001694896-1-2-Manage-Case-Exceptions
        - generic [ref=e140]:
          - paragraph [ref=e141]:
            - text: The
            - emphasis [ref=e142]: Case Exception Manager
            - text: collects words or abbreviations that should have a fixed case irrespective of the standard for the general text. The manager can be viewed by clicking the
            - emphasis [ref=e143]: Edit
            - text: button from the
            - emphasis [ref=e144]: Case Conversion Options
            - text: dialog, or by clicking the menu
            - emphasis [ref=e145]: CI Tools > Annotate > Manage Case Exceptions…
          - paragraph [ref=e146]:
            - img "1.2 Manage Case Exceptions 示意图" [ref=e147]
          - paragraph [ref=e148]: "The list of exceptions is project-specific, but can be exported for import into other projects. The manager dialog features include:"
          - list [ref=e149]:
            - listitem [ref=e150]: The exception list
          - paragraph [ref=e151]: "The list is divided into 2 columns, both of which can be edited directly in the list:"
          - list [ref=e152]:
            - listitem [ref=e153]: Text The literal text, i.e. with the case as it should appear in the document.
          - list [ref=e154]:
            - listitem [ref=e155]: Context The context in which this exception is relevant
          - paragraph [ref=e156]: For example, the abbreviation of millimetre to mm is usually lower case, but we don’t want to see any word containing double-m to be affected, e.g. “common” converted to “COmmON”. The unit would be expected to follow a number, e.g. 100mm, so the context should be set to “After number”. An entire word that should have a specific case, e.g. a proper noun, could have the context as “Entire word”. If a series of letters, symbols or even words should have have a specific case no matter where they occur, the context will be “Anywhere”. Note that “Anywhere” must be selected for any expression that contains non-alphanumeric characters such as “.” or “?”.
          - list [ref=e157]:
            - listitem [ref=e158]: "The buttons to the right provide additional functionality:"
          - list [ref=e159]:
            - listitem [ref=e160]: Insert Insert a new exception in the list
          - list [ref=e161]:
            - listitem [ref=e162]: Delete Delete the selected exception(s) from the list
          - list [ref=e163]:
            - listitem [ref=e164]: Import Import case exceptions from a file
          - list [ref=e165]:
            - listitem [ref=e166]: Export Export the current list of case exceptions to a file
          - paragraph [ref=e167]:
            - text: Case exception files have the
            - emphasis [ref=e168]: .keycase
            - text: extension.
          - paragraph [ref=e169]: Changes to the case exceptions are saved on clicking “Ok” or discarded with “Cancel”.
        - group [ref=e170]:
