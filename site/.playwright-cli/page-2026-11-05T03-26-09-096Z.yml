          - heading "1.1 Convert Text Case" [level=3] [ref=e86]
        - link "MyCi 官方原文 ↗" [ref=e88] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001692315-1-1-Convert-Text-Case
        - generic [ref=e89]:
          - paragraph [ref=e90]:
            - text: Annotate’s case conversion tool can change the text content of most project elements, optionally including settings like (string) properties and parameters. To convert the case of just a selection of items, pick them first. To start the conversion tool, click the menu item
            - emphasis [ref=e91]: CI Tools > Annotate > Convert Case…
          - paragraph [ref=e92]:
            - img "1.1 Convert Text Case 示意图" [ref=e93]
          - paragraph [ref=e94]:
            - text: The
            - emphasis [ref=e95]: Case Conversion Options
            - text: "dialog appears first. Pick from the following:"
          - list [ref=e96]:
            - listitem [ref=e97]: "Case Specify the required text case and whether any exceptions should be observed. Options include:"
          - list [ref=e98]:
            - listitem [ref=e99]: Sentence case
          - list [ref=e100]:
            - listitem [ref=e101]: UPPER CASE
          - list [ref=e102]:
            - listitem [ref=e103]: lower case
          - list [ref=e104]:
            - listitem [ref=e105]: Title Case
          - paragraph [ref=e106]:
            - text: Select
            - emphasis [ref=e107]: Observe case exceptions
            - text: if some words or abbreviations should have a fixed case. An
            - emphasis [ref=e108]: Edit
            - text: button will appear for reviewing the exceptions (see section 1.2 for more details).
          - list [ref=e109]:
            - listitem [ref=e110]: "Scope Specify the scope of the text conversion, including:"
          - paragraph [ref=e111]: Selected items only . Disabled if nothing is selected in the active drawing view.
          - list [ref=e112]:
            - listitem [ref=e113]: Text in the current drawing . Only the active drawing view will be affected. If the floor plan is active, only the current storey will be targeted.
          - list [ref=e114]:
            - listitem [ref=e115]: Text in floor plan (all storeys) . All stories in the floor plan will be targeted.
          - list [ref=e116]:
            - listitem [ref=e117]: Text in all drawings. All drawings, including sections, worksheets etc will be targeted.
          - paragraph [ref=e118]:
            - text: Select
            - emphasis [ref=e119]: String properties
            - text: to convert any string property values. Note that this will not affect text picked from a menu of pre-determined choices – if you want to change that, use the Property Manager.
          - paragraph [ref=e120]:
            - text: Select
            - emphasis [ref=e121]: String parameters
            - text: to convert parameter text. Locked or hidden parameters will not be affected (on the basis that they are probably not intended to be changed). If the option setting
            - emphasis [ref=e122]: If displayed
            - text: is selected, only string parameter values exactly matching text currently displayed by the object in 2D will be converted. This is a much safer option if the object holds other visible, unlocked text that shouldn’t be changed.
          - list [ref=e123]:
            - listitem [ref=e124]: "Ignore Select any items or layers that shouldn’t be converted, including:"
          - paragraph [ref=e125]: Hidden items , e.g. everything on hidden layers;
          - list [ref=e126]:
            - listitem [ref=e127]: Locked items , i.e. where the element has been explicitly locked;
          - list [ref=e128]:
            - listitem [ref=e129]: Locked layers , e.g. everything on locked layers.
          - paragraph [ref=e130]:
            - text: Click
            - emphasis [ref=e131]: Ok
            - text: to begin the conversion process.
