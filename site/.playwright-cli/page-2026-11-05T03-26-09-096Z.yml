          - heading "Replacing Fonts using Ci Tools Annotate" [level=3] [ref=e261]
        - link "MyCi 官方原文 ↗" [ref=e263] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/14260464417679-Replacing-Fonts-using-Ci-Tools-Annotate
        - generic [ref=e264]:
          - paragraph [ref=e265]: "The Annotate in Archicad 29 now allows for the replacement of Fonts:"
          - paragraph [ref=e266]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e267]
          - paragraph [ref=e268]: By activating the Replace Fonts check box, we are able to initiate a rule based Font Replacement Manager by clicking on Edit.
          - paragraph [ref=e269]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e270]
          - paragraph [ref=e271]: The Set Default Font will apply a Default Font to any Font that has no rule assigned, note this can be used to override all fonts to single font in the project.
          - paragraph [ref=e272]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e273]
          - paragraph [ref=e274]: By selecting the check box show only fonts used in the project, and clicking on the plus sign the list will populate with all fonts in the project for rule based assignment.
          - paragraph [ref=e275]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e276]
          - paragraph [ref=e277]: We will now b able to select each font and choose either to Ignore it, or replace it with a Font of our choice, we will change the Comic Sans to Calibri.
          - paragraph [ref=e278]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e279]
          - paragraph [ref=e280]: We Select the Comic Sans on the left and the replacement on the right.
          - paragraph [ref=e281]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e282]
          - paragraph [ref=e283]: As we can see the Arial font was ignored, and the Comic Sans has changed to Calibri.
          - paragraph [ref=e284]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e285]
          - paragraph [ref=e286]:
            - strong [ref=e287]: IMPORTANT
          - paragraph [ref=e288]: Special attention should be given to the Application to Project Window as this determines what will be changed, one can choose to ignore certain text with high level control.
          - paragraph [ref=e289]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e290]
          - paragraph [ref=e291]: It is also possible to exercise control over where any of the Attribute Conversion Options are applied.
          - paragraph [ref=e292]:
            - img "Replacing Fonts using Ci Tools Annotate 示意图" [ref=e293]
