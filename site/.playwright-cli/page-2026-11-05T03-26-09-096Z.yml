        - link "MyCi 官方原文 ↗" [ref=e177] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/14260201378447-Attribute-Replacement-using-Ci-Tools-Annotate
        - generic [ref=e178]:
          - heading "Attribute Replacement" [level=2] [ref=e179]
          - paragraph [ref=e180]: The Annotate tool has the ability to change several attributes in a project simultaneously. This is especially helpful in making bulk changes to Archicad files or drawings that may have originated outside of Archicad.
          - paragraph [ref=e181]: "The Annotate Tool is accessed under the CI Tools dropdown:"
          - paragraph [ref=e182]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e183]
          - paragraph [ref=e184]: "By Clicking on the Convert Menu item, the Annotate Tool allows for the replacement of:"
          - list [ref=e185]:
            - listitem [ref=e186]: Fills
          - list [ref=e187]:
            - listitem [ref=e188]: Pens
          - list [ref=e189]:
            - listitem [ref=e190]: Linetypes
          - list [ref=e191]:
            - listitem [ref=e192]: Fonts
          - list [ref=e193]:
            - listitem [ref=e194]: Text Case conversion
          - paragraph [ref=e195]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e196]
          - paragraph [ref=e197]: Let us look at the separate menu’s individually.
          - paragraph [ref=e198]: "Please note that any of these three ‘Edit’ buttons bring up the Attribute Replacement Manager, where mapping can take place, the ‘Edit’ button only selects the part that you have clicked on by default. Clicking on the ‘Edit’ button next to Replace Linetypes defaults to the Linetypes part of that Interface, but all three are accessible in that one interface. See below:"
          - paragraph [ref=e199]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e200]
          - heading "Attribute Replacement Manager" [level=2] [ref=e201]
          - paragraph [ref=e202]: "**"
          - paragraph [ref=e203]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e204]
          - paragraph [ref=e205]: "**"
          - paragraph [ref=e206]:
            - strong [ref=e207]: 1 Pen Type
          - paragraph [ref=e208]: Choice of Pen override mapping
          - paragraph [ref=e209]:
            - strong [ref=e210]: 2 Fill Type
          - paragraph [ref=e211]: Choice of Fill override mapping
          - paragraph [ref=e212]:
            - strong [ref=e213]: 3 Line Type
          - paragraph [ref=e214]: Linetype override mapping
          - paragraph [ref=e215]:
            - strong [ref=e216]: 4 Default value
          - paragraph [ref=e217]: When checked this pen type is applied to all lines, if no rules are added, or applied to all Pens that do not have a Rule defined.
          - paragraph [ref=e218]:
            - strong [ref=e219]: 5 Add Rules to list
          - paragraph [ref=e220]: "One can automatically populate the Attributes rules list and add the Pens, Fills and Linetypes from:"
          - paragraph [ref=e221]: Selected Items only Only the selected elements
          - paragraph [ref=e222]: Current Drawing All elements in the Current Drawing
          - paragraph [ref=e223]: Plan (all storeys) All elements in all Plan views
          - paragraph [ref=e224]: Entire Project All elements in the Entire Project
          - paragraph [ref=e225]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e226]
          - paragraph [ref=e227]: We will use Current Drawing.
          - paragraph [ref=e228]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e229]
          - paragraph [ref=e230]: The Pens used is now populated for adjustment, each pen in the list to the left can now be individually substituted with a pen of your choice in the list to the right.
          - paragraph [ref=e231]: "In this choice we substitute Pen 2 for Pen 23, please see below:"
          - paragraph [ref=e232]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e233]
          - paragraph [ref=e234]: In this way we can assign each Pen to a different Pen type.
          - paragraph [ref=e235]: "We can also do the following in this dialogue:"
          - paragraph [ref=e236]: 1 Add Rule manually
          - paragraph [ref=e237]: 2 Delete Rules
          - paragraph [ref=e238]: 3 Import Rules that have been saved from another Project
          - paragraph [ref=e239]: 4 Export Rules for use in another Project
          - paragraph [ref=e240]: "Please see below:"
          - paragraph [ref=e241]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e242]
          - paragraph [ref=e243]: In the same way each of the Fill Types can be either changed to a Default Fill, or selected Fill replacements can be applied.
          - paragraph [ref=e244]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e245]
          - paragraph [ref=e246]: "The Linetype can be changed by mapping the Left pane onto the Right:"
          - paragraph [ref=e247]:
            - img "Attribute Replacement using Ci Tools Annotate 示意图" [ref=e248]
          - paragraph [ref=e249]:
            - strong [ref=e250]: "Important:"
          - paragraph [ref=e251]: "Please note that the replacement rules will apply to all Fills, Linetypes and Pens based on criteria in the ‘Application to Project’ part of the Dialogue, it is important to limit and control the desired application of your mapping in this selection. Please see below:"
          - paragraph [ref=e252]:
