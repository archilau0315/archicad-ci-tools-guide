        - generic [ref=f1e971]:
          - paragraph [ref=f1e972]: Quantities 对混合数据类型具有很强的容错性。如果它在需要文本的地方找到了数字，就会把数字转换为文本（反之亦然）。在需要数字的地方找到文本时，会尝试将文本转换为数字 —— 如果没有找到数字字符，结果为零。因此以下语句在功能上是等同的：
          - code [ref=f1e974]: element.height > 2
          - code [ref=f1e976]: element.height > “2”
          - paragraph [ref=f1e977]: 对于不同的单位类型也是如此，例如您可以混用任何类型的属性，即使它们混合了体积、长度等，例如：
          - code [ref=f1e979]: element.area > element.perimeter
          - paragraph [ref=f1e980]: 清单条目的单位类型与计算中任何数值所用的单位同样无关紧要。清单可以采用非标准方式计量数量，例如“袋”，因此软件假定用户知道需要什么。
        - generic [ref=f1e981]:
          - paragraph [ref=f1e982]: "Quantities is very tolerant with mixed data types. If it finds a number where text is expected, it converts the number to text (and vice-versa). Where text is found when a number is expected, a conversion from the text to a number will be attempted – the result will be zero if no numeric characters are found. So the following statements are functionally identical:"
          - code [ref=f1e984]: element.height > 2
          - code [ref=f1e986]: element.height > “2”
          - paragraph [ref=f1e987]: "The same is true for different unit types, e.g. you can mix any type of property even if they mix volume, length etc., e.g.:"
          - code [ref=f1e989]: element.area > element.perimeter
          - paragraph [ref=f1e990]: The unit type of the bill item is also irrelevant to the units of any values used in the calculation. A bill can measure quantities in non-standard ways, e.g. bags, so the software assumes the user knows what is required.
