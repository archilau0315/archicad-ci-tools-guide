          - paragraph [ref=f1e1344]: 该配方可能包含一长串测量项，每一项都用合适的表达式针对特定类型的砖，例如：
          - paragraph [ref=f1e1345]: wall.m aterial includes “Brick – Furness Handbridge Blend 215”
          - paragraph [ref=f1e1346]: 只有当墙体包含名称与“Brick – Furness Handbridge Blend 215”完全匹配的材质时，才会进行相应的数量计算。
          - list [ref=f1e1347]:
            - listitem [ref=f1e1348]: 计算材质的几何数量
          - paragraph [ref=f1e1349]: 列表中的每种材质都有可用于数量计算的面积和体积。可以通过附加名称来引用列表中的特定材质，例如对于名为“Red Brick”的材质：
          - paragraph [ref=f1e1350]: element.material(“Red Brick”)
          - paragraph [ref=f1e1351]: 名称必须完全匹配，例如上例不会找到“Red Brick 1”。材质数量包括：
          - paragraph [ref=f1e1352]: area
          - paragraph [ref=f1e1353]: element.material(“Red Brick”). area
          - paragraph [ref=f1e1354]: 平面面积
          - paragraph [ref=f1e1355]: volume
          - paragraph [ref=f1e1356]: element.material(“Red Brick”). volume
          - paragraph [ref=f1e1357]: 总体积
          - paragraph [ref=f1e1358]: 如果一个构件包含多个与指定材质匹配的皮层，面积和体积将累加所有这些皮层的数量。
        - generic [ref=f1e1359]:
          - paragraph [ref=f1e1360]:
            - text: A single element may contain any number of materials, so the expression
            - emphasis [ref=f1e1361]: element.material
            - text: provides a list (see section 4.4.6 for more detail). The list could be empty (e.g. for a
            - emphasis [ref=f1e1362]: fill
            - text: "element) or have a single item, but should always be treated as a list in calculations. It has two possible uses:"
          - list [ref=f1e1363]:
            - listitem [ref=f1e1364]: Searching for materials based on the name
          - paragraph [ref=f1e1365]: "This is often useful for attaching recipes automatically based on its materials (see section 4.5) or determining which measurements the recipe should make (see section 4.6). Consider a recipe intended to take measurement of all types of brick – it might automatically attach to any wall with a material containing the word “brick”:"
