        - generic [ref=f1e2288]:
          - paragraph [ref=f1e2289]: 在算量排程的最终环节，可以应用一系列检查。
          - paragraph [ref=f1e2290]: 第 5.2.6 节描述了如何利用计算数量与源构件之间的关联来复核最终数值的得出过程。针对 BIM 构件的审计流程（第 6.2 节）同样适用于查看调用了哪些配方以及它们作用于哪些数据，从而可能发现错误或遗漏。
          - paragraph [ref=f1e2291]: 第 5.2.7 节列出了一系列清单条目检查和配方测量检查，以确保：
          - paragraph [ref=f1e2292]: • BIM 构件特征标记保持一致；
          - paragraph [ref=f1e2293]: • 清单条目使用恰当；
          - paragraph [ref=f1e2294]: • 数量计算已成功完成测量。
        - generic [ref=f1e2295]:
          - paragraph [ref=f1e2296]: A series of checks can be applied at the final point of scheduling the quantities.
          - paragraph [ref=f1e2297]: Section 5.2.6 describes how the connection between calculated quantities and the source elements can be used to review how the final figures were obtained. The auditing processes for BIM elements (section 6.2) is again applicable for reviewing which recipes were invoked and what data they acted on, potentially highlighting errors or omissions.
          - paragraph [ref=f1e2298]: "Section 5.2.7 lists a series of bill item checks and recipe measurement checks that ensure:"
          - paragraph [ref=f1e2299]: • BIM element traits are consistent;
          - paragraph [ref=f1e2300]: • Bill items are used appropriately;
          - paragraph [ref=f1e2301]: • Quantity calculations have successfully taken measurements.
