          - heading "4.5.2 How to identify an element (type, name, ID)" [level=3] [ref=f1e1480]
        - link "MyCi 官方原文 ↗" [ref=f1e1482] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004057136-4-5-2-How-to-identify-an-element-type-name-ID
        - generic [ref=f1e1483]:
          - paragraph [ref=f1e1484]: 标识特定构件类型有两种方式：
          - list [ref=f1e1485]:
            - listitem [ref=f1e1486]: 如果目的仅是确认某个构件属于特定类型，例如在将配方附加到构件的规则中，最简单的方法是请求类型进行比较，例如：
          - paragraph [ref=f1e1487]: element.type = “Wall”
          - paragraph [ref=f1e1488]: element.type = “Slab”
          - list [ref=f1e1489]:
            - listitem [ref=f1e1490]: 若既要确认构件类型又要进行计算，则可以在表达式中断言类型。例如，检查某个构件是否为高度大于 2m 的墙体时，最明显的表达式是：
          - paragraph [ref=f1e1491]: element.type = “Wall” and element.height > 2
          - paragraph [ref=f1e1492]: …… 但高度表达式也可以断言类型为墙体：
          - paragraph [ref=f1e1493]: wall.height > 2
          - paragraph [ref=f1e1494]: 其效果与检查该构件为墙体相同，并且以这种方式请求非墙体的高度将得到零结果。
          - paragraph [ref=f1e1495]:
            - text: 受支持的构件类型（及其名称）的完整列表见第 7.3 节
            - emphasis [ref=f1e1496]: 构件标识
            - text: 。
          - paragraph [ref=f1e1497]:
            - text: 所有基于对象（参数化）的构件都有
            - emphasis [ref=f1e1498]: name
            - text: 值，例如对象、门、窗、区域等，它给出库构件的名称。例如，将配方附加到制造商名为 "Fixtures4U" 所提供的每一个对象的规则可以是：
          - paragraph [ref=f1e1499]:
            - emphasis [ref=f1e1500]:
              - text: element.name c
              - strong [ref=f1e1501]: ontains
              - text: “Fixtures4U”
          - paragraph [ref=f1e1502]: …… 前提是库构件名称都包含制造商名称。或者，对每一个以 "Space Planning" 开头的印章所代表的区域进行测量的条件可以是：
          - paragraph [ref=f1e1503]:
            - emphasis [ref=f1e1504]: zone.name startsWith “Space Planning”
          - paragraph [ref=f1e1505]:
            - emphasis [ref=f1e1506]: id
            - text: 只是提供为构件 ID 输入的任意文本。它最有可能用作附加配方或进行测量的规则，而不是用于计算数量，但这在很大程度上取决于事务所的标准，即 ID 应当包含哪些信息。
        - generic [ref=f1e1507]:
          - paragraph [ref=f1e1508]: "There are two ways to identify a specific element type:"
          - list [ref=f1e1509]:
            - listitem [ref=f1e1510]: "If the purpose is only to confirm that an element is a specific type, e.g. in the rule to attach a recipe to an element, the easiest method is to request the type for comparison, e.g.:"
          - paragraph [ref=f1e1511]: element.type = “Wall”
          - paragraph [ref=f1e1512]: element.type = “Slab”
          - list [ref=f1e1513]:
            - listitem [ref=f1e1514]: "For both confirming the element type and making calculations, the type can be asserted in the expression. For example, when checking that an element is a wall with a height greater than 2m, the most obvious expression would be:"
          - paragraph [ref=f1e1515]: element.type = “Wall” and element.height > 2
          - paragraph [ref=f1e1516]: "… but the expression for height could also assert that the type is a wall:"
          - paragraph [ref=f1e1517]: wall.height > 2
          - paragraph [ref=f1e1518]: The effect is the same as checking that the element is wall, and asking for the height of a non-wall in this way yields a zero result.
          - paragraph [ref=f1e1519]:
            - text: The full list of supported element types (and their names) can be found in section 7.3,
            - emphasis [ref=f1e1520]: Element Identification
            - text: .
          - paragraph [ref=f1e1521]:
            - text: A
            - emphasis [ref=f1e1522]: name
            - text: "value is available for all object-based (parametric) elements, e.g. Object, Door, Window, Zone etc. and provides the name of the library part. For example, the rule to attached a recipe to every object provided by a manufacturer called “Fixtures4U” could be:"
          - paragraph [ref=f1e1523]:
            - emphasis [ref=f1e1524]:
              - text: element.name c
              - strong [ref=f1e1525]: ontains
              - text: “Fixtures4U”
          - paragraph [ref=f1e1526]: "…assuming the library part names all contain the manufacturer name. Or the condition to take a measurement for every zone represented by a stamp starting with the words “Space Planning”:"
          - paragraph [ref=f1e1527]:
            - emphasis [ref=f1e1528]: zone.name startsWith “Space Planning”
          - paragraph [ref=f1e1529]:
            - text: The
            - emphasis [ref=f1e1530]: id
            - text: simply provides whatever text is entered for the element ID. The is most likely to be useful as a rule for attaching recipes or taking measurements rather than calculating quantities, but this depends greatly on office standards, i.e. what information the ID is supposed to contain.
