        - paragraph [ref=f1e2261]: 工程量管理器（Quantity Take-offs Manager）的"配方"选项卡中显示的清单结构（第 4.2 节）可以筛选为仅显示未链接到任何配方的清单条目，从而确保重要的成本条目不会从测量计算中被遗漏。
