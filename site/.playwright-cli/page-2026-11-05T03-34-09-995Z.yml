      - generic [ref=f1e1127]:
        - generic [ref=f1e1128]:
          - text: "36"
          - heading "4.4.6 如何使用值列表" [level=3] [ref=f1e1129]
          - heading "4.4.6 How to use a list of values" [level=3] [ref=f1e1130]
        - link "MyCi 官方原文 ↗" [ref=f1e1132] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004150475-4-4-6-How-to-use-a-list-of-values
        - generic [ref=f1e1133]:
          - paragraph [ref=f1e1134]:
            - text: 某些表达式可能会提供多个值，例如多皮墙体中的材质（通过
            - emphasis [ref=f1e1135]: material
            - text: 获取）。任何可能返回多个值的表达式始终返回一个列表，因此不能将其当作单个值处理。相反，
            - emphasis [ref=f1e1136]: Quantities
            - text: 提供了用于在列表中搜索值的表达式：
          - table [ref=f1e1138]:
            - rowgroup [ref=f1e1139]:
              - row [ref=f1e1140]:
                - columnheader "**includes**" [ref=f1e1141]
                - columnheader "*element.material includes “Brick”*" [ref=f1e1142]
                - columnheader "在列表中搜索与该文本完全匹配的项目。示例表达式只会找到“Brick”，而不会找到“Red Brickwork”或“Brick – Engineered”等。" [ref=f1e1143]
            - rowgroup [ref=f1e1144]:
              - row [ref=f1e1145]:
                - cell "**contains**" [ref=f1e1146]
                - cell "*element.material contains “Brick”*" [ref=f1e1147]
                - cell "在列表中搜索包含该文本的项目。示例表达式会找到“Brick”、“Red Brickwork”或“Brick – Engineered”等。" [ref=f1e1148]
          - paragraph [ref=f1e1149]:
            - text: 某些列表中的项目（包括
            - emphasis [ref=f1e1150]: materials
            - text: 、
            - emphasis [ref=f1e1151]: properties
            - text: 、
            - emphasis [ref=f1e1152]: parameters
            - text: 等）带有相关联的值，例如
            - emphasis [ref=f1e1153]: material
            - text: 有
            - emphasis [ref=f1e1154]: area
            - text: 和
            - emphasis [ref=f1e1155]: volume
            - text: 。要引用列表中的单个项目，请在括号中添加该项目名称，例如：
          - paragraph [ref=f1e1156]:
            - emphasis [ref=f1e1157]: element.material(“Red Brick”)
          - paragraph [ref=f1e1158]: 请注意，如果在列表中找不到该名称，不会产生任何错误或问题 —— 这仅仅意味着使用该项目的任何计算均为空，即结果始终为零。如果该项目有多个值，可以在其后跟上所需值的表达式，例如特定材质的体积为：
          - paragraph [ref=f1e1159]:
            - emphasis [ref=f1e1160]: element.material(“Red Brick”).volume
          - paragraph [ref=f1e1161]: 某些列表项目也按组组织，包括 ARCHICAD 属性（第 4.4.7 节）和 IFC 属性（第 4.4.11 节）。项目名称可能仅在其所属组内唯一，此时可以用组名作为前缀，如下所示：
          - paragraph [ref=f1e1162]:
            - emphasis [ref=f1e1163]: element.property(“Common::Description”)
          - paragraph [ref=f1e1164]: 此示例将从名为“Common”的组中获取名为“Description”的属性。其他组中的同名属性将被忽略。此时结果为单个值，可以这样使用：
          - paragraph [ref=f1e1165]:
            - emphasis [ref=f1e1166]: element.property(“Common::Description”) startsWith “Fixtures”
          - paragraph [ref=f1e1167]:
            - text: 此示例只有在构件于名为“Common”的组中拥有名为“Description”的属性、且其值以“Fixtures”开头时才会计算为
            - emphasis [ref=f1e1168]: "true"
            - text: ，例如“Fixtures::Sanitary”。如果构件没有该属性或值不匹配，结果为
            - emphasis [ref=f1e1169]: "false"
            - text: 。此类表达式可用作自动附加配方（第 4.5 节）或进行可选测量（第 4.6 节）的基础。
          - paragraph [ref=f1e1170]: 也可以输入一个值列表，与来自 ARCHICAD 的数据进行比较，以避免如下冗长重复的语句：
          - paragraph [ref=f1e1171]:
            - emphasis [ref=f1e1172]: (element.type = “Wall”) or (element.type = “Column”) or (element.type = “Beam”)
          - paragraph [ref=f1e1173]:
            - text: 这样的语句可能长得多，很快就会变得难以编写和阅读。
            - emphasis [ref=f1e1174]: Quantities
            - text: 提供了两个表达式来精简这些语句：
          - table [ref=f1e1176]:
            - rowgroup [ref=f1e1177]:
              - row [ref=f1e1178]:
                - columnheader "**in**" [ref=f1e1179]
                - columnheader "*element.type in (“Wall, “Column”, “Beam”)*" [ref=f1e1180]
                - columnheader "在值列表中搜索与数据值完全匹配的项。在示例中，只有构件类型为“wall”、“column”或“beam”时才匹配。" [ref=f1e1181]
            - rowgroup [ref=f1e1182]:
              - row [ref=f1e1183]:
                - cell "**has**" [ref=f1e1184]
                - cell "*element.material h**as* *(**“Brick”, “**Concrete”)*" [ref=f1e1185]
                - cell "在值列表中搜索与数据值部分匹配的项。在示例中，任何包含“brick”或“concrete”一词的材质名称都匹配，包括“**Brick**work”、“Structural **Concrete**”、“Masonry – Engineered **Brick**-2”" [ref=f1e1186]
          - paragraph [ref=f1e1187]:
            - text: 请注意，这两个表达式既可用于查找与单个数据值（
            - emphasis [ref=f1e1188]: element.type
            - text: ）的匹配，也可用于查找与值列表（
            - emphasis [ref=f1e1189]: element.material
            - text: ）的匹配。
        - generic [ref=f1e1190]:
          - paragraph [ref=f1e1191]:
            - text: Some expressions might provide more than one value, e.g. the materials in a multi-skin wall (retrieved with
            - emphasis [ref=f1e1192]: material
            - text: ). Any expression that can potentially reply with more than one value always responds with a list, so cannot be treated as if it were a single value. Instead,
            - emphasis [ref=f1e1193]: Quantities
            - text: "provides expressions that searches for values in a list:"
          - table [ref=f1e1195]:
            - rowgroup [ref=f1e1196]:
              - row [ref=f1e1197]:
                - columnheader "**includes**" [ref=f1e1198]
                - columnheader "*element.material includes “Brick”*" [ref=f1e1199]
                - columnheader "Searches for an item in the list exactly matching the text. The sample expression would only find “Brick”, not “Red Brickwork” or “Brick – Engineered” etc." [ref=f1e1200]
            - rowgroup [ref=f1e1201]:
              - row [ref=f1e1202]:
                - cell "**contains**" [ref=f1e1203]
                - cell "*element.material contains “Brick”*" [ref=f1e1204]
                - cell "Searches for an item in the list containing the text. The sample expression would find “Brick”, “Red Brickwork” or “Brick – Engineered” etc." [ref=f1e1205]
          - paragraph [ref=f1e1206]:
            - text: The items in some lists, including
            - emphasis [ref=f1e1207]: materials
            - text: ","
            - emphasis [ref=f1e1208]: properties
            - text: ","
            - emphasis [ref=f1e1209]: parameters
            - text: etc, have associated values, e.g. a
            - emphasis [ref=f1e1210]: material
            - text: has an
            - emphasis [ref=f1e1211]: area
            - text: and
            - emphasis [ref=f1e1212]: volume
            - text: ". To reference a single item in a list, add the name of the item in parenthesis, e.g.:"
          - paragraph [ref=f1e1213]:
            - emphasis [ref=f1e1214]: element.material(“Red Brick”)
          - paragraph [ref=f1e1215]: "Note that no errors or problems arise if the name can’t be found in the list – it simply means that any calculations using that item are void, i.e. the result will always be zero. If the item has multiple values, it can be followed with the expression for the required value, e.g. the volume of a specific material would be:"
          - paragraph [ref=f1e1216]:
            - emphasis [ref=f1e1217]: element.material(“Red Brick”).volume
          - paragraph [ref=f1e1218]: "Some list items are also arranged in groups, including ARCHICAD properties (section 4.4.7) and IFC properties (section 4.4.11). The item name might only be unique within its own group, in which case it can be prefixed with the group name as follows:"
          - paragraph [ref=f1e1219]:
            - emphasis [ref=f1e1220]: element.property(“Common::Description”)
          - paragraph [ref=f1e1221]: "This example would retrieve a property called “Description” from a group called “Common”. Properties with the same name in other groups will be ignored. In this case, the result is a single value and can be used like this:"
          - paragraph [ref=f1e1222]:
            - emphasis [ref=f1e1223]: element.property(“Common::Description”) startsWith “Fixtures”
          - paragraph [ref=f1e1224]:
            - text: This example will only calculate as
            - emphasis [ref=f1e1225]: "true"
            - text: if the element has a property called “Description” in a group called “Common” and its value starts with “Fixtures”, e.g. “Fixtures::Sanitary”. If the element doesn’t have that property or the value doesn’t match, the result is
            - emphasis [ref=f1e1226]: "false"
            - text: . An expression like this can be used as the basis for automatically attached recipes (section 4.5) or taking optional measurements (section 4.6).
          - paragraph [ref=f1e1227]: "It is also possible to enter a list of values to be compared to data from ARCHICAD in order to avoid long, repetitive statements like:"
          - paragraph [ref=f1e1228]:
            - emphasis [ref=f1e1229]: (element.type = “Wall”) or (element.type = “Column”) or (element.type = “Beam”)
          - paragraph [ref=f1e1230]:
            - text: Statements like this can be much longer, rapidly becoming tedious to write and difficult to read.
            - emphasis [ref=f1e1231]: Quantities
            - text: "provides two expressions to condense these statements:"
          - table [ref=f1e1233]:
            - rowgroup [ref=f1e1234]:
              - row [ref=f1e1235]:
                - columnheader "**in**" [ref=f1e1236]
                - columnheader "*element.type in (“Wall, “Column”, “Beam”)*" [ref=f1e1237]
                - columnheader "Searches the list of values for an exact match to the data value. In the example, only an element type of “wall”, “column” or “beam” is a match." [ref=f1e1238]
            - rowgroup [ref=f1e1239]:
              - row [ref=f1e1240]:
                - cell "**has**" [ref=f1e1241]
                - cell "*element.material h**as* *(**“Brick”, “**Concrete”)*" [ref=f1e1242]
                - cell "Searches the list of values for a partial match to the data value. In the example, any material name containing the word “brick” or “concrete” is a match including “**Brick**work”, “Structural **Concrete**”, “Masonry – Engineered **Brick**-2”" [ref=f1e1243]
          - paragraph [ref=f1e1244]:
            - text: Note that both these expressions can be used to find a match to a single data value (
            - emphasis [ref=f1e1245]: element.type
            - text: ) or a list of values (
            - emphasis [ref=f1e1246]: element.material
            - text: ).
        - group [ref=f1e1247]:
          - generic "英文原文对照Official English Original" [ref=f1e1248]
      - generic [ref=f1e1249]:
        - generic [ref=f1e1250]:
          - text: "37"
          - heading "4.4.7 如何使用属性" [level=3] [ref=f1e1251]
          - heading "4.4.7 How to use properties" [level=3] [ref=f1e1252]
        - link "MyCi 官方原文 ↗" [ref=f1e1254] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004057096-4-4-7-How-to-use-properties
        - generic [ref=f1e1255]:
          - paragraph [ref=f1e1256]:
            - text: ARCHICAD 属性本身就提供了丰富的计算引擎，应当在数量计算中尽可能充分利用。即使不需要属性之外的任何计算，
            - emphasis [ref=f1e1257]: Quantities
            - text: 也会确保结果被分配到正确的清单条目中。但用
            - emphasis [ref=f1e1258]: Quantities
            - text: 能做的事情远不止这些 —— 访问参数、IFC 属性以及饰面/材质列表等 —— 而属性往往只是包含复杂测量所必需的原始值。
          - paragraph [ref=f1e1259]:
            - text: 请注意，计算中可以包含任何您想要的属性名称 ——
            - emphasis [ref=f1e1260]: Quantities
            - text: 不要求该属性必须存在才接受该表达式（参见上文第 4.4.1 节）。这使得创建适用于各种项目的模板配方变得容易得多。
          - paragraph [ref=f1e1261]: 构件属性的获取方式如下：
          - paragraph [ref=f1e1262]:
            - emphasis [ref=f1e1263]: element.property
          - paragraph [ref=f1e1264]: 构件可能有许多属性，因此结果是一个列表（详见第 4.4.6 节）。我们可以通过指定名称和组来使用某个具体属性的值：
          - paragraph [ref=f1e1265]:
            - emphasis [ref=f1e1266]:
              - text: element.property(“
              - generic [ref=f1e1267]: ::”)
          - paragraph [ref=f1e1268]:
            - text: 属性组名称是可选的，但如果存在多个同名属性（ARCHICAD 允许在不同组中存在同名属性），
            - emphasis [ref=f1e1269]: Quantities
            - text: 将采用它找到的第一个。例如，要从名为
            - emphasis [ref=f1e1270]: Masonry
            - text: 的组中名为
            - emphasis [ref=f1e1271]: Brick volume
            - text: 的属性获取“每块砖的体积”，可以写为：
          - table [ref=f1e1273]:
            - rowgroup [ref=f1e1274]:
              - row [ref=f1e1275]:
                - columnheader "带组：不带组：" [ref=f1e1276]
                - columnheader "*element.property(“Masonry::Brick volume”)element.property(“Brick volume”)*" [ref=f1e1277]
            - rowgroup
          - paragraph [ref=f1e1278]: 为确保该属性仅针对墙体提取，表达式可以写为：
          - paragraph [ref=f1e1279]:
            - emphasis [ref=f1e1280]: wall.property(“Brick volume”)
          - paragraph [ref=f1e1281]:
            - text: 如果要基于名为
            - emphasis [ref=f1e1282]: Masonry – Brick
            - text: 的特定材质计算砖块数量（假设砖体积已计入砂浆），则需要墙体中该材质各皮层的总体积（参见第 4.4.8 节）：
          - paragraph [ref=f1e1283]:
            - emphasis [ref=f1e1284]: wall.material(“Masonry – Brick”).volume
          - paragraph [ref=f1e1285]: 砖块总数的计算会将该体积除以单块砖的体积，如下所示：
          - paragraph [ref=f1e1286]:
            - emphasis [ref=f1e1287]: wall.material(“Masonry – Brick”).volume / wall.property(“Brick volume”)
          - paragraph [ref=f1e1288]:
            - text: 当构件不符合任何必要条件时（不是墙体、没有
            - emphasis [ref=f1e1289]: Masonry – Brick
            - text: 的皮层、没有名为
            - emphasis [ref=f1e1290]: Brick Volume
            - text: 的属性），结果为零（不会发生任何错误，无论是数学错误还是其他错误）。
        - generic [ref=f1e1291]:
          - paragraph [ref=f1e1292]:
            - text: ARCHICAD properties provide a rich calculation engine in their own right and should be exploited as fully as possible for quantity calculations. Even if no calculations outside properties are required,
            - emphasis [ref=f1e1293]: Quantities
            - text: will ensure the results are allocated to the correct bill items. But there is much more you can do with
            - emphasis [ref=f1e1294]: Quantities –
            - text: accessing parameters, IFC properties and lists of finishes/materials etc. – and properties often simply contain raw values essential for complex measurements.
          - paragraph [ref=f1e1295]:
            - text: Note that a calculation can include any property name you like –
            - emphasis [ref=f1e1296]: Quantities
            - text: does not require the property to exist in order to accept the expression (refer to section 4.4.1 above). This makes it far easier to create template recipes that are applicable across a wide range of projects.
          - paragraph [ref=f1e1297]: "Element properties are retrieved in the following way:"
          - paragraph [ref=f1e1298]:
            - emphasis [ref=f1e1299]: element.property
          - paragraph [ref=f1e1300]: "Elements may have many properties, so the result is in a list (see section 4.4.6 for more detail). We can work with the value of a specific value by specifying its name and group:"
          - paragraph [ref=f1e1301]:
            - emphasis [ref=f1e1302]:
              - text: element.property(“
              - generic [ref=f1e1303]: ::”)
          - paragraph [ref=f1e1304]:
            - text: A property group name is optional, but if there are multiple properties with the same name (which ARCHICAD permits in separate groups)
            - emphasis [ref=f1e1305]: Quantities
            - text: will take the first one it finds. For example, to get the ‘volume per brick’ from a property called
            - emphasis [ref=f1e1306]: Brick volume
            - text: in a group called
            - emphasis [ref=f1e1307]: Masonry
            - text: "we could write:"
          - table [ref=f1e1309]:
