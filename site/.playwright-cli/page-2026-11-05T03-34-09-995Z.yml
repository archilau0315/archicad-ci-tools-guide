        - paragraph [ref=f1e1410]:
          - text: 虽然有时必须手动为 BIM 项目构件选择配方，但
          - emphasis [ref=f1e1411]: Quantities
          - text: 的真正力量来自那些自动完成所需测量的规则。通过基于模板化属性、属性项和分类来定义规则，任何依照这些模板建模的项目都可以随时完成造价核算，无需任何额外工作。
        - paragraph [ref=f1e1413]:
          - text: While it is sometimes necessary to manually select a recipe for measuring a BIM project element, the real power of
          - emphasis [ref=f1e1414]: Quantities
          - text: is harnessed through rules that automatically take the required measurements. By defining rules based on templated attributes, properties and classifications, any project modelled from those templates can be costed at any time without any additional effort.
        - group [ref=f1e1415]:
