            - text: 的一项强大功能，使其有别于外部算量工具。虽然算量结果显示在 ARCHICAD 中，但所有数量都与做出贡献的构件相连。
          - list [ref=f1e2135]:
            - listitem [ref=f1e2136]: 对成本有贡献的构件可以在模型中实时交互式查看，包括其在 Quantities 信息板（第 2.2 节）中所分配的属性、分类和配方。这可以快速解释异常成本模式（意外偏低或偏高）的原因，并高亮显示模型或构件属性中不一致之处。
          - list [ref=f1e2137]:
            - listitem [ref=f1e2138]: Quantities 可以区分完全未使用的清单条目与被计算命中但结果仍为零的清单条目。这两种情况都提示存在错误，但原因各不相同。更多信息请参见第 5.2.7 节。
          - paragraph [ref=f1e2139]:
            - text: 要使用此功能，请在面板 3 中选中任意数量的算量条目，然后点击
            - emphasis [ref=f1e2140]: Select
