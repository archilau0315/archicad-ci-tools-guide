        - paragraph [ref=f1e2249]: 第 2.2 节所述的 Quantities 信息板（Info palette）是随着 BIM 项目开发而管理和复核构件特征标记（配方、分类和属性）的重要工具。应用于构件特征标记 —— 尤其是属性值 —— 的颜色和样式有助于暴露不一致之处或遗漏。
        - paragraph [ref=f1e2251]: The Quantities Info palette described in section 2.2 is an important tool for managing and reviewing element traits (recipes, classifications and properties) as the BIM project is developed. The colours and styles applied to element traits – and property values in particular – help to expose inconsistencies or omissions.
