            - text: 单个构件可以包含任意数量的材质，因此表达式
            - emphasis [ref=f1e1337]: element.material
            - text: 提供的是一个列表（详见第 4.4.6 节）。该列表可能为空（例如对于
            - emphasis [ref=f1e1338]: fill
            - text: 构件），也可能是单个项目，但在计算中应始终将其视为列表。它有两种可能的用途：
          - list [ref=f1e1339]:
