        - generic [ref=f1e3790]:
          - paragraph [ref=f1e3791]:
            - text: Expressions to reference element attributes, e.g. materials and finishes (ARCHICAD
            - emphasis [ref=f1e3792]: surfaces
            - text: ). These will typically be prefixed with
            - emphasis [ref=f1e3793]: element
            - text: ", e.g. *element.m**aterial"
            - emphasis [ref=f1e3794]: ", but any specific element type can be used, e.g."
            - text: wall.
            - strong [ref=f1e3795]: m
            - text: aterial*, if attributes are only required for that type.
          - paragraph [ref=f1e3796]:
            - text: Elements often have multiple materials or finishes, so these expressions provide a list instead of a single value. The list can be searched with
            - emphasis [ref=f1e3797]: contains
            - text: (for a partial match) or
            - emphasis [ref=f1e3798]: includes
            - text: (for an exact match). The materials can also be compared to another list of names using
            - emphasis [ref=f1e3799]: has
            - text: (partial match) or
            - emphasis [ref=f1e3800]: in
            - text: (exact match). A single item can be referenced by name in parentheses, e.g.
            - emphasis [ref=f1e3801]: material(“Brick”)
            - text: .
          - paragraph [ref=f1e3802]:
            - text: Refer to section 4.4.6,
            - emphasis [ref=f1e3803]: How to use a list of values
            - text: for more detail.
          - table [ref=f1e3805]:
            - rowgroup [ref=f1e3806]:
              - row [ref=f1e3807]:
                - columnheader "material" [ref=f1e3808]
                - 'columnheader "The list of materials assigned to the element. This is generally a single item, but multi-skin construction elements like walls include every material defined in composites. For a fill, the list will be empty. Referencing a specific material , e.g. *material(“Brick”)*, provides access to additional information about the material application: area: The area of the specified material, e.g. *material(“Brick”).area* volume: The total volume of the specified material, e.g. *material(“Brick”).volume* thickness: The total thickness of skins using the specified material, e.g. *material(“Brick”).t**hickness* skins: The total number of skins using the specified material, e.g. *material(“Brick”).s**kins* See section 4.4.8 for a detailed discussion of materials in expressions." [ref=f1e3809]'
                - columnheader [ref=f1e3810]
            - rowgroup [ref=f1e3811]:
              - row [ref=f1e3812]:
                - cell "finishes" [ref=f1e3813]
                - cell "The list of finishes assigned to the element (ARCHICAD *surfaces*). The list is extracted from the 3D body of the element, so any finish seen in the model will appear in this list. For a fill, the list will be empty. Referencing a specific finish , e.g. *material(“P**aint**”)*, provides access to the total area with that finish applied. See section 4.4.9 for a detailed discussion of finishes in expressions." [ref=f1e3814]
                - cell [ref=f1e3815]
              - row [ref=f1e3816]:
                - cell "fill" [ref=f1e3817]
                - cell "The name of the fill applied to the element. Can be a composite or simple fill name." [ref=f1e3818]
                - cell [ref=f1e3819]
