          - paragraph [ref=f1e1341]: 这在根据材质自动附加配方（参见第 4.5 节）或确定配方应进行哪些测量（参见第 4.6 节）时非常有用。考虑一个用于测量所有砖类型的配方 —— 它可以自动附加到任何材质中包含“brick”一词的墙体：
          - paragraph [ref=f1e1342]: wall.material contains “brick”
