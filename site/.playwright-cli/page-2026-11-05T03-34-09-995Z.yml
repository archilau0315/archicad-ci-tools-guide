          - heading "4.4.9 如何使用饰面" [level=3] [ref=f1e1387]
          - heading "4.4.9 How to use finishes" [level=3] [ref=f1e1388]
        - link "MyCi 官方原文 ↗" [ref=f1e1390] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004150495-4-4-9-How-to-use-finishes
        - paragraph [ref=f1e1392]:
          - text: 出于测量目的，ARCHICAD 的“表面”在测量中被称为“饰面”，以避免与表面积的测量相混淆，并明确其含义。与材质一样，同一构件可以应用任意数量的饰面，因此请求构件的
          - emphasis [ref=f1e1393]: finishes
          - text: 会返回一个项目列表（参见第 4.4.6 节）。其用法与材质完全相同（参见第 4.4.8 节），唯一例外是引用特定饰面（例如
          - emphasis [ref=f1e1394]: wall.finishes("Paint-White")
          - text: ）时会直接给出该饰面所应用的面积，即无需写成
          - emphasis [ref=f1e1395]: wall.finishes("Paint-White").area
          - text: 。
        - paragraph [ref=f1e1397]:
          - text: ARCHICAD ‘Surfaces’ are named ‘Finishes’ for measurement purposes to avoid confusion with measurement of surface area and to clarify the intended meaning. Like materials, there can be any number of finishes applied to the same element, so a request for the element
          - emphasis [ref=f1e1398]: finishes
          - text: delivers a list of items (see section 4.4.6). This can be used in exactly the same way as materials (see section 4.4.8) with the exception that referencing a specific finish, e.g.
          - emphasis [ref=f1e1399]: wall.finishes(“Paint-White”)
          - text: ", directly provides the total area the finish has been applied to, i.e. it is not necessary to write"
          - emphasis [ref=f1e1400]: wall.finishes(“Paint-White”).area
          - text: .
