        - generic [ref=f1e551]:
          - paragraph [ref=f1e552]: Quantities 中的测量定义在配方中，这符合这样一个理念：成本的计算通常是许多"食材"的组合，而不是简单地清点构件的某个属性或将其总计。一个配方可以将任意数量的测量项绑定在一起，每一项测量都可以引用任意组合的构件属性和几何，并通过规则将它们与"贡献到哪个清单条目"以及"何时进行每项测量"关联起来。
          - paragraph [ref=f1e553]: 接下来的各节将从基本的计数配方开始，逐步过渡到实现计算、可选/自动测量，最后以一些常见示例和问题收尾。
          - paragraph [ref=f1e554]: 测量配方在工程量管理器中查看，可通过点击菜单项 CI Tools > Quantities > Quantity Take-off Manager 并选择"配方"选项卡打开。所有 Quantities 面板还都显示一个图标，可快速打开该管理器对话框（
          - paragraph [ref=f1e555]:
            - img "4.2 Measurement Recipes 示意图" [ref=f1e556]
          - paragraph [ref=f1e557]: ）。
          - paragraph [ref=f1e558]:
            - img "4.2 Measurement Recipes 示意图" [ref=f1e559]
          - paragraph [ref=f1e560]: 管理器的主要功能如下：
          - list [ref=f1e561]:
            - listitem [ref=f1e562]: 可选择管理清单结构或测量配方。界面结构体现了清单结构与配方之间的紧密联系。点击 Recipes 以配合本节内容。
          - list [ref=f1e563]:
            - listitem [ref=f1e564]: 不可编辑的清单结构视图，主要用于定义清单条目与测量项之间的关联（更多细节见面板 4）。其功能包括： a. 清单筛选器 —— 输入名称的任何部分即可仅显示匹配的项目。 b. 清单结构。分类可以展开或折叠，且同时包含项目清单和已链接的清单。 c. 更多清单筛选器。"视图方式"菜单主要用于层级化清单结构，可显示"完整 BoQ 结构"（如上图所示）或"扁平清单条目列表"（省略全部分类，仅列出清单条目）。"仅显示未使用项目"会将清单筛选为仅显示尚未链接到配方的项目，有助于确保项目成本未被忽略（参见第 6 节 审计，了解更多质量检查功能）。
          - list [ref=f1e565]:
            - listitem [ref=f1e566]: 配方列表，附带用于创建、删除、导入和导出清单条目的按钮。每个配方前面都有一个复选框，用于切换其启用或停用（停用后该配方不会计算数量）。由该配方进行的测量列在下方的面板中（见下文第 4 项）。可以选择多个项目以快速编辑或删除，但后续面板中只有最靠前的所选配方的测量项可以编辑。
          - list [ref=f1e567]:
            - listitem [ref=f1e568]: 所选配方的属性，包括： a. 一段表达式，可将配方自动附加到目标构件。只要该表达式为真，配方就会附加到相应构件。例如，如果某配方适用于任何含砖材质的墙体，其链接表达式可以是：
          - paragraph [ref=f1e569]: wall.material contains “brick”
          - paragraph [ref=f1e570]: 更多信息见第 4.5 节，表达式示例见第 4.5.6 节。 b. 该配方所进行的测量列表，汇总显示所链接的清单条目键/名称以及数量计算。所选测量项的详情显示在下方面板中（并可编辑）（见下文面板 5）。可以选择多个测量项，但只能查看或编辑最靠前的所选行的详情。 c. 当面板 2 中至少选中一个清单条目时，此按钮可用。点击后，所选清单条目将被添加到配方测量列表中。每个清单条目只能添加到配方一次 —— 任何后续尝试都将被忽略。 d. 当面板 2 中选中了某个项目、且在测量列表中也选中了某个项目时，此按钮可用。点击后，所选清单条目将替换所选测量项原本链接的清单条目。这比先移除旧条目、再添加替换项并重新创建计算要快捷得多。 e. 当在测量列表中选中了某个项目时，此按钮可用。点击后，该项目将从测量列表中移除。
          - list [ref=f1e571]:
            - listitem [ref=f1e572]: 所选测量项的属性（在面板 4 中）。这些表达式决定了何时进行测量以及如何计算： a. 一段可选表达式，用于确定何时应进行测量。如果不输入任何内容，数量计算将应用于该配方所附加的每一个构件。此选项有助于降低 4a 中表达式的复杂度，有助于避免为非常狭窄的用途创建大量配方，并允许配方进行多项针对共同主题的测量。例如，可以创建一个用于计算与砖墙相关数量的配方，其中包含一项计算砖砌拉结件数量的计算 —— 但仅针对相关的墙体。目标墙体可以基于几何、构造和/或属性来查找。另一种用途是测量需要针对各种尺寸定价的产品，例如废料管。该配方可以有一个通用条件，自动附加到相关的排水对象，而与废料管产品相关联的各个清单条目则可以各自带有一段表达式，以确保只计入相关尺寸。Quantities 会立即检查新输入的表达式，并在无法理解时给出反馈。只要该测量项在列表中保持选中，无效表达式的文本就会一直保留；但当选中另一个测量项或配方时，该文本将被丢弃（并恢复先前的文本）。 b. 数量计算。第 4.4 节对此有更深入的讲解，表达式文档详见第 7 节 构件计算表达式。计算的范围非常广，从固定的数值一直到涉及属性、参数、几何、属性项等诸多的复杂表达式。第 4.3.1 节展示了一个仅对每个项目进行计数的简单示例。任何带名称的内容，例如属性项、属性和参数，都可以按名称单独引用，例如墙体中保温层皮层的体积可用以下方式测量：
          - paragraph [ref=f1e573]: wall.material("Insulation").volume
          - paragraph [ref=f1e574]: 如果计算的任何部分无法应用于被测量的构件，Quantities 始终会确保结果为零，例如将上述表达式用于非墙体或没有名为 "Insulation" 的材质的构件时。表达式也可以引用当前项目中并不存在的材质、属性等名称。其目的是允许以通用方式编写计算，从而广泛适用，而不必担心出现一连串的错误消息或无意义的结果，从而支持可在众多项目间共享的模板配方这一理念。Quantities 会立即检查新输入的表达式，并在无法理解时给出反馈。只要该测量项在列表中保持选中，无效表达式的文本就会一直保留；但当选中另一个测量项或配方时，该文本将被丢弃（并恢复先前的文本）。
        - generic [ref=f1e575]:
          - paragraph [ref=f1e576]: Measurements in Quantities are defined in recipes to conform to the concept that calculation of cost is usually a combination of many ingredients rather than simply counting or totalling some property of elements. A recipe can bind together any number of measurements, each of which can reference any combination of element properties and geometry, and couple them with rules governing which bill item they contribute to and when each measurement should be taken.
          - paragraph [ref=f1e577]: The following sections will start with basic counting recipes and work up gradually to implementing calculations, optional/automatic measurements and finishing with some common examples and questions.
          - paragraph [ref=f1e578]: Measurement recipes are viewed in the Quantity Take-off Manager, which can be opened by clicking the menu item CI Tools > Quantities > Quantity Take-off Manager and selecting the Recipes tab. All Quantities palettes also display an icon to quickly open the manager dialog (
          - paragraph [ref=f1e579]:
            - img "4.2 Measurement Recipes 示意图" [ref=f1e580]
          - paragraph [ref=f1e581]: ).
          - paragraph [ref=f1e582]:
            - img "4.2 Measurement Recipes 示意图" [ref=f1e583]
          - paragraph [ref=f1e584]: "The key features of the manager are:"
          - list [ref=f1e585]:
            - listitem [ref=f1e586]: An option to manage either the bill structure or measurement recipes. The UI structure reflects the close bond between the bill structure and recipes. Click Recipes for the purpose of this section.
          - list [ref=f1e587]:
            - listitem [ref=f1e588]: "An uneditable view of the bill structure, primarily for the purpose of defining connections between bill items and measurements (more details in panel 4). Its features include: a. A bill filter – enter any part of a name to show matching items only. b. The bill structure. Categories can be expanded or collapsed, and both the project and linked bills are included. c. Additional bill filters. The View As menu is primarily for hierarchical bill structures and either display the Full BoQ Structure (as shown above) or a Flat Bill Item List (omitting all the categories and just listing bill items). Show unused items only filters the bill to display only items that haven’t been linked to a recipe, useful for ensuring project costs have not been overlooked (see section 6, Auditing for more QA features)."
          - list [ref=f1e589]:
            - listitem [ref=f1e590]: The list of recipes with buttons for creating, deleting, importing and exporting bill items. Each recipe is preceded by a checkbox that toggles it on or off (turning it off prevents the recipe from calculating quantities). Measurements taken by the recipe are listed in the panel below (see 4 below). Multiple items can be selected for quick editing or deletion, but only the measurements for the foremost selected recipe can be edited in the following panels.
          - list [ref=f1e591]:
            - listitem [ref=f1e592]: "The properties of the selected recipe, including: a. An expression that can automatically attach the recipe to target elements. The recipe attaches to any element for which the expression is true. For example, if a recipe is applicable to any wall containing a brick material the linking expression could be:"
          - paragraph [ref=f1e593]: wall.material contains “brick”
          - paragraph [ref=f1e594]: More information can be found in section 4.5 and expression examples in 4.5.6. b. The list of measurements taken by this recipe, summarising the linked bill item key/name and the quantity calculation. The details of the selected measurement are displayed (and can be edited) in the panel below (see panel 5 below). Multiple measurements can be selected, but only the details of the foremost selected row can be viewed or edited. c. This button is enabled when at least one bill item is selected in panel 2. When clicked, the selected bill items are added to the list of recipe measurements. Each bill item can only be added to a recipe once – any additional attempts will be ignored. d. This button is enabled when an item is selected in panel 2 and an item selected in the list of measurements. When clicked, the selected bill item replaces whatever bill item was linked to the selected measurement. This is a much quicker than removing the old item, adding the replacement and recreating the calculations. e. This button is enabled when an item is selected in the list of measurement. When clicked, the item is removed from the list of measurements.
          - list [ref=f1e595]:
            - listitem [ref=f1e596]: "The properties of the selected measurement (in panel 4). These expressions determine when the measurement is taken and how it is calculated: a. An optional expression to determine when the measurement should be taken. If nothing is entered, the quantity calculation will be applied to every element the recipe is attached to. This option can help reduce the complexity of the expression in 4a, help to avoid creating many recipes for very narrow purposes and allow recipes to take many measurements targeting a common theme. For example, a recipe may be created for calculating quantities related to brick walls which includes a calculation for the number of brick ties – but only for relevant walls. Target walls could be found on the basis of the geometry, construction and/or properties. Another use is measuring a product that has to be priced against a wide range of sizes, e.g. waste pipes. The recipe could have a general condition that automatically attaches to relevant drainage objects, but the range of bill items associated with waste pipe products could each have an expression ensuring it only counts the relevant size. Quantities will immediately check a newly entered expression and provide feedback if it can’t be understood. The text of an invalid expression will persist as long as the measurement remains selected in the list, but will be discarded when another measurement or recipe is selected (and the previous text will be restored). b. The quantity calculation. This is covered in more depth in section 4.4, and detailed documentation for expressions can be found in section 7, Element Calculation Expressions. The breadth of calculations is very broad, ranging from a fixed, numeric value through to complex expressions involving properties, parameters, geometry, attributes and much more. A basic example that simply counts each item is shown in section 4.3.1. Anything with a name, e.g. attributes, properties and parameters, can be isolated by name, e.g. the volume of the insulation skin in a wall could be measured with:"
          - paragraph [ref=f1e597]: wall.material("Insulation").volume
          - paragraph [ref=f1e598]: Quantities will always ensure the result is zero if any part of the calculation is can’t be applied to a measured element, for example if the above expression is used on an element that is not a wall or does not have a material called “Insulation”. Expressions can also reference names of materials, properties etc. that do not exist in the current project. The intention is to allow calculations to be written generically for broad applicability without fear of a stream of error messages or bogus results, supporting the concept of template recipes that can be shared across many projects. Quantities will immediately check a newly entered expression and provide feedback if it can’t be understood. The text of an invalid expression will persist as long as the measurement remains selected in the list, but will be discarded when another measurement or recipe is selected (and the previous text will be restored).
        - group [ref=f1e599]:
