        - link "MyCi 官方原文 ↗" [ref=f1e884] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001401756-4-4-1-What-happens-if-a-calculation-relies-on-data-that-doesn-t-exist-in-the-project
        - generic [ref=f1e885]:
          - paragraph [ref=f1e886]: 当计算引用了不存在的数据时 —— 无论出于什么原因 —— 都不会引发错误或中断测量过程。该属性的值被视为空或无值，使用该值的任何计算结果也将变为空，最终得到零/假的结果。这意味着附加配方或执行测量的测试可以包含属性名称 —— 如果该属性不存在，结果为假，相应操作不会执行。
          - paragraph [ref=f1e887]: 这使得创建和维护适用于各种项目的模板配方变得容易得多，即使当前打开的项目完全是空的。
        - generic [ref=f1e888]:
          - paragraph [ref=f1e889]: When a calculation references data that doesn’t exist – for whatever reason – it does not cause an error or interrupt the measurement process. The value for that property is treated as void or empty, and the result of any calculation using that value will also become void, ultimately yielding a zero/false result. This means that the tests for attaching a recipe or actioning a measurement can include a property name – if the property doesn’t exist, the result is false and the action is not taken.
          - paragraph [ref=f1e890]: This makes it far easier to create and maintain template recipes that are applicable across a wide range of projects, even when the currently open project is completely empty.
