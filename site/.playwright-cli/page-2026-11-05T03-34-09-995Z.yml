          - list [ref=f1e1114]:
            - listitem [ref=f1e1115]: Roofs (section 7.24 )
          - paragraph [ref=f1e1116]:
            - text: For example,
            - emphasis [ref=f1e1117]: Opening
            - text: "elements (doors, windows etc) provide the size of the reveals. In every case, prefix the required measurement with the relevant element type, e.g. for opening reveals:"
          - table [ref=f1e1119]:
            - rowgroup [ref=f1e1120]:
