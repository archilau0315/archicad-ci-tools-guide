        - generic [ref=f1e187]:
          - paragraph [ref=f1e188]: 点击 New 按钮（插图中的第 2b 项）。新清单条目将显示在面板 2 中并处于选中状态，其详情显示在面板 3 中。系统会自动分配清单中下一个最高的编号作为键，但该键可以自由编辑。
