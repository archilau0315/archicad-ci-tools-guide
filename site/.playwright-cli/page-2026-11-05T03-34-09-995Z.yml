            - emphasis [ref=f1e1432]: not(element.type = “Wall”)
          - paragraph [ref=f1e1433]: 规则中可以有多个条件，用 "and" 或 "or" 连接。例如，如果排水管线由以下构件表示：
          - list [ref=f1e1434]:
            - listitem [ref=f1e1435]: 属于墙体类型 wall 或梁类型
          - list [ref=f1e1436]:
            - listitem [ref=f1e1437]: …… 且其 ID 中包含文本 "pipe"
          - paragraph [ref=f1e1438]: …… 我们可以写成：
          - paragraph [ref=f1e1439]:
            - emphasis [ref=f1e1440]:
              - text: (element.type = “Wall”
              - strong [ref=f1e1441]: or
              - text: element.type = “Beam”)
              - strong [ref=f1e1442]: and
              - text: element.id contains “pipe”
          - paragraph [ref=f1e1443]: 请注意，对墙体或梁的检查被括在括号内 —— 这意味着会先检查它，即在查看括号外的任何内容之前。即使不加括号，该规则仍然会被接受，但含义会产生歧义 —— 另一种可能的含义是这些构件：
          - list [ref=f1e1444]:
            - listitem [ref=f1e1445]: 属于墙体类型
          - list [ref=f1e1446]:
            - listitem [ref=f1e1447]: …… 或属于梁类型且其 ID 包含 "pipe"
          - paragraph [ref=f1e1448]: …… 这将指向所有墙体以及任何 ID 中包含 "pipe" 的梁。一条实用的准则是：只有当表达式同时组合了 "and" 和 "or" 时才需要括号，并把它们加在包含 "and" 的条件周围。
        - generic [ref=f1e1449]:
          - paragraph [ref=f1e1450]:
            - text: All recipes can define a rule to automatically bind it to target elements – refer to item 4a in the illustration of section 4.2 for
            - emphasis [ref=f1e1451]: Measurement Recipes
            - text: . The rule is an expression which is true for the target elements. If the target is
            - emphasis [ref=f1e1452]: any element of a wall type
            - text: ", the expression would be:"
          - paragraph [ref=f1e1453]:
            - emphasis [ref=f1e1454]: element.type = “Wall”
          - paragraph [ref=f1e1455]:
            - text: Conversely, if we wanted everything that was
            - emphasis [ref=f1e1456]: not
