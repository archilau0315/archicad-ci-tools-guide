        - paragraph [ref=f1e2237]: 在 BIM 项目内交互式地审计算量结果与元数据，是 Quantities 的一项关键功能。审计功能的设计初衷是用于项目开发的各个阶段，而不仅限于在后期形成最终造价估算时才使用，因此它们已融入前几章中所描述的所有工具和流程之中。本章的目的是回顾贯穿项目全生命周期的整体审计流程，并链接到本文档其他位置的详细信息。
        - paragraph [ref=f1e2239]: The ability to audit scheduling quantities and metadata interactively within the BIM project is a key feature of Quantities. Auditing features are designed to be used at every stage of the project development, not just at latter stages as final cost estimates are produced, and are therefore woven into all the tools and processes already described in the previous chapters. The purpose of this chapter is to review the overall auditing process through the project lifecycle with links to detailed information elsewhere in this document.
