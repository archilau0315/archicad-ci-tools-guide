        - generic [ref=f1e1755]:
          - paragraph [ref=f1e1756]: 如果附加配方的规则是自动化测量的唯一机制，那么它很容易需要一个庞大的配方列表，通过细微差异来应对每一种情况。在实践中，许多配方大体的条件相同，只是在数量计算或目标清单条目上略有不同。
          - paragraph [ref=f1e1757]: 这引出了"配方"概念的核心：许多不同的"食材"可以组合在一个方案中。例如，考虑一个大体上用于核算砖砌体成本的配方。只要材质命名恰当，就可以轻松地基于"材质名称包含 brick 一词"这一依据附加配方。即使成本或砖的类型是通过属性来识别的，也存在两个潜在问题：
          - list [ref=f1e1758]:
            - listitem [ref=f1e1759]: 每种砖类型的单价（成本）可能取决于清单或外部数据库中的数据，在这种情况下，每种砖类型的数量将归入不同的条目
          - list [ref=f1e1760]:
            - listitem [ref=f1e1761]: 单个墙体中可能存在多种砖皮层，且其类型或厚度可能各不相同。
          - paragraph [ref=f1e1762]:
            - text: 一旦创建了"brick"配方并附加了指向所有相关墙体的规则，就可以为每个清单条目附加一条规则和一项计算，用以决定何时以及如何进行测量。参见第 4.2 节的插图，注意
            - emphasis [ref=f1e1763]: Recipe
            - emphasis [ref=f1e1764]: Manager
            - text: 的以下特点：
          - list [ref=f1e1765]:
            - listitem [ref=f1e1766]:
              - text: 已添加到配方中的清单条目列表，见
              - link "面板 4" [ref=f1e1767] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ；
          - list [ref=f1e1768]:
            - listitem [ref=f1e1769]:
              - text: 针对所选清单条目进行测量的规则，见
              - link "面板 5，字段 a" [ref=f1e1770] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ；
          - list [ref=f1e1771]:
            - listitem [ref=f1e1772]:
              - text: 所选清单条目的数量计算，见
              - link "面板 5，字段 b" [ref=f1e1773] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ；
          - paragraph [ref=f1e1774]: 对于砖的类型，理想的做法是用材质名称来定义砖的类型（通过供应商代码或产品名称）。例如，如果某种特定砖的材质命名为"Brick – Furness Handbridge Blend 215"，则规则可以是：
          - paragraph [ref=f1e1775]:
            - emphasis [ref=f1e1776]: wall.material includes “Brick – Furness Handbridge Blend 215”
          - paragraph [ref=f1e1777]: ……从而确保当墙体包含该确切砖类型时，数量计算会针对该清单条目进行测量。此后数量计算还可以引用该特定材质的体积，将其除以单块砖的单位体积（此情况下可以把砂浆计入其中，但也有许多其他做法）：
          - paragraph [ref=f1e1778]:
            - emphasis [ref=f1e1779]: wall.material(“Brick – Furness Handbridge Blend 215”).volume / 0.00125
          - paragraph [ref=f1e1780]: 如果数量需要向上取整到最近的整数，则可以写为：
          - paragraph [ref=f1e1781]:
            - emphasis [ref=f1e1782]: roundUp(wall.material(“Brick – Furness Handbridge Blend 215”).volume / 0.00125, 1)
          - paragraph [ref=f1e1783]: 并没有规则来决定何时应新建一个配方，而不是在现有配方中使用可选测量。技术上完全可以只做一个附加到所有构件的配方，让可选测量来分配数量，但该配方以及可选测量的规则很可能复杂而臃肿。反过来，为每一项数量测量都设置不同的配方也是可能的，但这样的列表很可能长得难以实施，且附加规则也会非常复杂。
          - paragraph [ref=f1e1784]: 最佳策略是：让配方面向大体相似的清单条目组或构件组，并让可选测量去处理细节。
        - generic [ref=f1e1785]:
          - paragraph [ref=f1e1786]: If the rule for attaching a recipe was the only mechanism for automated measurement, it could easily necessitate a huge list of recipes with slight variations to account for every situation. In practice, many recipes broadly share the same conditions but differ slightly in either the quantity calculation or target bill item.
          - paragraph [ref=f1e1787]: "This leads to the core of the ‘recipe’ concept, where many different ingredients can be combined in a single solution. Consider, for example, a recipe broadly accounting for the cost of brick masonry. With appropriately named materials, it would be easy to attach a recipe on the basis that the material name contains the word “brick”. Even if the cost or brick type is identified by properties, there are 2 potential problems:"
          - list [ref=f1e1788]:
            - listitem [ref=f1e1789]: The unit rate (cost) for each brick type may depend on data in the bill or an external database, in which case the quantity for each brick type will be allocated to a different item
          - list [ref=f1e1790]:
            - listitem [ref=f1e1791]: There may be multiple brick skins, potentially of different types or thicknesses, in a single wall.
          - paragraph [ref=f1e1792]:
            - text: Once a ‘brick’ recipe has been created with a rule to attach to all relevant walls, all bill items can be attached with a rule and calculation for each governing when and how a quantity is measured. Referring to the illustration in section 4.2, note the following features of the
            - emphasis [ref=f1e1793]: Recipe
            - emphasis [ref=f1e1794]: Manager
            - text: ":"
          - list [ref=f1e1795]:
            - listitem [ref=f1e1796]:
              - text: The list of bill items added to the recipe in
              - link "panel 4" [ref=f1e1797] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ;
          - list [ref=f1e1798]:
            - listitem [ref=f1e1799]:
              - text: The rule for taking a measurement against the selected bill item in
              - link "panel 5, field a" [ref=f1e1800] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ;
          - list [ref=f1e1801]:
            - listitem [ref=f1e1802]:
              - text: The quantity calculation for the selected bill item in
              - link "panel 5, field b" [ref=f1e1803] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ;
          - paragraph [ref=f1e1804]: "For brick types, the material names would ideally define the brick type (by supplier code or product name). If, for example, a specific brick material is named “Brick – Furness Handbridge Blend 215”, the rule could be:"
          - paragraph [ref=f1e1805]:
            - emphasis [ref=f1e1806]: wall.material includes “Brick – Furness Handbridge Blend 215”
          - paragraph [ref=f1e1807]: "…ensuring the quantity calculation take a measurement against the bill item when the wall includes that exact brick type. The quantity calculation could then also reference the volume of that specific material, dividing it by the unit volume of a single brick (mortar could be included in this case, but there are many alternatives):"
