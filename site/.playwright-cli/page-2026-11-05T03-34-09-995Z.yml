            - text: 中的第 2d 项）。
            - emphasis [ref=f1e2142]: Quantities
            - text: 将在当前视图中选中并缩放到所有为所选清单条目成本做出贡献的构件。如果某些条目当前处于隐藏状态，其所在图层将被设为可见。
          - paragraph [ref=f1e2143]:
            - text: 请注意，可能无法在当前视图中看到所有条目，例如当平面图处于激活状态而条目跨越多个楼层时。最佳选择通常是三维窗口，其中除填充图案外的一切均可见。最初计算算量时所依据的视图对此过程没有影响，即您可以从一个视图进行计算，然后在任意其他视图中点击
            - emphasis [ref=f1e2144]: Select
