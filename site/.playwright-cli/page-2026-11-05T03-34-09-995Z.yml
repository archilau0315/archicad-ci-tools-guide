        - generic [ref=f1e49]:
          - paragraph [ref=f1e50]: 特征标记筛选按钮（
          - paragraph [ref=f1e51]:
            - img "2.4.7 How to filter an element selection for those matching specific property values 示意图" [ref=f1e52]
          - paragraph [ref=f1e53]: ）处理属性的方式与处理其他特征标记相同，但它还会将选择集筛选为具有相同属性且取值匹配的构件。如果在面板中选中了多个值，则只要构件的属性和取值与其中任意一项匹配，即可通过筛选。
        - generic [ref=f1e54]:
          - paragraph [ref=f1e55]: The trait filter button (
          - paragraph [ref=f1e56]:
            - img "2.4.7 How to filter an element selection for those matching specific property values 示意图" [ref=f1e57]
          - paragraph [ref=f1e58]: ) works with properties in the same way as other traits, but also filters the selection to elements with the same property and a matching value. If multiple values are selected in the palette, elements with a property and value matching any one of those items will pass the filter.
