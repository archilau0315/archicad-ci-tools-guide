          - heading "7.4 构件属性（材料与饰面）" [level=3] [ref=f1e3756]
          - heading "7.4 Element Attributes" [level=3] [ref=f1e3757]
        - link "MyCi 官方原文 ↗" [ref=f1e3759] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004057896-7-4-Element-Attributes
        - generic [ref=f1e3760]:
          - paragraph [ref=f1e3761]:
            - text: 用于引用构件属性（例如材质和饰面（ARCHICAD 的
            - emphasis [ref=f1e3762]: surfaces
            - text: ））的表达式。这些表达式通常以
            - emphasis [ref=f1e3763]: element
            - text: 为前缀，例如 *element.m**aterial
            - emphasis [ref=f1e3764]: ，但也可以使用任何特定的构件类型，例如
            - text: wall.
            - strong [ref=f1e3765]: m
            - text: aterial*，如果只需要该类型的属性。
          - paragraph [ref=f1e3766]:
            - text: 构件常有多种材质或饰面，因此这些表达式提供的是一个列表而非单个值。该列表可用
            - emphasis [ref=f1e3767]: contains
            - text: （部分匹配）或
            - emphasis [ref=f1e3768]: includes
            - text: （精确匹配）搜索。材质也可以用
            - emphasis [ref=f1e3769]: has
            - text: （部分匹配）或
            - emphasis [ref=f1e3770]: in
            - text: （精确匹配）与另一个名称列表比较。可以按名称用括号引用单个项目，例如
            - emphasis [ref=f1e3771]: material("Brick")
            - text: 。
          - paragraph [ref=f1e3772]:
            - text: 更多信息请参见 4.4.6 节
            - emphasis [ref=f1e3773]: 如何使用值列表
            - text: 。
          - table [ref=f1e3775]:
            - rowgroup [ref=f1e3776]:
              - row [ref=f1e3777]:
                - columnheader "material" [ref=f1e3778]
                - columnheader "分配给构件的材质列表。这通常是单个项目，但像墙体这样的多层（多皮）构造构件会包含复合体中定义的所有材质。对于填充，列表将为空。引用特定材质（例如 *material(\"Brick\")*）可获取关于该材质应用的更多信息： area：指定材质的面积，例如 *material(\"Brick\").area* volume：指定材质的总体积，例如 *material(\"Brick\").volume* thickness：使用指定材质的各皮的总厚度，例如 *material(\"Brick\").t**hickness* skins：使用指定材质的总皮数，例如 *material(\"Brick\").s**kins* 有关表达式中材质的详细讨论，请参见 4.4.8 节。" [ref=f1e3779]
                - columnheader [ref=f1e3780]
            - rowgroup [ref=f1e3781]:
              - row [ref=f1e3782]:
                - cell "finishes" [ref=f1e3783]
                - cell "分配给构件的饰面（ARCHICAD *surfaces*）列表。该列表从构件的三维体量中提取，因此模型中出现的任何饰面都会出现在此列表中。对于填充，列表将为空。引用特定饰面，例如 *material(\"P**aint**\")*，可获取应用该饰面的总面积。有关表达式中饰面的详细讨论，请参见 4.4.9 节。" [ref=f1e3784]
                - cell [ref=f1e3785]
              - row [ref=f1e3786]:
                - cell "fill" [ref=f1e3787]
                - cell "应用于构件的填充名称。可以是复合填充或简单填充的名称。" [ref=f1e3788]
