          - list [ref=f1e1106]:
            - listitem [ref=f1e1107]: Walls (section 7.11 )
          - list [ref=f1e1108]:
            - listitem [ref=f1e1109]: Columns (section 7.14 )
          - list [ref=f1e1110]:
            - listitem [ref=f1e1111]: Beams (section 7.17 )
          - list [ref=f1e1112]:
