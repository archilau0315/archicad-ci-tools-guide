          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004150455-4-4-5-How-to-measure-the-geometry-of-specific-elements
        - generic [ref=f1e1075]:
          - paragraph [ref=f1e1076]: 某些构件类型具有独特的几何特征，包括：
          - list [ref=f1e1077]:
            - listitem [ref=f1e1078]: 区域（第 7.9 节）
          - list [ref=f1e1079]:
            - listitem [ref=f1e1080]: "洞口（第 Error: Reference source not found 节）"
          - list [ref=f1e1081]:
            - listitem [ref=f1e1082]: 墙体（第 7.11 节）
          - list [ref=f1e1083]:
            - listitem [ref=f1e1084]: 柱（第 7.14 节）
          - list [ref=f1e1085]:
            - listitem [ref=f1e1086]: 梁（第 7.17 节）
          - list [ref=f1e1087]:
            - listitem [ref=f1e1088]: 楼板（第 7.22 节）
          - list [ref=f1e1089]:
            - listitem [ref=f1e1090]: 屋顶（第 7.24 节）
          - paragraph [ref=f1e1091]:
            - text: 例如，
            - emphasis [ref=f1e1092]: Opening
            - text: 构件（门、窗等）提供侧壁尺寸。在每种情况下，都要用相关的构件类型作为所需测量的前缀，例如对于洞口侧壁：
          - table [ref=f1e1094]:
            - rowgroup [ref=f1e1095]:
              - row [ref=f1e1096]:
                - columnheader "侧壁宽度：侧壁深度：侧壁表面积：" [ref=f1e1097]
                - columnheader "*opening.widthReveal****opening.depthRevealopening.surfaceReveal*" [ref=f1e1098]
            - rowgroup
          - paragraph [ref=f1e1099]: 请注意，屋顶的放样测量（例如屋脊/斜戗/天沟长度）依赖于 ARCHICAD 中恰当的屋顶边缘标记。
        - generic [ref=f1e1100]:
          - paragraph [ref=f1e1101]: "Some element types have unique geometric characteristics including:"
          - list [ref=f1e1102]:
            - listitem [ref=f1e1103]: Zones (section 7.9 )
          - list [ref=f1e1104]:
