        - generic [ref=f1e4335]:
          - paragraph [ref=f1e4336]: 本节介绍表达式运算符，它们基于 2 个或更多其他值生成一个新值。例如，加法运算符 "+" 会生成两个数的和 —— 因此构件的顶标高可以使用 + 运算符将构件高度与其基准标高相加得到：
          - paragraph [ref=f1e4337]:
            - emphasis [ref=f1e4338]: element.height + element.level
          - paragraph [ref=f1e4339]:
            - text: 有些运算符是单词，例如
            - emphasis [ref=f1e4340]: contains
            - text: ，用于判断一个文本值是否包含另一个文本值，例如：
          - paragraph [ref=f1e4341]:
            - emphasis [ref=f1e4342]: zone.name contains “Office”
          - paragraph [ref=f1e4343]:
            - text: 对于名为 "Supervisor Office" 的区域，结果为
            - emphasis [ref=f1e4344]: "true"
            - text: ；对于 "Utility"，结果为
            - emphasis [ref=f1e4345]: "false"
            - text: 。
          - paragraph [ref=f1e4346]: 表达式中可组合任意数量的运算符、值和函数。
        - generic [ref=f1e4347]:
          - paragraph [ref=f1e4348]: "This section covers expression operators, which produce a new value based on 2 or more other values. For example, the addition operator “+” produces the sum of 2 numbers – so the top level of an element could be obtained using the + operator to add the element height to its base level:"
          - paragraph [ref=f1e4349]:
            - emphasis [ref=f1e4350]: element.height + element.level
          - paragraph [ref=f1e4351]:
            - text: Some operators are words, like
