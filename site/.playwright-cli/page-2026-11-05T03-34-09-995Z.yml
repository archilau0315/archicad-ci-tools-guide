                - cell [ref=f1e3217]
              - row [ref=f1e3218]:
                - cell "length" [ref=f1e3219]
                - cell "The element length, interpreted differently according to type. The generic response is the same as *width*. For linear elements like beams and walls, it returns literally the length along the element path. Columns return height, and slabs return the perimeter length." [ref=f1e3220]
