            - text: This is a powerful feature of
            - emphasis [ref=f1e2147]: Quantities
            - text: that sets it apart from external scheduling tools. While the schedule is displayed in ARCHICAD, all the quantities are connected to the contributing elements.
          - list [ref=f1e2148]:
            - listitem [ref=f1e2149]: T he elements contributing the cost can be interactively inspected live in the model, including their assigned properties, classifications and recipes in the Quantities Info palette (section 2.2). This can quickly explain the reasons for unusual cost patterns (unexpectedly low or high) and highlight inconsistencies in the model or element properties.
          - list [ref=f1e2150]:
            - listitem [ref=f1e2151]: It is possible for Quantities to differentiate between bill items that weren’t used at all vs those that were targeted by a calculation and still yielded a zero result. Both situations suggest an error, but for different reasons. See section 5.2.7 for additional information.
          - paragraph [ref=f1e2152]:
            - text: To use this feature, select any number of scheduled items in panel 3 and click
