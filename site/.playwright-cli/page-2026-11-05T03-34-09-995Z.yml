        - generic [ref=f1e67]:
          - paragraph [ref=f1e68]: 当开启实时编辑（Live Edit）时，可以与添加其他任何特征标记相同的方式添加属性（使用添加特征标记按钮
          - paragraph [ref=f1e69]:
            - img "2.4.8 How to inject a property with a specific value into selected elements 示意图" [ref=f1e70]
          - paragraph [ref=f1e71]: ）。可以通过选中该属性的所有值并将其编辑为所需值来设置取值。
          - paragraph [ref=f1e72]: 另一种方式是，当实时编辑关闭时，将所需属性添加到列表中、设置为所需值，然后点击注入按钮（
          - paragraph [ref=f1e73]:
            - img "2.4.8 How to inject a property with a specific value into selected elements 示意图" [ref=f1e74]
          - paragraph [ref=f1e75]: ）将其设置到所选构件中。
          - paragraph [ref=f1e76]: 这两种做法之间有一个细微差别 —— 前者会在必要时修改构件分类，以确保属性先被附加，然后再设置正确的值；而后者只会为已经拥有该属性的构件设置属性值。
        - generic [ref=f1e77]:
          - paragraph [ref=f1e78]: When Live Edit is on, a property can be added in the same way as any other trait (with the add trait button
          - paragraph [ref=f1e79]:
            - img "2.4.8 How to inject a property with a specific value into selected elements 示意图" [ref=f1e80]
          - paragraph [ref=f1e81]: ). The value can be set by selecting all values of that property and editing it the required value.
          - paragraph [ref=f1e82]: Alternatively, when Live Edit is off, the required property can be added to the list, set to the required value and set in the selected elements by clicking the inject button (
          - paragraph [ref=f1e83]:
            - img "2.4.8 How to inject a property with a specific value into selected elements 示意图" [ref=f1e84]
          - paragraph [ref=f1e85]: ).
          - paragraph [ref=f1e86]: There is a subtle difference in these two approaches – the former will modify the element classification if necessary to ensure the property is attached before setting the correct value, whereas the latter will only set the property value in elements that already have that property.
        - group [ref=f1e87]:
