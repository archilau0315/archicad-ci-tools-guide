            - emphasis [ref=f1e1458]: not(element.type = “Wall”)
          - paragraph [ref=f1e1459]: "There can be multiple conditions in the rule joined with “and” or “or”. If, for example, drainage services are represented by elements that are:"
          - list [ref=f1e1460]:
