            - text: Note that it may not be possible to see all items in the current view, e.g. when the floor plan is active and the items range across multiple storeys. The best option is usually the 3D window, where all but fill patterns are visible. The view the schedule was originally calculated from has no bearing on this process, i.e. you can calculate from one view and click
            - emphasis [ref=f1e2157]: Select
