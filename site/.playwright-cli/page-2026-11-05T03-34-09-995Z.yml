          - paragraph [ref=f1e2273]: 如果项目要完成完整造价，可以认为模型中的大多数建筑构件都会对总量有所贡献。因此，Quantities 提供了一个工具来高亮显示这些构件以便检查。
          - paragraph [ref=f1e2274]: 选择一个适合复核 BIM 项目的视图。三维窗口通常最合适，因为可以选择所有构件（大多数其他视图只显示子集，例如平面图中的某一层）。点击菜单项 CI Tools > Quantities > Select Unquantified Elements…（选择未计量构件）
          - paragraph [ref=f1e2275]: 在当前视图中，所有不会被任何配方（手动或自动）计量的构件都将被选中。
        - generic [ref=f1e2276]:
          - paragraph [ref=f1e2277]: If project is to be fully costed, it can be assumed that the majority of building elements in the model will contribute to the total. Therefore, Quantities provides a tool to highlight these elements for checking.
          - paragraph [ref=f1e2278]: Pick a suitable view for reviewing the BIM project. The 3D window is typically the most suitable because all elements can be selected (most other views only display a sub-selection, e.g. one storey in the floor plan). Click the menu item CI Tools > Quantities > Select Unquantified Elements…
          - paragraph [ref=f1e2279]: All elements that will not be measured by a recipe (manual or automatic) will be selected in the current view.
        - group [ref=f1e2280]:
          - generic "英文原文对照Official English Original" [ref=f1e2281]
