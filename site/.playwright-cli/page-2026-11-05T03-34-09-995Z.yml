          - paragraph [ref=f1e1375]: "The name must be an exact match, e.g. the above would not find “Red Brick 1”. The material quantities include:"
          - paragraph [ref=f1e1376]: area
          - paragraph [ref=f1e1377]: element.material(“Red Brick”). area
          - paragraph [ref=f1e1378]: T he floor plan area
          - paragraph [ref=f1e1379]: volume
          - paragraph [ref=f1e1380]: element.material(“Red Brick”). volume
          - paragraph [ref=f1e1381]: T he total volume
          - paragraph [ref=f1e1382]: I f an element contains multiple skins matching the specified material, area and volume will total up the quantities from them all.
