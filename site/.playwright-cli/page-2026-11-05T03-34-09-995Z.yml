          - paragraph [ref=f1e1469]: "Note that the check for a wall or beam are enclosed in parentheses – this means it will be checked first, i.e. before looking at anything outside the parentheses. The rule would still be accepted without them, but the meaning is ambiguous – another possible meaning is the elements are:"
