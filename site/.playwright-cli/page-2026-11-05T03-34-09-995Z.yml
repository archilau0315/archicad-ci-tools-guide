        - generic [ref=f1e537]:
          - paragraph [ref=f1e538]: 标准化的测量方法是 Quantities 的核心，它定义了应如何以及何时从 ARCHICAD 模型构件中计算数量。
          - paragraph [ref=f1e539]: 除基本的设施和配件计数之外，构件很少与单个清单条目存在简单关联。一面墙可能对外墙覆面、多种构造材料（包括保温层）、配筋、内部/外部饰面的任意组合以及更多内容都有所贡献。不仅如此，一个构件所代表的构造可能并不与其绘制所用工具所暗示的相同，例如一面墙可能代表管沟，可以对其开挖、支护、基础/垫层、人工、敷设长度（管道/电缆等）、设备租赁以及任意数量的其他构件进行计量。
        - generic [ref=f1e540]:
          - paragraph [ref=f1e541]: Standardised measurement methods are at the heart of Quantities, defining how and when a quantity should be calculated from an ARCHICAD model element.
          - paragraph [ref=f1e542]: Elements rarely have a simple connection to a single bill item, apart from a basic count of fixtures and fittings. A single wall could contribute to external cladding, multiple construction materials(including insulation), reinforcing, any combination of internal/external finishes and much more. And beyond that, an element could represent construction not suggested by the tool it was drawn with, e.g. a wall representing a services trench that could be measured for excavation, retaining, foundation/bedding, labour, service runs length (pipe/cable etc), equipment hire and any number of other components.
