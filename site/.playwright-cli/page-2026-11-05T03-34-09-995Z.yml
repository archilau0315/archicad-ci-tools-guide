          - text: "02"
          - heading "2.4.8 如何将具有特定值的属性注入所选构件" [level=3] [ref=f1e63]
          - heading "2.4.8 How to inject a property with a specific value into selected elements" [level=3] [ref=f1e64]
        - link "MyCi 官方原文 ↗" [ref=f1e66] [cursor=pointer]:
