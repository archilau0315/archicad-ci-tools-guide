        - generic [ref=f1e3186]:
          - paragraph [ref=f1e3187]: Expressions that can be applied to any BIM element to retrieve generic measurements like bounding size.
          - paragraph [ref=f1e3188]: These will typically be prefixed with element, e.g. element.length, in order to make the measurement applicable to any element type, but any specific element type can be used, e.g. wall.length, if the measurement is only required for that type. Restricting the measurement to a single element type does not cause an error – the result of the calculation is simply voided for any other types.
          - paragraph [ref=f1e3189]: Also refer to section 4.4.4 for more detail about using element geometry in calculations.
          - table [ref=f1e3191]:
            - rowgroup [ref=f1e3192]:
              - row [ref=f1e3193]:
                - columnheader "level" [ref=f1e3194]
                - columnheader "The base level of the element (from project zero)" [ref=f1e3195]
                - columnheader [ref=f1e3196]
            - rowgroup [ref=f1e3197]:
              - row [ref=f1e3198]:
                - cell "width" [ref=f1e3199]
                - cell "The element width, typically of the bounding box. Beams and columns return their profile width" [ref=f1e3200]
                - cell [ref=f1e3201]
              - row [ref=f1e3202]:
                - cell "depth" [ref=f1e3203]
                - cell "The element depth, typically of the bounding box. Beams and columns return their profile width" [ref=f1e3204]
                - cell [ref=f1e3205]
              - row [ref=f1e3206]:
                - cell "height" [ref=f1e3207]
                - cell "The element height, typically of the bounding box" [ref=f1e3208]
                - cell [ref=f1e3209]
              - row [ref=f1e3210]:
                - cell "heightMin" [ref=f1e3211]
                - cell "Generally the same as height. The exceptions are walls and columns, which will respond with the least height differential when they have a sloped base/top" [ref=f1e3212]
                - cell [ref=f1e3213]
              - row [ref=f1e3214]:
                - cell "heightMax" [ref=f1e3215]
