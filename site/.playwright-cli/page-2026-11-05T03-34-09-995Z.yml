          - heading "8.3 数量取整" [level=3] [ref=f1e4280]
          - heading "8.3 Rounding Quantities" [level=3] [ref=f1e4281]
        - link "MyCi 官方原文 ↗" [ref=f1e4283] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004155435-8-3-Rounding-Quantities
        - generic [ref=f1e4284]:
          - paragraph [ref=f1e4285]: 将数字取整到指定的增量或模数尺寸。有三种不同版本：
          - list [ref=f1e4286]:
            - listitem [ref=f1e4287]: round(<值>, <模数尺寸>) ：取整到最接近的模数，例如 round(1.275, 0.100) = 1.300
          - list [ref=f1e4288]:
            - listitem [ref=f1e4289]: roundUp(<值>, <模数尺寸>) ：如果该值不是恰好落在模数尺寸上，则向上取整到下一个，例如 round(1.210, 0. 100) = 1.300
          - list [ref=f1e4290]:
            - listitem [ref=f1e4291]: roundDown(<值>, <模数尺寸>) ：如果该值不是恰好落在模数尺寸上，则向下取整到上一个，例如 round(1.275, 0. 100) = 1.200
          - paragraph [ref=f1e4292]:
            - text: 如果未指定模数尺寸，则假定为 1，例如
            - emphasis [ref=f1e4293]: round(3.75)
            - text: = 4.00。
        - generic [ref=f1e4294]:
          - paragraph [ref=f1e4295]: "Rounds a number to a specified increment or module size. There are three different versions:"
          - list [ref=f1e4296]:
            - listitem [ref=f1e4297]:
              - text: round(
              - generic [ref=f1e4298]: ", ) : Rounds to the nearest module, e.g. round(1.275, 0.100) = 1.300"
          - list [ref=f1e4299]:
            - listitem [ref=f1e4300]:
              - text: roundUp(
              - generic [ref=f1e4301]: ", ) : If the value isn’t exactly on a module size, it rounds up to the next, e.g. round(1.210, 0. 100) = 1.300"
          - list [ref=f1e4302]:
            - listitem [ref=f1e4303]:
              - text: roundDown(
              - generic [ref=f1e4304]: ", ) : If the value isn’t exactly on a module size, it rounds down to the previous, e.g. round(1.275, 0. 100) = 1.200"
          - paragraph [ref=f1e4305]:
            - text: If a module size isn’t specified, it’s assumed to be 1, e.g.
            - emphasis [ref=f1e4306]: round(3.75)
            - text: = 4.00.
        - group [ref=f1e4307]:
          - generic "英文原文对照Official English Original" [ref=f1e4308]
