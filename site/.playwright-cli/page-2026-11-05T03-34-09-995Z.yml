      - generic [ref=f1e89]:
        - generic [ref=f1e90]:
          - text: "03"
          - heading "3.1 背景" [level=3] [ref=f1e91]
          - heading "3.1 Background" [level=3] [ref=f1e92]
        - link "MyCi 官方原文 ↗" [ref=f1e94] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393675-3-1-Background
        - generic [ref=f1e95]:
          - paragraph [ref=f1e96]: 建筑项目通常通过工程量清单来定价，将建造内容分解为离散的、明确理解的、成本已知的条目。条目列表可能非常庞大，因此通常以层级方式组织：顶部是宽泛的分类，越往下描述越加细致。对建筑构件进行测量，并将数量记入相应的清单条目。一面墙可能对许多不同的成本都有贡献，例如砖/砌块/骨架、保温层和饰面。
          - paragraph [ref=f1e97]: 清单结构可以在内部自行编制、逐个项目定制，也可以从外部数据源导入，例如数据库或基于云的数据源。该软件的设计旨在涵盖上述所有情形，并计划在未来提供额外的连接能力，以直接链接第三方工程量清单。
          - paragraph [ref=f1e98]: 本节讨论不同类型的清单结构，以及创建、导入、编辑和导出的方法。
        - generic [ref=f1e99]:
          - paragraph [ref=f1e100]: Building projects are typically priced in a bill of quantities, breaking the construction down into discrete, well-understood items of a known cost. The list of items can be very large, so is typically arranged in a hierarchy with broad categories at the top and increasing detailed descriptions at the lower levels. Building elements are measured and quantities entered against applicable bill items. A single wall could potentially contribute to many different costs, e.g. bricks/blocks/framing, insulation and finishes.
          - paragraph [ref=f1e101]: The bill structure may be developed in-house, customised project-by-project or imported from an external source, e.g. database or cloud-based. The software is designed to provide for all of these scenarios, and additional connectivity is planned for direct links to 3rd-party bills of quantity in future.
          - paragraph [ref=f1e102]: This section discusses different types of bill structures, with methods for creating, importing, editing and exporting.
        - group [ref=f1e103]:
          - generic "英文原文对照Official English Original" [ref=f1e104]
      - generic [ref=f1e105]:
        - generic [ref=f1e106]:
          - text: "04"
          - heading "3.2 清单结构" [level=3] [ref=f1e107]
          - heading "3.2 Bill structure" [level=3] [ref=f1e108]
        - link "MyCi 官方原文 ↗" [ref=f1e110] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393695-3-2-Bill-structure
        - generic [ref=f1e111]:
          - paragraph [ref=f1e112]: 清单可以采用 2 种方式组织，以反映项目和工作流程的需求：
          - list [ref=f1e113]:
            - listitem [ref=f1e114]: 简单型
          - paragraph [ref=f1e115]: 清单只是一个扁平的条目列表，即没有分类。这可能适合规模较小的项目，或只需对部分可能的条目或工种进行报价的工作流程。条目以标准图标显示在 Project Bill 之下：
          - paragraph [ref=f1e116]:
            - img "3.2 Bill structure 示意图" [ref=f1e117]
          - list [ref=f1e118]:
            - listitem [ref=f1e119]: 层级型
          - paragraph [ref=f1e120]: 大型 BoQ 中的条目若按分类分组为树状结构（可能有多层深），管理起来会更容易。除了便于查找特定条目之外，分类还将相似条目归拢在一起，并在算量时提供小计。分类以文件夹图标显示，并按类似标准文件系统的树状结构排列：
          - paragraph [ref=f1e121]:
            - img "3.2 Bill structure 示意图" [ref=f1e122]
          - paragraph [ref=f1e123]: 可以通过相邻的箭头显示或隐藏分类的内容。请注意，Quantities 提供了在某些视图中省略分类的选项，仅以扁平列表显示条目。
          - paragraph [ref=f1e124]: 层级中任何条目的完整键都会自动加上其父分类的键作为前缀，例如：
          - paragraph [ref=f1e125]:
            - img "3.2 Bill structure 示意图" [ref=f1e126]
          - paragraph [ref=f1e127]: 清单结构对软件的其他功能没有影响，并且可以随时更改。请注意，尽管清单条目键中包含父分类的键，但仍可以通过手动添加分类键来省略层级中的任意部分，例如扁平列表中的条目可以直接被赋予键'10.24.73'。这些不同的做法可以混用，例如创建一个部分层级，并手动为任何被省略的分类的子条目加上键前缀。
          - paragraph [ref=f1e128]: 另请注意，带有计算数量的清单条目无论结构如何，都会以扁平列表形式导出为 CSV，便于导入电子表格，并符合条目编号、描述、单位、数量、单价和总金额的标准表头（详见第 5.2.5 节）。
        - generic [ref=f1e129]:
          - paragraph [ref=f1e130]: "The bill can be structured in 2 ways to reflect the requirements of the project and workflow:"
          - list [ref=f1e131]:
            - listitem [ref=f1e132]: Simple
          - paragraph [ref=f1e133]: "The bill is simply a flat list of items, i.e. no categories. This may suit smaller projects or workflows that only price a subset of possible items or trades. Items are displayed with a standard icon under the Project Bill:"
          - paragraph [ref=f1e134]:
            - img "3.2 Bill structure 示意图" [ref=f1e135]
          - list [ref=f1e136]:
            - listitem [ref=f1e137]: Hierarchical
          - paragraph [ref=f1e138]: "Items in a large BoQ are easier to manage when grouped into categories in a tree structure, potentially multiple levels deep. In addition to making it easier to find a specific item, categories group similar items together and provide sub-totals when scheduled. Categories are displayed with a folder icon and arranged in a tree structure similar to standard file systems:"
          - paragraph [ref=f1e139]:
            - img "3.2 Bill structure 示意图" [ref=f1e140]
          - paragraph [ref=f1e141]: The content of a category can be revealed or hidden with the adjacent arrow. Note that Quantities provides an option to omit the categories in some views, displaying just the items in a flat list.
          - paragraph [ref=f1e142]: "The full key of any item in a hierarchy is automatically prefixed with the keys of any parent categories, e.g.:"
          - paragraph [ref=f1e143]:
            - img "3.2 Bill structure 示意图" [ref=f1e144]
          - paragraph [ref=f1e145]: The bill structure has no effect on other software functionality and can be changed at any time. Note that although bill item keys include the keys of parent categories, it is possible to omit any part of the hierarchy by manually adding category keys, e.g. an item in a flat list could be directly assigned the key ‘10.24.73’. These different approaches can be mixed, e.g. creating a partial hierarchy and manually prefixing the keys of any omitted categories to the child items.
          - paragraph [ref=f1e146]: Also note that bill items are exported to CSV with calculated quantities in a flat list irrespective of the structure, suitable for import to a spreadsheet and conforming to standard headings of item number, description, unit, quantity, rate and total amount (see section 5.2.5 for more detail).
        - group [ref=f1e147]:
          - generic "英文原文对照Official English Original" [ref=f1e148]
      - generic [ref=f1e149]:
        - generic [ref=f1e150]:
          - text: "05"
          - heading "3.3 创建和管理清单结构" [level=3] [ref=f1e151]
          - heading "3.3 Creating and managing a Bill structure" [level=3] [ref=f1e152]
        - link "MyCi 官方原文 ↗" [ref=f1e154] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001401136-3-3-Creating-and-managing-a-Bill-structure
        - generic [ref=f1e155]:
          - paragraph [ref=f1e156]: 工程量清单可以在工程量管理器中查看和编辑，可通过点击菜单项 CI Tools > Quantities > Quantity Take-off Manager 并选择"清单结构"选项卡打开。所有 Quantities 面板还都显示一个图标，可快速打开该管理器对话框。
          - paragraph [ref=f1e157]:
            - img "3.3 Creating and managing a Bill structure 示意图" [ref=f1e158]
          - paragraph [ref=f1e159]: 管理器的主要功能如下：
          - list [ref=f1e160]:
            - listitem [ref=f1e161]: 可选择管理清单结构或测量配方。点击 Bill Structure 以配合本节内容。
          - list [ref=f1e162]:
            - listitem [ref=f1e163]: 清单结构概览，附带用于创建、删除、导入和导出清单条目的按钮。所选条目的详情显示在下方面板中（见下文第 3 项）。清单结构以当前打开项目的名称为标题。项目之下的下一项以 Project Bill 为标题。在管理器中创建的任何条目都显示在该标题之下；它们保存在项目文件中，且只能应用于当前项目。如果有清单结构从外部数据源（例如外部文件或数据库）链接到本项目，它将显示在单独的标题之下且不可编辑（详见第 3.3.7 节和第 3.3.8 节）。可以选择多个项目以快速编辑或删除。
          - list [ref=f1e164]:
            - listitem [ref=f1e165]: 所选清单条目的详情。如果选中了多个项目，则只显示第一个项目的详情。以下字段可以对多个项目同时编辑，但键和名称除外（键和名称只会更改第一个项目）。 a. 条目键。它可以是字母和数字的任意组合，但不应与同一层级中的任何其他条目重复（为了清晰起见，因为计算出的项目数量会在算量表中针对该键进行登记）。这些键通常反映既有的构造分类体系，例如 Uniclass。完整的条目键显示在此字段旁。当条目以层级方式归入某个分类之下时，完整键会在条目键前加上祖先分类的键，例如'10.24.73'。如果清单是扁平列表（即没有分类），则键与完整键相同。 b. 条目标题。可以输入任何内容。 c. 可选的外部引用，例如制造商或外部数据库代码，仅供信息参考。此信息会包含在导出的算量表中。 d. 单价，即每单位成本。如果成本是依据导出的数量在外部计算的，可以为零。 e. 计量单位，例如'metre'、'mm'、'each'，在弹出菜单中显示。这些项目由用户自行定义 —— 更多信息参见第 3.3.5 节。 f. 可选的描述，通常用于说明应计量什么（或如何计量）。此信息不包含在算量表中。
          - paragraph [ref=f1e166]: 请注意，只有点击 OK 按钮后对清单结构的更改才会生效。如果点击 Cancel，则所有更改都将被丢弃。
        - generic [ref=f1e167]:
          - paragraph [ref=f1e168]: The BoQ can be viewed and edited in the Quantity Take-off Manager, which can be opened by clicking the menu item CI Tools > Quantities > Quantity Take-off Manager and selecting the Bill Structure tab. All Quantities palettes also display an icon to quickly open the manager dialog.
          - paragraph [ref=f1e169]:
            - img "3.3 Creating and managing a Bill structure 示意图" [ref=f1e170]
          - paragraph [ref=f1e171]: "The key features of the manager are:"
          - list [ref=f1e172]:
            - listitem [ref=f1e173]: An option to manage either the bill structure or measurement recipes. Click Bill Structure for the purpose of this section.
          - list [ref=f1e174]:
            - listitem [ref=f1e175]: An overview of the bill structure with buttons for creating, deleting, importing and exporting bill items. Details of the selected item are shown in the panel below (see 3 below). The bill structure is headed up with the name of the open project. The next item under the project is headed up Project Bill. Any items created in the manager are displayed under this heading; they are saved in the project file and can only be applied to the current project. If a bill structure is linked to this project from an eternal source, e.g. an external file or database, it will be displayed under a separate heading and cannot be edited (see sections 3.3.7 and 3.3.8 for more details). Multiple items can be selected for quick editing or deletion.
          - list [ref=f1e176]:
            - listitem [ref=f1e177]: Details of the selected bill item. If multiple items are selected, only the details of the first are displayed. The following fields can be edited for multiple items simultaneously apart from the key and name (where only the first item will be changed). a. The item key. It can be any combination or letters and numbers, but should not duplicate any other item at the same level (for clarity, because calculated project quantities will be set against the key in the schedule). The keys often reflect established construction classification systems, e.g. Uniclass. The full item key is displayed beside this field. When the item is arranged in a hierarchy under a category, the full key is prefixes the ancestor category keys to the item key, e.g. ‘10.24.73’. If the bill is a flat list, i.e. no categories, the key and full key are the same. b. The item title. Anything can be entered. c. An optional external reference, e.g. a manufacturer or external database code, for informational purposes only. This information is included in exported schedules. d. Rate, i.e. cost per unit. Can be zero if the costing is calculated externally based on exported quantities. e. Unit of measurement, e.g. ‘metre’, ‘mm’, ‘each’, displayed in a popup menu. These items are user-defined – refer to section 3.3.5 for more information. f. An optional description, usually to clarify what should be measured (or how). This information is not included in the schedule.
          - paragraph [ref=f1e178]: Note that changes to the bill structure only become permanent the OK button is clicked. If Cancel is clicked, all changes will be discarded.
        - group [ref=f1e179]:
          - generic "英文原文对照Official English Original" [ref=f1e180]
