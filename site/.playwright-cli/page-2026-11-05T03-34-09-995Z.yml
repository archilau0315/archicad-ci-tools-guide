          - paragraph [ref=f1e2204]: "The menu options are used to filter the displayed items as follows:"
          - list [ref=f1e2205]:
            - listitem [ref=f1e2206]: Ca lculated items Only bill items with a calculated non-zero total are shown.
          - list [ref=f1e2207]:
            - listitem [ref=f1e2208]: All bill items All bill items are shown
          - list [ref=f1e2209]:
            - listitem [ref=f1e2210]: Zero quantities Only bill items that processed a measurement calculation during the scheduling process but still have a zero total are shown
          - list [ref=f1e2211]:
