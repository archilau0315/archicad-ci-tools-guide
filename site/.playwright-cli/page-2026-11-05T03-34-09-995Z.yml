                - cell [ref=f1e3125]
              - row [ref=f1e3126]:
                - cell "height" [ref=f1e3127]
                - cell "构件高度，通常为包围盒的高度" [ref=f1e3128]
                - cell [ref=f1e3129]
              - row [ref=f1e3130]:
                - cell "heightMin" [ref=f1e3131]
                - cell "通常与 height 相同。例外情况是墙体和柱，当其底/顶为斜面时返回最小的高度差值" [ref=f1e3132]
                - cell [ref=f1e3133]
              - row [ref=f1e3134]:
                - cell "heightMax" [ref=f1e3135]
