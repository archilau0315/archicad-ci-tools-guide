            - emphasis [ref=f1e1812]: roundUp(wall.material(“Brick – Furness Handbridge Blend 215”).volume / 0.00125, 1)
          - paragraph [ref=f1e1813]: There is no rule for deciding when a new recipe is preferable to an optional measurement in an existing recipe. It’s technically possible to make just one recipe that is attached to all elements and allow optional measurements to allocate quantities, but that recipe and the rules for optional measurements would likely be complex and bloated. Conversely it’s also possible to have a different recipe for every quantity measurement, but the list would likely be impracticably long and the attachment rules would be complicated.
          - paragraph [ref=f1e1814]: The best strategy is to target recipes to groups of bill items or elements that are broadly similar, and allow the optional measurements to take care of the detail.
