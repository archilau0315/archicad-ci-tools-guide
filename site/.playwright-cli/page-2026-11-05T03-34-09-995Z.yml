          - heading "8.1 概述" [level=3] [ref=f1e4220]
          - heading "8.1 Overview" [level=3] [ref=f1e4221]
        - link "MyCi 官方原文 ↗" [ref=f1e4223] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004151455-8-1-Overview
        - paragraph [ref=f1e4225]:
          - text: 本节介绍函数表达式，它们接收数据并以某种方式对其进行修改。例如，
          - emphasis [ref=f1e4226]: not
          - text: 将
          - emphasis [ref=f1e4227]: "true"
          - text: 值变为
          - emphasis [ref=f1e4228]: "false"
          - text: （反之亦然）
        - paragraph [ref=f1e4230]:
          - text: This section covers function expressions, which take data and modifies it some way. For example,
          - emphasis [ref=f1e4231]: not
          - text: turns a
          - emphasis [ref=f1e4232]: "true"
          - text: value into
          - emphasis [ref=f1e4233]: "false"
          - text: (and vice versa)
        - group [ref=f1e4234]:
          - generic "英文原文对照Official English Original" [ref=f1e4235]
      - generic [ref=f1e4236]:
        - generic [ref=f1e4237]:
          - text: "91"
          - heading "8.2 Not" [level=3] [ref=f1e4238]
          - heading "8.2 Not" [level=3] [ref=f1e4239]
        - link "MyCi 官方原文 ↗" [ref=f1e4241] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004058316-8-2-Not
        - generic [ref=f1e4242]:
          - paragraph [ref=f1e4243]:
            - text: 将
            - emphasis [ref=f1e4244]: "true"
            - text: 值反转为
            - emphasis [ref=f1e4245]: "false"
            - text: （反之亦然）。当表达与所需内容相反的情况更为容易时，这非常有用。
          - paragraph [ref=f1e4246]:
            - text: 假设有一条规则要查找没有 "Paint" 饰面的构件。查找
            - emphasis [ref=f1e4247]: 确实
            - text: 有 Paint 饰面的构件非常简单，只需写：
          - paragraph [ref=f1e4248]:
            - emphasis [ref=f1e4249]: element.finish contains “Paint”
          - paragraph [ref=f1e4250]:
            - text: ……但我们希望知道何时结果
            - emphasis [ref=f1e4251]: 不
            - text: 成立。因此只需写：
          - paragraph [ref=f1e4252]:
            - emphasis [ref=f1e4253]: not(element.finish contains “Paint”)
          - paragraph [ref=f1e4254]:
            - text: 此函数用于处理 true/false 值。如果接收到的是数值，则
            - emphasis [ref=f1e4255]: 零
            - text: 会被解释为
            - emphasis [ref=f1e4256]: "false"
            - text: ，其他任何值解释为
            - emphasis [ref=f1e4257]: "true"
            - text: 。文本通常会被解释为
            - emphasis [ref=f1e4258]: "false"
            - text: ，除非该文本是 "true" 或 "false"，或可被解释为数字，例如 "3.0"。
        - generic [ref=f1e4259]:
          - paragraph [ref=f1e4260]:
            - text: Inverts a
            - emphasis [ref=f1e4261]: "true"
            - text: value into
            - emphasis [ref=f1e4262]: "false"
            - text: (and vice versa). This can be very useful when it’s easier to express the opposite of what you want.
          - paragraph [ref=f1e4263]:
            - text: Consider a rule should find elements that don’t have a “Paint” finish. It’s very easy to find elements that
            - emphasis [ref=f1e4264]: do
            - text: "have a paint finish by writing:"
          - paragraph [ref=f1e4265]:
            - emphasis [ref=f1e4266]: element.finish contains “Paint”
          - paragraph [ref=f1e4267]:
            - text: …but we want to know when that’s
            - emphasis [ref=f1e4268]: not
            - text: "true. So we can simply write:"
          - paragraph [ref=f1e4269]:
            - emphasis [ref=f1e4270]: not(element.finish contains “Paint”)
          - paragraph [ref=f1e4271]:
            - text: This function is intended to work on true/false values. If it receives a numeric value,
            - emphasis [ref=f1e4272]: zero
            - text: is interpreted as
            - emphasis [ref=f1e4273]: "false"
            - text: and anything else as
            - emphasis [ref=f1e4274]: "true"
            - text: . Text will generally be interpreted as
            - emphasis [ref=f1e4275]: "false"
            - text: ", unless the text is “true” or “false” or can be interpreted as a number, e.g. “3.0”."
        - group [ref=f1e4276]:
          - generic "英文原文对照Official English Original" [ref=f1e4277]
