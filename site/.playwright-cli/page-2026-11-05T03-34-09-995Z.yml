        - generic [ref=f1e3106]:
          - paragraph [ref=f1e3107]: 可应用于任何 BIM 构件以获取包围尺寸等通用测量值的表达式。
          - paragraph [ref=f1e3108]: 这些表达式通常以 element 为前缀，例如 element.length，以便使该测量适用于任何构件类型，但也可以使用任何特定的构件类型，例如 wall.length，如果该测量仅对某种类型是必需的。将测量限定为单一构件类型不会导致错误 —— 计算结果只是对其他类型无效。
          - paragraph [ref=f1e3109]: 关于在计算中使用构件几何的更多细节，另请参见 4.4.4 节。
          - table [ref=f1e3111]:
            - rowgroup [ref=f1e3112]:
              - row [ref=f1e3113]:
