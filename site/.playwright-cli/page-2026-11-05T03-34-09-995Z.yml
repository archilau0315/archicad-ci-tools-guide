          - paragraph [ref=f1e1369]: wall.m aterial includes “Brick – Furness Handbridge Blend 215”
          - paragraph [ref=f1e1370]: The associated quantity calculation will only be made when the wall includes a material exactly matching the name “Brick – Furness Handbridge Blend 215”.
          - list [ref=f1e1371]:
            - listitem [ref=f1e1372]: Calculating geometric material quantities
          - paragraph [ref=f1e1373]: "Every material in a list has an area and volume that can be used in quantity calculations. A specific material can be referenced in a list by appending its name, e.g. for a material called “Red Brick”:"
