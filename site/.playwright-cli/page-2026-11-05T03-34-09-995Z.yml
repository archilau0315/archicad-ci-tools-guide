            - text: 中的第 4a 项）在跟踪清单条目的使用情况方面发挥着关键作用：
          - paragraph [ref=f1e2171]:
            - img "5.2.7 How to audit correct bill item usage 示意图" [ref=f1e2172]
          - paragraph [ref=f1e2173]: 该菜单的选项用于筛选所显示的项目，如下：
          - list [ref=f1e2174]:
            - listitem [ref=f1e2175]: 已计算的条目 仅显示计算后总计不为零的清单条目。
