        - generic [ref=f1e999]:
          - paragraph [ref=f1e1000]: 所有几何构件测量值，例如高度、面积、体积，都是基于米的公制，即任何长度测量以米计，面积以平方米计，体积以立方米计。因此，如果墙体绘制为 3 英尺高（使用英制单位），表达式 wall.height 的结果为 0.9144。计算中的任何数字都不假定带有任何单位，而是按面值读取，即不进行任何换算。
          - paragraph [ref=f1e1001]: 如有需要，可以使用显式的单位换算，因此将墙体高度与以英制表示的数值比较可以写为：
          - code [ref=f1e1003]: wall.height > 3ft
          - paragraph [ref=f1e1004]: ……或……
          - code [ref=f1e1006]: wall.height > 3’
          - paragraph [ref=f1e1007]: 可用单位包括 mm、cm、in（"）、ft（'）、mm2、cm2、in2、ft2、mm3、cm3、in3、ft3。
          - paragraph [ref=f1e1008]: 请注意，Quantities 不会根据从构件提取的数据或任何带单位后缀的数值对计算结果的单位作任何假设，也不会基于目标清单条目所选单位施加任何换算。例如，如果您想从 ARCHICAD（以米为单位）提取长度并将其关联到以毫米计量的清单条目，就需要将计算结果乘以 1000。
        - generic [ref=f1e1009]:
          - paragraph [ref=f1e1010]: All geometric element measurements, e.g. height, area, volume, are metric and based on metres, i.e. any measurement of length is in metres, area in metres squared and volume in metres cubed. So if a wall is drawn 3 feet high (using imperial units), the expression wall.height will yield 0.9144. Any numbers in a calculation are not assumed to be any unit and are read at face value, i.e. no conversion is applied.
          - paragraph [ref=f1e1011]: "Explicit unit conversions can be used if required, so a wall height compared to a figure in imperial units could be written as:"
          - code [ref=f1e1013]: wall.height > 3ft
          - paragraph [ref=f1e1014]: …or…
          - code [ref=f1e1016]: wall.height > 3’
          - paragraph [ref=f1e1017]: Available units include mm, cm, in (“), ft (‘), mm2, cm2, in2, ft2, mm3, cm3, in3, ft3.
          - paragraph [ref=f1e1018]: Note that Quantities does not make any assumptions about the units of the calculated result based on the data extracted from elements or any numeric values with a unit suffix, and will not apply any conversions based on the unit selected for the target bill item. For example, you would need to multiply a calculated result by 1000 if you wanted to extract a length from ARCHICAD (which is in metres) and attach it to a bill item measured in millimetres.
