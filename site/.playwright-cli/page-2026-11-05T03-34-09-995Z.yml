          - paragraph [ref=f1e1046]: 完整的几何测量列表见第 7.2 节。
        - generic [ref=f1e1047]:
          - paragraph [ref=f1e1048]:
            - text: The majority of geometry expressions are fairly generic and apply to all elements, e.g.
            - emphasis [ref=f1e1049]: height
            - text: ","
            - emphasis [ref=f1e1050]: width
            - text: ","
            - emphasis [ref=f1e1051]: depth
            - text: ","
            - emphasis [ref=f1e1052]: perimeter
            - text: ","
            - emphasis [ref=f1e1053]: area
            - text: and
            - emphasis [ref=f1e1054]: volume
            - text: ". Application to measurements is straightforward, e.g. calculating the volume of a box bounding an element:"
          - paragraph [ref=f1e1055]:
            - emphasis [ref=f1e1056]: element.height
            - text: element.width
            - emphasis [ref=f1e1057]: element.depth
          - paragraph [ref=f1e1058]:
            - text: The precise element simply
            - emphasis [ref=f1e1059]: element.volume
            - text: ". Some information about the element’s home storey is also available including:"
          - table [ref=f1e1061]:
            - rowgroup [ref=f1e1062]:
              - row [ref=f1e1063]:
                - columnheader "Storey base level:Storey height:" [ref=f1e1064]
                - columnheader "*element.storey.level****element.storey.height*" [ref=f1e1065]
            - rowgroup
