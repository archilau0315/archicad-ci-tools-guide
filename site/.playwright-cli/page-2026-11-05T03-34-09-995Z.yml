            - listitem [ref=f1e2179]: 零数量 仅显示在算量过程中执行过测量计算但总计仍为零的清单条目
          - list [ref=f1e2180]:
            - listitem [ref=f1e2181]: 未使用的条目 仅显示完全未用于算量的清单条目
          - paragraph [ref=f1e2182]:
            - text: 使用此菜单和
            - emphasis [ref=f1e2183]: Quantities
            - text: 的其他功能，信息板审计流程包括：
          - list [ref=f1e2184]:
            - listitem [ref=f1e2185]: 检查构件一致性
          - paragraph [ref=f1e2186]: 第 5.2.6 节描述了一种将成本追溯到源构件的方法。这种选择技术与其他审计流程配合使用时非常强大，例如使用 Quantities 信息板（第 2.2 节）检查属性不一致情况，以及检查模型中缺失的构件。请留意配方附加关系或属性值上的异常差异 —— 信息板会以蓝色高亮显示不同的取值，使其醒目突出。使用其筛选功能可以隔离出设置异常的构件，或通过搜索扩展到其他应当同样计量的相似构件。
          - paragraph [ref=f1e2187]: 例如，选中与外墙覆面相关的构件可能会发现某些模型墙体被遗漏，而另一些则被错误地包含在内。如果配方规则或测量与属性值相关，信息板可以迅速高亮显示这些不一致之处，并且可以通过同一信息板立即更新。
          - list [ref=f1e2188]:
            - listitem [ref=f1e2189]: 检查清单条目使用情况
          - paragraph [ref=f1e2190]:
            - text: 未被任何配方引用的清单条目可能意味着疏漏。虽然某些条目对特定项目而言可能无关紧要，但仍应予以检查。将 Show 菜单设为 Unused items 即可快速复核。这些条目还可以通过在左侧清单结构中选中条目或分类进一步筛选（
            - link "示意图" [ref=f1e2191] [cursor=pointer]:
              - /url: "#5.2.Scheduling%20Quantities|outline"
            - text: 中的第 1b 项）。
          - list [ref=f1e2192]:
            - listitem [ref=f1e2193]: 检查计算结果
          - paragraph [ref=f1e2194]: 某个清单条目在算量结果中总计为零，即使配方已表示存在并且正在对项目构件运行相关规则或数量计算。虽然有可能这些构件确实都不产生成本，但仍建议进行检查。
          - paragraph [ref=f1e2195]: 将 Show 菜单设为 Z e ro quantities（零数量）可查看受影响的条目，并应用上文"检查构件一致性"中所述的技术方法。如果构件本身没有问题，或者配方关联了错误的构件，请使用工程量管理器（Quantity Take-off Manager）的"配方"选项卡（参见第 4.2 节）来复核与受影响清单条目相关联的配方规则和/或计算。
          - paragraph [ref=f1e2196]: 所有审计方法的汇总可见第 6 章。
        - generic [ref=f1e2197]:
