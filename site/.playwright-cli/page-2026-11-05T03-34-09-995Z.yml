          - list [ref=f1e375]:
            - listitem [ref=f1e376]: "A table defining defining how the CSV columns should be linked to the key fields of a bill item. The table is headed up with a Configuration menu that allows the table content to be saved and reused. Each configuration is named and can be selected from the menu. Additional menu items allow configurations to be created, renamed or deleted (but there must always be at least one configuration remaining). The table is headed up with three columns: a) Column Name If The first row contains column headings option is checked, this column displays the names imported from the first row. Otherwise it displays the column number, e.g. Column 1, Column 2, etc. b) Sample data An example of the data to be imported – this is helpful if the columns are not named and also serves to confirm that the CSV options are correctly specified and the imported data is valid. c) Data Application Which bill item data field this column is linked to:"
