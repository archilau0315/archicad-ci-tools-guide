          - paragraph [ref=f1e2213]:
            - text: Using this menu and other
            - emphasis [ref=f1e2214]: Quantities
            - text: "features, the palette auditing processes include:"
          - list [ref=f1e2215]:
            - listitem [ref=f1e2216]: Checking element consistency
          - paragraph [ref=f1e2217]: Section 5.2.6 describes a method for tracking costs to the source elements. This selection technique is very powerful in conjunction with other auditing processes, e.g. checking for property inconsistencies using the Quantities Info palette (section 2.2) and checking the model for missing elements. Look for unexpected variations in recipe attachments or property values – the Info palette will highlight different values in blue so they stand out. Use its filtering to isolate elements with unusual settings, or searching to expand to similar elements that should be measured alike.
          - paragraph [ref=f1e2218]: For example, selecting elements linked to exterior cladding may reveal that some model walls have been omitted and other incorrectly included. If the recipe rules or measurement relate to property values, the Info palette may quickly highlight these inconsistencies and can be immediately updated through the same palette.
          - list [ref=f1e2219]:
            - listitem [ref=f1e2220]: Checking bill item usage
          - paragraph [ref=f1e2221]:
            - text: A bill item that isn’t referenced in any recipes suggests a possible oversight. While it’s possible that some items are irrelevant for a given project, it should be checked. Setting the Show menu to Unused items enables a quick review. These items can be further filtered by selecting items or categories in the bill structure to the left (item 1b in
            - link "the illustration" [ref=f1e2222] [cursor=pointer]:
              - /url: "#5.2.Scheduling%20Quantities|outline"
            - text: ).
          - list [ref=f1e2223]:
            - listitem [ref=f1e2224]: Checking calculation results
          - paragraph [ref=f1e2225]: A bill item may have a zero total in the schedule despite recipe representation and actively running associated rules or quantity calculations on project elements. While it’s possible that none of these elements contribute to cost, checking is advisable.
          - paragraph [ref=f1e2226]: Set the Show menu to Z e ro quantities to view affected item and apply the techniques described in Checking element consistency above. If either the elements seem fine or the wrong elements are associated with the recipe, use the Recipe tab of the Quantity Take-off Manager (refer to section 4.2) to review the rules and/or calculations of recipes associated with the affected bill items.
          - paragraph [ref=f1e2227]: A summary of all auditing methods can be found in chapter 6.
