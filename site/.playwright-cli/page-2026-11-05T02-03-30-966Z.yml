        - list [ref=e995]:
          - listitem [ref=e996]: Add a front
        - list [ref=e997]:
          - listitem [ref=e998]: Adjust the settings of a front
        - paragraph [ref=e999]: "Settings for a front include:"
        - list [ref=e1000]:
          - listitem [ref=e1001]: Style – a number of basic frame shape are available. Note that the Framed shape follows the shape of the door (which is generally rectangular unless placed in the Ci Cabinet Polygon object).
        - list [ref=e1002]:
          - listitem [ref=e1003]: Panel type – choose a panel type (e.g. glass, tongue & groove, etc). Depending on the selected panel style, set dimensions.
