          - heading "ProKit Cabinets – Start here" [level=3] [ref=e2265]
        - generic [ref=e2266]:
          - text: 原文来源：
          - link "MyCi 知识库 · ProKit Cabinets – Start here" [ref=e2267] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/17876187425167-ProKit-Cabinets-Start-here
        - paragraph [ref=e2268]: The Cabinets Tools allows the design of custom and bespoke Cabinetry with ease and accuracy. It utilises a handful of highly-configurable objects to model Cabinetssry.
        - paragraph [ref=e2269]: Instead of using separate objects for each different Cabinets type and shape, the library allows the accurate 2D and 3D representation of flat and curved cupboard doors and drawer fronts. There is a large assortment of editable panel styles and handle types to create the most unique of Cabinetssry.
        - paragraph [ref=e2270]:
          - strong [ref=e2271]: Libpack loading (since ARCHICAD 29)
        - paragraph [ref=e2272]: It is important to note that the ProKit Cabinets Tool requires the Cabinets Libpack to be manually loaded into the project.
        - paragraph [ref=e2273]: As with all Libraries this is done through the Library Manager. Please note that the Libpacks that are loaded need to be selected at an individual file and not at a folder level as was the case in earlier Archicad versions.
        - paragraph [ref=e2274]: The Library Manager is accessed through the File>Library Manager dropdown.
        - paragraph [ref=e2275]:
          - img "ProKit Cabinets – Start here 示意图" [ref=e2276]
        - paragraph [ref=e2277]: Once in the Library Manager we will use the “Add” button to add the Cabinetss Libpack.
        - paragraph [ref=e2278]:
          - img "ProKit Cabinets – Start here 示意图" [ref=e2279]
        - paragraph [ref=e2280]: This allows navigation to the ProKit Libpack folder located in the ARCHICAD installation folder.
        - paragraph [ref=e2281]:
          - img "ProKit Cabinets – Start here 示意图" [ref=e2282]
        - paragraph [ref=e2283]: This will load the Cabinets Libpack and associated Macros.
        - paragraph [ref=e2284]: The Cabinets Objects will now be available in the Cabinets Tool.
        - paragraph [ref=e2285]: "IMPORTANT:"
        - paragraph [ref=e2286]: If the Cabinets Tool is not showing in the toolbox on the left in the default ARCHICAD work environment, It can be added by right clicking on in the Toolbox. The Toolbox will bring up a dialog to add the Cabinets Tool.
        - paragraph [ref=e2287]:
          - img "ProKit Cabinets – Start here 示意图" [ref=e2288]
        - paragraph [ref=e2289]: This will allow adding the Cabinets Tool to the Toolbox.
        - paragraph [ref=e2290]:
          - img "ProKit Cabinets – Start here 示意图" [ref=e2291]
        - paragraph [ref=e2292]: The Cabinets Tools will now show up, it is recommended to save the Work Environment to avoid having to add this, although ARCHICAD should retain them.
        - paragraph [ref=e2293]:
          - img "ProKit Cabinets – Start here 示意图" [ref=e2294]
        - paragraph [ref=e2295]:
          - strong [ref=e2296]: Placing a Cabinet
        - paragraph [ref=e2297]: The Cabinets Tool operates very similarly to the Object Tool in ARCHCAD.
        - paragraph [ref=e2298]: Once the tool is selected, the settings can be opened and a cabinet type selected.
        - paragraph [ref=e2299]:
          - img "ProKit Cabinets – Start here 示意图" [ref=e2300]
        - paragraph [ref=e2301]: This allows for various Cabinet permutations and possibilities.
        - paragraph [ref=e2302]: For more detailed information on the different Cabinet types and features, please see the articles on the Knowledge-base.
