        - paragraph [ref=e1626]:
          - text: You can fill a cabinet with various items, including tableware, glassware, wine racks, books and microwave ovens. If you need something that's not available, you can create a
          - emphasis [ref=e1627]: Custom Space Filler
          - text: .
