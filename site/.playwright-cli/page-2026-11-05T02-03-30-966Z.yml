          - heading "Overview" [level=3] [ref=e1974]
        - generic [ref=e1975]:
          - text: 原文来源：
          - link "MyCi 知识库 · Overview" [ref=e1976] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001017756-Overview
        - paragraph [ref=e1977]:
          - text: The
          - emphasis [ref=e1978]: Ci Cabinets
          - text: tool provides design freedom to create and document joinery within the Building Information Model.
        - heading "Glossary of Terms" [level=2] [ref=e1979]
        - paragraph [ref=e1980]: "These terms are used in the documentation and in the user interface:"
        - table [ref=e1982]:
          - rowgroup [ref=e1983]:
            - row [ref=e1984]:
              - columnheader "Cabinet" [ref=e1985]
              - columnheader "A complete cabinet structure (may be subdivided into *units* and *modules*)." [ref=e1986]
          - rowgroup [ref=e1987]:
            - row [ref=e1988]:
              - cell "Partition" [ref=e1989]
              - cell "A cabinet may be split along vertical and horizontal lines. Each of these lines is referred to as a *partition*. The partition may be of different types – *unit*, *module*, vertical*divider* or horizontal *shelf*." [ref=e1990]
            - row [ref=e1991]:
              - cell "Unit" [ref=e1992]
              - cell "The physical item that will be delivered to site. It may be subdivided into *modules*. Each unit includes a wall at each end, a base and a top." [ref=e1993]
            - row [ref=e1994]:
              - cell "Module" [ref=e1995]
              - cell "A division within a unit. Adjacent modules may include a partition wall (e.g. two adjacent cupboard modules have separate internal spaces), or there may be no partition wall (e.g. two drawers in a stack are not typically separated by a partition). Each module has a *type*, a *front* and a *handle type*." [ref=e1996]
            - row [ref=e1997]:
              - cell "Module Type" [ref=e1998]
              - cell "Each module has a *type* that controls the function of the module (e.g. door, drawer, open shelving, slide-out bins)" [ref=e1999]
            - row [ref=e2000]:
              - cell "Front" [ref=e2001]
              - cell "The panel style associated with the module’s door, drawer-front, etc." [ref=e2002]
            - row [ref=e2003]:
              - cell "Handle" [ref=e2004]
              - cell "The handle type used by a module." [ref=e2005]
            - row [ref=e2006]:
              - cell "Shelf" [ref=e2007]
              - cell "A horizontal division within a module. It may be a fixed shelf, slats, roll-out tray or a horizontal rail." [ref=e2008]
            - row [ref=e2009]:
              - cell "Vertical Divider" [ref=e2010]
              - cell "A vertical internal divider within a module." [ref=e2011]
            - row [ref=e2012]:
              - cell "Face" [ref=e2013]
              - cell "The front face of the cabinet." [ref=e2014]
            - row [ref=e2015]:
              - cell "Plinth" [ref=e2016]
              - cell "The ‘toe kick’ panel that runs along the front of a floor-mounted cabinet." [ref=e2017]
            - row [ref=e2018]:
              - cell "Muntins" [ref=e2019]
              - cell "Glazing-bar patterns that may be applied to glass panels." [ref=e2020]
            - row [ref=e2021]:
              - cell "Space" [ref=e2022]
              - cell "Carcass walls, top, base, partitions, shelves and vertical dividers form *spaces* within the cabinet. Each such space may be filled with a *space filler*." [ref=e2023]
            - row [ref=e2024]:
              - cell "Space Filler" [ref=e2025]
              - cell "Items for visualization, such as glassware, tableware, storage jars and wine racks." [ref=e2026]
        - heading "Design Flexibility" [level=2] [ref=e2027]
        - paragraph [ref=e2028]: "The software provides a high level of design flexibility. Design options include:"
        - list [ref=e2029]:
          - listitem [ref=e2030]: A range of cabinet shapes (rectangular, corner, angled corner, custom shape)
        - list [ref=e2031]:
          - listitem [ref=e2032]: Face-frame construction options (Frameless, Inset, Half Overlay, or Full Overlay)
        - list [ref=e2033]:
          - listitem [ref=e2034]: Base types (Adjustable Legs, Extend Walls, Inset from Cabinet, or None (for wall-mounted cabinets))
        - list [ref=e2035]:
          - listitem [ref=e2036]: Ability to configure a cabinet as a set of units and modules
        - list [ref=e2037]:
          - listitem [ref=e2038]: Ability to define shelves and dividers within a given module
        - list [ref=e2039]:
          - listitem [ref=e2040]: An extensive range of customizable module types (single drawer, drawer stack, doors, slide-out bins, slide-out shelving, etc.)
        - list [ref=e2041]:
          - listitem [ref=e2042]: A range of customizable shelf types (solid shelf, slat shelf, roll-out shelf, wardrobe rails)
        - list [ref=e2043]:
          - listitem [ref=e2044]: A range of customizable drawer/door fronts
        - list [ref=e2045]:
          - listitem [ref=e2046]: A range of customizable handle types including recessed handles
        - list [ref=e2047]:
          - listitem [ref=e2048]: A customizable bench top with a range of edge types (upstand/splashback, nosing, waterfall edge)
        - heading "Supported Documentation Types" [level=2] [ref=e2049]
        - paragraph [ref=e2050]:
          - text: Having designed the cabinetry for a project, it’s important to be able to document it so as to communicate the design effectively to the customer, manufacturer and the construction team. The software provides a number of documentation options. Many of these are controlled by the
          - strong [ref=e2051]: Model View Options
          - text: ", so that each view can show an appropriate subset of the information."
        - heading "Model View Option Settings" [level=3] [ref=e2052]
        - paragraph [ref=e2053]:
          - text: From the
          - strong [ref=e2054]: Document
          - text: menu, choose
          - strong [ref=e2055]: Model View > Model View Options
          - text: to bring up the
          - strong [ref=e2056]: Model View Options
          - text: palette. On this palette you will see listed the settings for
          - strong [ref=e2057]: CI Cabinets
          - text: .
        - paragraph [ref=e2058]:
          - img "Overview 示意图" [ref=e2059]
        - paragraph [ref=e2060]:
          - text: Open the
          - strong [ref=e2061]: CI Cabinets
          - text: tab to view the options and settings. Click on the
          - strong [ref=e2062]: Options
          - text: button to show options for the view.
        - paragraph [ref=e2063]:
          - text: On the
          - strong [ref=e2064]: Options
          - text: page you’ll see settings for
          - strong [ref=e2065]: Model Views
          - text: (i.e. Section, Elevation, Interior Elevation, 3D and 3D Document views) and for
          - strong [ref=e2066]: Plan View
          - text: .
        - heading "Model Views" [level=4] [ref=e2067]
        - paragraph [ref=e2068]:
          - text: Options for
          - strong [ref=e2069]: Model Views
          - text: "(section, elevation, interior elevation, 3D, etc.) include:"
        - list [ref=e2070]:
          - listitem [ref=e2071]: Show Opening Lines – These lines indicate the opening direction and method for each module. However in some views (e.g. presentation renderings) it would be distracting to show these.
        - paragraph [ref=e2072]: Choose how the arrows should show for hinged doors, and what symbol should be used for drawers.
        - paragraph [ref=e2073]: Select a pen for the opening lines.
        - list [ref=e2074]:
          - listitem [ref=e2075]: Show Shelves as Dashed Lines – If this option is selected, any internal vertical dividers or horizontal shelves, will be projected onto the front face of the cabinets.
        - list [ref=e2076]:
          - listitem [ref=e2077]: Show Labels on Module Fronts - Each module may be labelled. Each module type has a default label, which is applied on selection. The default label may be overwritten.
        - list [ref=e2078]:
          - listitem [ref=e2079]: Doors & Drawers All Shut - In presentation views you might want to show some doors or drawers open. In other views (e.g. sections, elevations, interior elevations) you will want to show all closed. Use the checkbox to control this for each view.
        - list [ref=e2080]:
          - listitem [ref=e2081]: Opening Lines symbols – Choose how the opening lines should appear.
        - heading "Plan View" [level=4] [ref=e2082]
        - paragraph [ref=e2083]:
          - text: Options for
          - strong [ref=e2084]: Plan Views
          - text: "include:"
        - list [ref=e2085]:
          - listitem [ref=e2086]: Cutting Plane Height - A dedicated cutting plane defines how cabinets display in a particular view. This helps to bring either under-bench or wall-hung units into focus. If the cabinet is positioned above the set cutting plane height, the object’s outline is drawn using a customisable line type, by default this is dashed. If the cutting plane slices through a cabinet, the construction detail (walls and vertical dividers) is displayed.
        - list [ref=e2087]:
          - listitem [ref=e2088]: Reflected Ceiling Plan – When this option is On , everything above the cutting plane is displayed as an outline with background polygon and everything below is represented with simple clear outline. When Off , everything below the cutting plane is displayed with detail and everything above in simple clear outline.
        - list [ref=e2089]:
          - listitem [ref=e2090]: Show Unit Partitions on Outline Views – Cabinets that are not cut through by the cutting plane, are shown as outlines. On these outline views, the location of unit partitions may be shown or hidden.
        - list [ref=e2091]:
          - listitem [ref=e2092]: Doors & Drawers opening Angle and Margin – In plan-view, the doors and drawers can be shown open.
        - heading "Scheduling Cabinets" [level=3] [ref=e2093]
        - paragraph [ref=e2094]:
          - text: Cabinets may be scheduled. Note the section
          - emphasis [ref=e2095]: Supported Workflows
          - text: on choosing the best workflow to use, if you intend to schedule cabinetry.
        - heading "Supported Workflows" [level=2] [ref=e2096]
        - paragraph [ref=e2097]: The workflow for modelling cabinets will depend on the requirements of the project.
        - list [ref=e2098]:
          - listitem [ref=e2099]: For some projects, the documented cabinetry is intended only to indicate design intent, while the precise details are left to cabinet manufacturers. In this case, the cabinet may be modeled as a single entity containing multiple units . When scheduled, the cabinet will be listed as a whole. This approach provides quick initial placement and later editing.
        - list [ref=e2100]:
          - listitem [ref=e2101]: In other projects, you may be working with clearly defined units that must be scheduled. In this case, each unit should be modeled and placed as a separate cabinet . This approach permits scheduling of the individual units. If you save favorites of the units you intend to use, it can be relatively quick to place the cabinetry.
        - paragraph [ref=e2102]:
          - emphasis [ref=e2103]: CI Cabinets
          - text: works well for both workflows.
        - heading "Supported Construction Methods" [level=2] [ref=e2104]
        - heading "Cabinet Top" [level=3] [ref=e2105]
        - paragraph [ref=e2106]: The cabinet top may be open or closed.
        - paragraph [ref=e2107]:
          - img "Overview 示意图" [ref=e2108]
        - paragraph [ref=e2109]:
          - img "Overview 示意图" [ref=e2110]
        - heading "Face Frame Types" [level=3] [ref=e2111]
        - paragraph [ref=e2112]:
          - img "Overview 示意图" [ref=e2113]
        - paragraph [ref=e2114]: "Four face-frame options are supported:"
        - list [ref=e2115]:
          - listitem [ref=e2116]: Frameless – the door/drawer fronts fit directly onto the carcass
        - list [ref=e2117]:
          - listitem [ref=e2118]: Inset – a framework is attached to the carcass front, and the door/drawer fronts fit within this frame
        - list [ref=e2119]:
          - listitem [ref=e2120]: Half-Overlay – a framework is attached to the carcass front, and the door/drawer fronts close onto this framework. The fronts overlap the framework by a narrow margin.
        - list [ref=e2121]:
          - listitem [ref=e2122]: Full Overlay – a framework is attached to the carcass front, and the door/drawer fronts close onto this framework. The door/drawer fronts overlap far enough to effectively hide the framework when closed.
        - heading "Plinth Types" [level=3] [ref=e2123]
        - paragraph [ref=e2124]:
          - img "Overview 示意图" [ref=e2125]
        - paragraph [ref=e2126]:
          - img "Overview 示意图" [ref=e2127]
        - paragraph [ref=e2128]:
          - img "Overview 示意图" [ref=e2129]
        - paragraph [ref=e2130]: "Four base methods are supported:"
        - list [ref=e2131]:
          - listitem [ref=e2132]: Adjustable legs
        - list [ref=e2133]:
          - listitem [ref=e2134]: Walls extend to floor – for joinery where the ends extend down to the floor to form a part of the plinth
        - list [ref=e2135]:
          - listitem [ref=e2136]: Inset from Cabinet - for joinery where the plinth is constructed separately from the carcass
        - list [ref=e2137]:
          - listitem [ref=e2138]: No plinth – use this for wall-mounted cabinets
        - heading "Objects in the Library" [level=2] [ref=e2139]
        - paragraph [ref=e2140]: "The library includes a handful of objects, each of which has a specific purpose:"
        - list [ref=e2141]:
          - listitem [ref=e2142]: CI Bench Top - A polygonal benchtop that can include holes, nosings, upstands and waterfall edges. This would typically be used to form the benchtop for kitchen cabinetry.
        - list [ref=e2143]:
          - listitem [ref=e2144]: CI Cabinet - A basic, rectangular cabinet. This would be used for most under-bench or wall-hung cabinets.
        - list [ref=e2145]:
          - listitem [ref=e2146]: CI Cabinet Corner - An L-shaped corner cabinet.
        - list [ref=e2147]:
          - listitem [ref=e2148]: CI Cabinet Corner Angled - A corner cabinet with angled front.
        - list [ref=e2149]:
          - listitem [ref=e2150]: "CI Cabinet Polygon - A cabinet with customisable shape in elevation. It could be used, for instance, to model:"
        - paragraph [ref=e2151]: A cabinet whose top follows a raking ceiling or a flight of stairs.
        - list [ref=e2152]:
          - listitem [ref=e2153]: An odd-shaped bookshelf.
        - paragraph [ref=e2154]:
          - text: The
          - emphasis [ref=e2155]: Ci Cabinet Linear
          - text: is better suited for rectangular cabinets.
        - list [ref=e2156]:
          - listitem [ref=e2157]: CI Edge Moulding - An object to add pelmets and crown mouldings to cabinets. Compatible with complex profiles.
        - heading "Custom Components" [level=2] [ref=e2158]
        - paragraph [ref=e2159]: "The cabinet supports the following custom component types:"
        - list [ref=e2160]:
          - listitem [ref=e2161]: Cabinet Door - essentially this is a custom front.
        - list [ref=e2162]:
          - listitem [ref=e2163]: Cabinet Muntins – for use in fronts containing glass panels.
        - list [ref=e2164]:
          - listitem [ref=e2165]: Knob – a cabinet handle.
        - list [ref=e2166]:
          - listitem [ref=e2167]: Cabinet Oven - a custom oven unit that can be directly incorporated into the cabinet.
        - list [ref=e2168]:
          - listitem [ref=e2169]: Space Filler - an item that can be inserted into any space within the cabinet.
