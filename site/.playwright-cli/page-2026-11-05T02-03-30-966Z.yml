            - /url: https://cadimage.zendesk.com/hc/en-us/articles/4404256585615
          - text: .
        - paragraph [ref=e946]:
          - text: A module consists of three basic components – a
          - emphasis [ref=e947]: Type
          - text: ", a"
          - emphasis [ref=e948]: Front
          - text: ", and a"
          - emphasis [ref=e949]: Handle
          - text: .
        - paragraph [ref=e950]: For each module, you can select a style for each of these components. This allows you to set one module to be a door, another to be a drawer stack, and a third to be a slide-out bin. They can all have the same style of front, or you can choose the front style independently. Similarly, you can independently choose a handle style for each module.
        - paragraph [ref=e951]: "To change the module type, front and handle:"
        - list [ref=e952]:
          - listitem [ref=e953]: Select the cabinet and open its Settings dialog.
        - paragraph [ref=e954]:
          - img "How to Change Module Settings 示意图" [ref=e955]
        - list [ref=e956]:
          - listitem [ref=e957]: On the Modules page, click to select the module(s) you want to edit.
        - paragraph [ref=e958]:
          - img "How to Change Module Settings 示意图" [ref=e959]
        - list [ref=e960]:
          - listitem [ref=e961]: Choose a module type, front and handle from the lists.
        - paragraph [ref=e962]:
          - img "How to Change Module Settings 示意图" [ref=e963]
        - paragraph [ref=e964]: Set a few other values for the module (i.e. change the Label , set the Open ing angle/margin, and choose the handle location).
        - list [ref=e965]:
          - listitem [ref=e966]: Click OK to apply the settings.
        - paragraph [ref=e967]:
          - img "How to Change Module Settings 示意图" [ref=e968]
        - heading "Available Module Types" [level=2] [ref=e969]
        - paragraph [ref=e970]:
          - text: To edit the list of available module types, go to the
          - strong [ref=e971]: Modules > Available Module Types
          - text: page.
        - paragraph [ref=e972]:
          - img "How to Change Module Settings 示意图" [ref=e973]
        - paragraph [ref=e974]: While working on this page, the 3D preview shows only an example of the selected module type.
        - paragraph [ref=e975]: "Here you can:"
        - list [ref=e976]:
          - listitem [ref=e977]: Rename a module type
        - list [ref=e978]:
          - listitem [ref=e979]: Delete a module type (provided it is not in current use)
        - list [ref=e980]:
          - listitem [ref=e981]: Add a new module type
        - list [ref=e982]:
          - listitem [ref=e983]: Adjust the settings of a module type
        - heading "Available Fronts" [level=2] [ref=e984]
        - paragraph [ref=e985]:
          - text: To edit the list of available fronts, go to the
          - strong [ref=e986]: Modules > Available Fronts
          - text: page.
        - paragraph [ref=e987]:
          - img "How to Change Module Settings 示意图" [ref=e988]
        - paragraph [ref=e989]: While working on this page, the 3D preview shows only an example of the selected front.
        - paragraph [ref=e990]: "Here you can:"
        - list [ref=e991]:
          - listitem [ref=e992]: Rename a front.
        - list [ref=e993]:
