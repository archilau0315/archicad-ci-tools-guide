          - heading "How to Define a Section, Elevation or 3D View" [level=3] [ref=e1458]
        - generic [ref=e1459]:
          - text: 原文来源：
          - link "MyCi 知识库 · How to Define a Section, Elevation or 3D View" [ref=e1460] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001017816-How-to-Define-a-Section-Elevation-or-3D-View
        - paragraph [ref=e1461]:
          - text: The
          - emphasis [ref=e1462]: Ci Cabinets
          - text: tool provides
          - strong [ref=e1463]: Model View Options
          - text: that control how cabinets are displayed in section, elevation and 3D views. These settings are all available on the
          - strong [ref=e1464]: Model
          - text: page of the
          - strong [ref=e1465]: Model View Options > Ci Cabinets
          - text: dialog.
        - paragraph [ref=e1466]:
          - img "How to Define a Section, Elevation or 3D View 示意图" [ref=e1467]
        - paragraph [ref=e1468]: Use these options to tailor each view to display appropriate information, and to reduce the polygon count.
        - heading "Doors & Drawers" [level=2] [ref=e1469]
        - paragraph [ref=e1470]: "Settings that control doors and drawers appear in the model view, include:"
        - list [ref=e1471]:
          - listitem [ref=e1472]: All Shut - all the doors and drawers will be displayed as shut, even if set to open in the cabinet's Settings dialog.
        - list [ref=e1473]:
          - listitem [ref=e1474]: Show Opening Lines - control whether to display opening lines for doors and drawers, and how the opening lines should appear.
        - heading "Space Fillers" [level=2] [ref=e1475]
        - paragraph [ref=e1476]:
          - strong [ref=e1477]: Show in View
          - text: "- choose whether to display space fillers in the current view."
        - paragraph [ref=e1478]: Space fillers can be useful in a presentation view, but you probably don't want to display them in a dimensioned drawing. Space fillers also tend to be polygon-heavy, so it's nice to be able to keep the polygon count in check by removing them from all but a few key views.
        - heading "Module Fronts" [level=2] [ref=e1479]
        - paragraph [ref=e1480]: "Options for module fronts include:"
        - list [ref=e1481]:
          - listitem [ref=e1482]: Show in View - choose to show/hide the module fronts in a given view. Generally you'll want to show the fronts, but there may be some views for which you only want to show the carcass.
        - list [ref=e1483]:
          - listitem [ref=e1484]: Transparency - set the transparency of module fronts, to partially reveal hidden components.
        - list [ref=e1485]:
          - listitem [ref=e1486]: Show Handles - show the handles (you may want to hide them to reduce the polygon count).
        - list [ref=e1487]:
          - listitem [ref=e1488]: Show Labels - show/hide the optional labels on each module.
        - heading "Internal Components" [level=2] [ref=e1489]
        - paragraph [ref=e1490]: Some components of a cabinet (e.g. shelves, adjustable legs, space fillers) are hidden behind non-glazed doors and drawers when closed, or behind the plinth. For 3D views, or for interior elevations, it may not be helpful to generate all of this hidden detail, given that it's not actually visible.
        - paragraph [ref=e1491]:
          - text: Use the
          - strong [ref=e1492]: Show in View
          - text: option to help control the polygon count for views that don't require hidden shelves, partitions, legs and space fillers.
        - heading "Shelves" [level=2] [ref=e1493]
        - paragraph [ref=e1494]: Shelves and partitions may be shown as hidden detail lines drawn on the cabinet fronts.
