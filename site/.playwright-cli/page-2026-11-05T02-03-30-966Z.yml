        - paragraph [ref=e1433]: Note that the cabinet ends will display as open, unless you add an end panel.
        - heading "Show Unit Partitions" [level=3] [ref=e1434]
        - paragraph [ref=e1435]: Show unit partitions to identify the extent of adjacent units in plan-view.
        - list [ref=e1436]:
          - listitem [ref=e1437]: Cabinets that are wholly above the cutting plane will display any unit partitions that extend to the cabinet base.
        - list [ref=e1438]:
          - listitem [ref=e1439]: Cabinets that are wholly below the cutting plane will display any unit partitions that extend to the cabinet top.
        - heading "Set Doors & Drawers Open or Shut" [level=2] [ref=e1440]
        - paragraph [ref=e1441]: For cabinets that are sliced by the cutting plane, doors and drawers may be set open or shut in plan-view.
