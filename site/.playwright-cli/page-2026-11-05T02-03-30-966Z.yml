          - text: Having created custom muntins, the next step is to apply them to one of the
          - strong [ref=e1148]: Available Fronts
          - text: .
        - list [ref=e1149]:
          - listitem [ref=e1150]: Select the cabinet in which you want to use the new muntins, and open its Settings dialog.
        - list [ref=e1151]:
          - listitem [ref=e1152]: On the Available Fronts page, select an existing front that has a glass panel, or add a new one.
        - paragraph [ref=e1153]:
          - img "How to Create and Use Custom Muntins 示意图" [ref=e1154]
        - list [ref=e1155]:
          - listitem [ref=e1156]: Set the Muntins field to Custom Muntins.
        - list [ref=e1157]:
          - listitem [ref=e1158]: Choose your new custom muntins from the list.
        - heading "Use the Front" [level=2] [ref=e1159]
        - paragraph [ref=e1160]: "To apply the front containing custom muntins to selected modules:"
        - list [ref=e1161]:
          - listitem [ref=e1162]: On the Modules page, click to make a selection of modules.
