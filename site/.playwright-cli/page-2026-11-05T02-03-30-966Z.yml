        - paragraph [ref=e941]:
          - text: Every cabinet includes one or more
          - emphasis [ref=e942]: module
          - text: . To learn how to partition a cabinet into multiple modules, see the articles
          - emphasis [ref=e943]:
            - link "How to Partition a Cabinet Graphically" [ref=e944] [cursor=pointer]:
