          - text: dialog.
        - paragraph [ref=e1632]:
          - img "How to Fill a Cabinet 示意图" [ref=e1633]
        - paragraph [ref=e1634]:
          - text: On the
          - strong [ref=e1635]: Spaces
          - text: page, select the spaces you wish to fill, and choose a filler
          - strong [ref=e1636]: Type
          - text: . Depending on the filler type selected, set values to control the placement of filler items within the selected spaces. Typical settings include
          - strong [ref=e1637]: Single
          - text: /
          - strong [ref=e1638]: Multiple
          - text: ","
          - strong [ref=e1639]: Random Shift
          - text: and
          - strong [ref=e1640]: Turn
          - text: . If
          - strong [ref=e1641]: Multiple
          - text: items are placed, set spacings and offsets from the space boundaries.
        - paragraph [ref=e1642]:
