          - heading "How to Partition a Cabinet Graphically" [level=3] [ref=e1657]
        - generic [ref=e1658]:
          - text: 原文来源：
          - link "MyCi 知识库 · How to Partition a Cabinet Graphically" [ref=e1659] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001017896-How-to-Partition-a-Cabinet-Graphically
        - paragraph [ref=e1660]:
          - text: Partitions may be inserted into a cabinet to divide it into units and modules, and to add shelves and horizontal dividers within modules. In order to use the
          - emphasis [ref=e1661]: CI Cabinet
          - text: tool effectively, you need to understand how to work with partitions.
        - paragraph [ref=e1662]:
          - text: Note that partitions may also be added, removed and moved within the library-part
          - strong [ref=e1663]: Settings
          - text: dialog - see
          - emphasis [ref=e1664]:
            - link "How to Partition a Cabinet in the Settings Dialog" [ref=e1665] [cursor=pointer]:
              - /url: https://cadimage.zendesk.com/hc/en-us/articles/4404256585615
          - text: .
        - heading "Special Functions for the CI Cabinet Object" [level=2] [ref=e1666]
        - paragraph [ref=e1667]:
          - text: The
          - emphasis [ref=e1668]: CI Cabinet
          - text: object provides some special functionality to make it easier to quickly place a set of rectangular units in a plan view. This supports a workflow in which multiple units are drawn as a single entity, so as to convey design intent without scheduling separate units.
        - heading "Add Partitions when adjusting the Cabinet Width" [level=3] [ref=e1669]
        - paragraph [ref=e1670]:
          - text: On first placement, the
          - emphasis [ref=e1671]: Ci Cabinet Linear
          - text: includes a single unit.
        - paragraph [ref=e1672]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1673]
        - paragraph [ref=e1674]:
          - text: On the
          - strong [ref=e1675]: Grids & Editing
          - text: page, under
          - strong [ref=e1676]: Cabinet Width Adjustment
          - text: ", choose how you want the cabinet to behave when stretched in plan view."
        - paragraph [ref=e1677]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1678]
        - paragraph [ref=e1679]:
          - text: Under
          - strong [ref=e1680]: Cabinet Width Adjustment
          - text: ", choose what partition type should be inserted when increasing the cabinet's width"
          - strong [ref=e1681]: ":"
        - list [ref=e1682]:
          - listitem [ref=e1683]: Insert Unit Partitions - a unit partition will be inserted whenever the cabinet's width increases beyond the default spacing, provided the remaining width exceeds the minimum spacing.
        - list [ref=e1684]:
          - listitem [ref=e1685]: Insert Module Partitions - a module partition will be inserted whenever the cabinet's width increases beyond the default spacing, provided the remaining width exceeds the minimum spacing.
        - list [ref=e1686]:
          - listitem [ref=e1687]: Insert No Partitions - the cabinet width will adjust without inserting partitions.
        - paragraph [ref=e1688]: Use the end hotspot at the front of the cabinet, to adjust the cabinet's width. Extra units are added at regular intervals.
        - paragraph [ref=e1689]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1690]
        - paragraph [ref=e1691]:
          - text: A new unit partition is inserted each time the cabinet length extends beyond the
          - strong [ref=e1692]: Default Width.
          - text: The final unit will fit the remaining space. If this remaining space is too narrow (i.e. less than the
          - strong [ref=e1693]: Minimum Width
          - text: ), the last partition will be omitted, resulting in a wider unit.
        - heading "Move a Unit Partition in Plan-View" [level=3] [ref=e1694]
        - paragraph [ref=e1695]: Having stretched the cabinet to the correct length, you can adjust the positions of the unit partitions.
        - list [ref=e1696]:
          - listitem [ref=e1697]: Select the cabinet, and click on a dynamic hotspot at the back edge of the unit partition you want to move.
        - paragraph [ref=e1698]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1699]
        - list [ref=e1700]:
          - listitem [ref=e1701]: Move the partition and click to drop the hotspot, or enter the position via the keyboard.
        - paragraph [ref=e1702]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1703]
        - paragraph [ref=e1704]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1705]
        - heading "Add a Unit Partition in Plan-View" [level=3] [ref=e1706]
        - paragraph [ref=e1707]: You can add a vertical unit partition while in plan-view.
        - list [ref=e1708]:
          - listitem [ref=e1709]: Select the cabinet in plan-view.
        - paragraph [ref=e1710]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1711]
        - list [ref=e1712]:
          - listitem [ref=e1713]: Open the library-part's Settings dialog, and on the Grids & Editing page set the Editing Palette > Edit Mode to Partitions .
        - paragraph [ref=e1714]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1715]
        - list [ref=e1716]:
          - listitem [ref=e1717]: Click OK . The editing palette will appear beside the cabinet.
        - paragraph [ref=e1718]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1719]
        - list [ref=e1720]:
          - listitem [ref=e1721]: Drag the unit partition icon from the palette into the cabinet plan view, to add a partition.
        - paragraph [ref=e1722]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1723]
        - list [ref=e1724]:
          - listitem [ref=e1725]: Move the palette slider to the X position to hide the palette.
        - paragraph [ref=e1726]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1727]
        - paragraph [ref=e1728]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1729]
