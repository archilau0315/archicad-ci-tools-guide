        - heading "Align Partitions to Grid" [level=3] [ref=e1822]
        - paragraph [ref=e1823]:
          - text: Defining the precise position of a partition can be made easier by using the
          - strong [ref=e1824]: Align Partitions to Grid
          - text: option.
        - paragraph [ref=e1825]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1826]
        - paragraph [ref=e1827]:
          - text: On the
          - strong [ref=e1828]: Grids & Editing
          - text: page, set the
          - strong [ref=e1829]: Anchor & Spacing
          - text: settings. For instance you might want to snap to the nearest 50mm in both the
          - strong [ref=e1830]: X
          - text: and
          - strong [ref=e1831]: "Y"
          - text: directions, and anchor the grid to the bottom left of the carcass. Choose a proximity for snapping (partitions within this range of a grid line will snap to the grid line).
        - paragraph [ref=e1832]:
          - text: Click the
          - strong [ref=e1833]: Align Partitions to Grid
          - text: checkbox once you're done.
        - paragraph [ref=e1834]: Existing partitions will snap to the grid, and when a partition is moved it will snap to the grid line if within the chosen proximity.
        - heading "Special Functions for Shelves in the Ci Corner Unit" [level=2] [ref=e1835]
        - paragraph [ref=e1836]: Shelves in the CI Corner unit can either follow the shape of the carcass (i.e. an L-shape), or they can run parallel with one or other of the two edges.
        - paragraph [ref=e1837]: "The path followed by the shelf is controlled by moving the partition hotspot:"
