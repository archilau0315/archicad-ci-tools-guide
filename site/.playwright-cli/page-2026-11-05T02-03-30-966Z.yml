          - heading "Placing a Benchtop" [level=3] [ref=e2173]
        - generic [ref=e2174]:
          - text: 原文来源：
          - link "MyCi 知识库 · Placing a Benchtop" [ref=e2175] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/15879765706127-Placing-a-Benchtop
        - paragraph [ref=e2176]: From Cabinets version 8.40 a Benchtop can be placed, automatically following the size and shape of a Cabinet, in 2D and 3D views.
        - paragraph [ref=e2177]: This Benchtop can be placed on a single or multiple cabinets simultaneously. Please note that the Benchtop is not associative to the Cabinet, in other words if the geometry of the Cabinet changes, the Benchtop will have to be edited manually, or placed again.
        - paragraph [ref=e2178]: Let us place a Benchtop on a Curved cabinet.
        - paragraph [ref=e2179]: Firstly we select the Cabinet, then we navigate to CI Tools>Cabinets>Add a Benchtop.
        - paragraph [ref=e2180]:
          - img "Placing a Benchtop 示意图" [ref=e2181]
        - paragraph [ref=e2182]: We will then be able to enter the details of the Benchtop to our requirements.
        - paragraph [ref=e2183]:
          - img "Placing a Benchtop 示意图" [ref=e2184]
        - paragraph [ref=e2185]: "Number 1. We will be able to select the following for the Back Edge:"
        - list [ref=e2186]:
          - listitem [ref=e2187]: Upstand
        - list [ref=e2188]:
          - listitem [ref=e2189]: Nosing
        - list [ref=e2190]:
          - listitem [ref=e2191]: None
        - paragraph [ref=e2192]: Number 2 and 3.
        - paragraph [ref=e2193]: "For the Ends and Front edge we can opt for:"
        - list [ref=e2194]:
          - listitem [ref=e2195]: None
        - list [ref=e2196]:
          - listitem [ref=e2197]: Nosing
        - paragraph [ref=e2198]: Number 4.
        - paragraph [ref=e2199]: We can also set the overhang of the nosing.
        - paragraph [ref=e2200]: "As we can see the settings have been executed:"
        - paragraph [ref=e2201]:
          - img "Placing a Benchtop 示意图" [ref=e2202]
        - paragraph [ref=e2203]: In the same way a Benchtop can be added to multiple Cabinets at the same time.
        - paragraph [ref=e2204]:
          - img "Placing a Benchtop 示意图" [ref=e2205]
        - paragraph [ref=e2206]: We can select all the Cabinets that are under the Bench height and add the Benchtop with the CI Tools>Cabinets>Add a Benchtop Command.
        - paragraph [ref=e2207]:
          - img "Placing a Benchtop 示意图" [ref=e2208]
        - paragraph [ref=e2209]: A single Benchtop will b placed on the selected Cabinets.
        - paragraph [ref=e2210]:
          - img "Placing a Benchtop 示意图" [ref=e2211]
        - paragraph [ref=e2212]: Adjusting The Benchtop edges
        - paragraph [ref=e2213]: The Benchtop can also be adjusted in 3D to create variations on the edges.
        - paragraph [ref=e2214]: With the Benchtop selected in 3D we can activate the edge editor, please note the Individual settings
        - paragraph [ref=e2215]:
          - img "Placing a Benchtop 示意图" [ref=e2216]
        - paragraph [ref=e2217]: It is also possible to do an adjustment to all contiguous edges.
        - paragraph [ref=e2218]:
          - img "Placing a Benchtop 示意图" [ref=e2219]
        - paragraph [ref=e2220]: The edge overhang can also be adjusted or removed in the plan view.
        - paragraph [ref=e2221]: By selecting the Benchtop and the Offset button (with individual editing selected) the overhang can be changed.
        - paragraph [ref=e2222]:
          - img "Placing a Benchtop 示意图" [ref=e2223]
        - paragraph [ref=e2224]: One can also change the edge type of the Nosing Profile in the Settings dialog of the benchtop.
        - paragraph [ref=e2225]:
          - img "Placing a Benchtop 示意图" [ref=e2226]
