          - heading "How to Create and Use a Custom Space Filler" [level=3] [ref=e1310]
        - generic [ref=e1311]:
          - text: 原文来源：
          - link "MyCi 知识库 · How to Create and Use a Custom Space Filler" [ref=e1312] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/4405455066767-How-to-Create-and-Use-a-Custom-Space-Filler
        - paragraph [ref=e1313]:
          - text: There are a (growing) number of different space filler types (wine rack, plate rack, glassware, books, etc.) built into the cabinets. However, if you want to place something completely different into a cabinet, you can always create a
          - emphasis [ref=e1314]: Custom Space Filler
          - text: .
        - paragraph [ref=e1315]: "To create a custom space filler:"
        - list [ref=e1316]:
          - listitem [ref=e1317]: Model (or obtain a model of) the item you want to include. This should be modeled using basic Archicad elements (e.g. slab, wall, mesh, morph) rather than a library-part.
        - list [ref=e1318]:
          - listitem [ref=e1319]: Select the model in plan view.
        - list [ref=e1320]:
          - listitem [ref=e1321]: From the File menu, choose Libraries and Objects > Save Selection As ... and choose the type to be Cabinet Space Filler.
        - list [ref=e1322]:
          - listitem [ref=e1323]: Enter a name for the new space filler.
        - table [ref=e1325]:
          - rowgroup [ref=e1326]:
            - 'row "Note that you can append the bounding-box dimensions of the space filler to the filename, e.g. *MyTeapot_213x160x175mm*. The dimensions should: - Begin with an underscore character. - Be in the order x , y , z . - Be separated with the x character. - Be followed by either mm or inch to indicate the unit. If you do this, whenever you select the space filler, the correct dimensions will be applied." [ref=e1327]'
          - rowgroup
        - paragraph [ref=e1329]: "To use the space filler you created above:"
        - list [ref=e1330]:
          - listitem [ref=e1331]: Select the cabinet into which you want to place the space filler.
        - list [ref=e1332]:
          - listitem [ref=e1333]: Open the cabinet's Settings dialog.
        - list [ref=e1334]:
          - listitem [ref=e1335]: On the Spaces > Available Filler Types page, click the + button to add a new filler type.
        - list [ref=e1336]:
          - listitem [ref=e1337]: Enter a Name , and set the Type to Custom Space Filler .
        - list [ref=e1338]:
          - listitem [ref=e1339]: Choose the space filler you created from the list.
        - list [ref=e1340]:
          - listitem [ref=e1341]: If you didn't include the bounding-box dimension in the space filler's filename, or if you want to change the dimensions, set the dimensions manually.
        - list [ref=e1342]:
          - listitem [ref=e1343]: On the Spaces page, select one or more spaces, and choose the new space filler type you created in steps 1 - 6.
      - generic [ref=e1344]:
        - generic [ref=e1345]:
          - generic [ref=e1346]: "30"
          - heading "How to Define a Plan View" [level=3] [ref=e1347]
        - generic [ref=e1348]:
          - text: 原文来源：
          - link "MyCi 知识库 · How to Define a Plan View" [ref=e1349] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001008435-How-to-Define-a-Plan-View
        - paragraph [ref=e1350]: The way in which cabinetry should display in plan view, will depend on the type of information you want to convey in that view.
        - paragraph [ref=e1351]: "For instance, you might want to show:"
        - list [ref=e1352]:
          - listitem [ref=e1353]: Under-bench cabinets in detail, including door swings, drawers and vertical walls and partitions. Benchtop and wall-mounted cabinets as a dashed outline above. This could be used to show the dimensions of the under-bench cabinets, or to label under-bench units.
        - list [ref=e1354]:
          - listitem [ref=e1355]: Wall-mounted cabinets in detail, with the benchtop a filled polygon, and under-bench cabinetry as a dashed outline below. This could be used to show the dimensions of wall-mounted cabinets, or to label wall-mounted units.
        - list [ref=e1356]:
          - listitem [ref=e1357]: The benchtop as a filled polygon, with both under-bench cabinetry and wall-mounted cabinetry as dashed outlines. This could be used to indicate the spatial extent of the cabinetry while keeping the plan view relatively uncluttered.
        - paragraph [ref=e1358]:
          - text: The
          - strong [ref=e1359]: Model View Option
          - text: settings provides control over how cabinets and benchtop will appear in plan views, depending on their height in relation to the cutting plane.
        - heading "Cutting Plane Height" [level=2] [ref=e1360]
        - paragraph [ref=e1361]:
          - text: On the
          - strong [ref=e1362]: Plan View
          - text: page, set the
          - strong [ref=e1363]: Cutting Plane Height
          - text: relative to the current story level.
        - paragraph [ref=e1364]:
          - img "How to Define a Plan View 示意图" [ref=e1365]
        - paragraph [ref=e1366]: "Cabinets will respond to the cutting plane height based on their position relative to the cutting plane. Each cabinet may be:"
        - list [ref=e1367]:
          - listitem [ref=e1368]: Sliced through – the cutting place slices through the cabinet in this view.
        - list [ref=e1369]:
          - listitem [ref=e1370]: Wholly below the cutting plane.
        - list [ref=e1371]:
          - listitem [ref=e1372]: Wholly above the cutting plane.
        - heading "Sliced-Through Cabinets" [level=3] [ref=e1373]
        - paragraph [ref=e1374]:
          - text: Cabinets that are sliced through by the
          - strong [ref=e1375]: Cutting Plane Height
          - text: will display as cut elements in plan view.
        - paragraph [ref=e1376]:
          - text: If the
          - strong [ref=e1377]: Show Detail at Cutting Plane
          - text: setting is
          - strong [ref=e1378]: "On"
          - text: ", Doors, drawer fronts, walls and vertical dividers that are sliced by the cutting plane will appear in detail, using section pens, fills and line types."
        - paragraph [ref=e1379]:
          - img "How to Define a Plan View 示意图" [ref=e1380]
        - paragraph [ref=e1381]:
          - text: If the
          - strong [ref=e1382]: Show Detail at Cutting Plane
          - text: setting is
          - strong [ref=e1383]: "Off"
          - text: ", a simplified view will be displayed."
        - paragraph [ref=e1384]:
          - img "How to Define a Plan View 示意图" [ref=e1385]
        - heading "Cabinets Below the Cutting Plane" [level=3] [ref=e1386]
        - paragraph [ref=e1387]: Any cabinet that lies wholly beneath the cutting plane will display as a simple polygon.
        - paragraph [ref=e1388]:
