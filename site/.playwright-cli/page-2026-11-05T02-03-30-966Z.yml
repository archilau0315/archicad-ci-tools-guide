        - list [ref=e1274]:
          - listitem [ref=e1275]: "Choose how the handle should be applied:"
        - paragraph [ref=e1276]: Place Directly on Front – choose this option if the natural orientation of the handle you created was in the plane of the floor plan, as in the example.
