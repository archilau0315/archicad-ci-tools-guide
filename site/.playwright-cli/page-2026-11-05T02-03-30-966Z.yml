          - heading "Reference Guide - Cabinet Configuration" [level=3] [ref=e2421]
        - generic [ref=e2422]:
          - text: 原文来源：
          - link "MyCi 知识库 · Reference Guide - Cabinet Configuration" [ref=e2423] [cursor=pointer]:
            - /url: https://cadimage.zendesk.com/hc/en-us/articles/11733463596815-Reference-Guide-Cabinet-Configuration
        - paragraph [ref=e2424]: The Cabinets Tool allows for the creation of very detailed cabinetry models with speed and ease. It allow for the placement of basic ‘place-holder’ cabinetry or intricate fully bespoke cabinetry design for documentation and manufacturing.
        - paragraph [ref=e2425]:
          - strong [ref=e2426]: Reference Guide - Cabinet Configuration
        - paragraph [ref=e2427]: Under the Configuration tab the overall dimensions of the Cabinet can be set.
        - list [ref=e2428]:
          - listitem [ref=e2429]: It is also possible to lock a particular aspect of the Cabinet for ease of adjustment.
        - paragraph [ref=e2430]: (This option will be greyed out.)
        - list [ref=e2431]:
          - listitem [ref=e2432]: It is also possible to set the overall Face and Plinth options in this tab.
        - list [ref=e2433]:
          - listitem [ref=e2434]: The Surfaces to be used in the model can also be set.
        - paragraph [ref=e2435]:
          - img "Reference Guide - Cabinet Configuration 示意图" [ref=e2436]
        - paragraph [ref=e2437]:
          - strong [ref=e2438]: Face
        - paragraph [ref=e2439]: Under the Face menu selection it is possible to adjust the width and appearance of all aspects of the Face.
        - list [ref=e2440]:
          - listitem [ref=e2441]: The type of Face can be selected as Frameless, Inset , Half Overlay and Full Overlay.
        - paragraph [ref=e2442]:
          - img "Reference Guide - Cabinet Configuration 示意图" [ref=e2443]
        - paragraph [ref=e2444]: Let us explore each of these individually.
