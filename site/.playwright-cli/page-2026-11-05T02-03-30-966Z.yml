        - paragraph [ref=e169]: Both of these options allow you to control the performance of the model. High resolution cabinets look the best – but may be difficult for your computer to work with if you have a number of them. By decreasing the resolution you will improve the performance of the 3D Window as well as 3D generated views such as sections or elevations.
        - paragraph [ref=e170]: In a similar way, if you have large numbers of cabinets on plan, a ‘Projection’ will have slower performance than a symbol based view. This is because the projection needs to generate the 3D view in order to display the plan view symbol. The symbol on the other hand uses a script to show a symbolic view of the cabinet.
        - paragraph [ref=e171]: Shelf Outlines
        - paragraph [ref=e172]: "This setting controls whether you will see the shelf outlines on the surface of your cabinet:"
