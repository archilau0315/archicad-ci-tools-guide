          - img "How to Create and Use Custom Muntins 示意图" [ref=e1164]
        - list [ref=e1165]:
          - listitem [ref=e1166]: From the Front list, choose the front that contains custom muntins.
        - list [ref=e1167]:
          - listitem [ref=e1168]: Click OK to apply the settings.
        - paragraph [ref=e1169]:
          - img "How to Create and Use Custom Muntins 示意图" [ref=e1170]
        - heading "Share the Front" [level=2] [ref=e1171]
        - paragraph [ref=e1172]: "To share the front, including its new custom muntins, with other cabinets in the project:"
        - list [ref=e1173]:
          - listitem [ref=e1174]: Select a cabinet that uses the front, and open its Settings dialog.
        - list [ref=e1175]:
          - listitem [ref=e1176]: On the Available Fronts page, click the Copy button.
        - list [ref=e1177]:
          - listitem [ref=e1178]: Click OK to close the dialog.
        - list [ref=e1179]:
          - listitem [ref=e1180]: Select any other cabinet in which you wish to use the front, and open its Settings dialog.
        - list [ref=e1181]:
