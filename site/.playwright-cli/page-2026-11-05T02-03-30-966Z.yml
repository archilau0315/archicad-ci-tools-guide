        - paragraph [ref=e1731]: "To remove a vertical unit partition:"
        - list [ref=e1732]:
          - listitem [ref=e1733]: Select the cabinet in plan-view.
        - paragraph [ref=e1734]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1735]
        - list [ref=e1736]:
          - listitem [ref=e1737]: Click on the hotspot at the back edge of a unit partition, and drag the partition out of the cabinet. The partition will disappear.
        - paragraph [ref=e1738]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1739]
