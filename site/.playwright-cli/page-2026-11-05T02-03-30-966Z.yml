        - heading "General Partition Functions for all Cabinets" [level=2] [ref=e1744]
        - paragraph [ref=e1745]:
          - text: All cabinets in the
          - emphasis [ref=e1746]: CI Cabinets
          - text: library provide functionality to split the cabinet with vertical and horizontal partitions. Each partition may define the boundary of a unit or module, or the position of a shelf or divider.
        - heading "Add a Partition" [level=3] [ref=e1747]
        - paragraph [ref=e1748]: Partitioning may be carried out in a 3D, Elevation or Section view.
        - list [ref=e1749]:
          - listitem [ref=e1750]: In a 3D view (or in a Section or Elevation view), select the cabinet that you want to partition, and open its Settings dialog.
        - paragraph [ref=e1751]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1752]
        - list [ref=e1753]:
          - listitem [ref=e1754]: On the Grids and Editing page, set Editing Palette > Edit Mode to Partitions , and click OK .
        - paragraph [ref=e1755]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1756]
        - list [ref=e1757]:
          - listitem [ref=e1758]: "You’ll notice some changes:"
        - paragraph [ref=e1759]: An editing palette will appear near the cabinet.
        - list [ref=e1760]:
          - listitem [ref=e1761]: The cabinet will be drawn in wireframe.
        - paragraph [ref=e1762]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1763]
        - paragraph [ref=e1764]: "From top to bottom, the partition types provided by the editing palette are:"
        - list [ref=e1765]:
          - listitem [ref=e1766]: Unit partition (vertical)
        - list [ref=e1767]:
          - listitem [ref=e1768]: Unit partition (horizontal)
        - list [ref=e1769]:
          - listitem [ref=e1770]: Module partition – closed (vertical) – includes a partition wall within the carcass
        - list [ref=e1771]:
          - listitem [ref=e1772]: Module partition - closed (horizontal) – including partition wall within the carcass
        - list [ref=e1773]:
          - listitem [ref=e1774]: Module partition – open (vertical) – no partition wall
        - list [ref=e1775]:
          - listitem [ref=e1776]: Module partition – open (horizontal) – no partition wall
        - list [ref=e1777]:
          - listitem [ref=e1778]: Internal divider (vertical) – a vertical divider within a module
        - list [ref=e1779]:
          - listitem [ref=e1780]: Internal shelf (horizontal) – a shelf or rail within a module
        - list [ref=e1781]:
          - listitem [ref=e1782]: Drag a hotspot from the editing palette onto the front face of the cabinet. As you do so, you will see that a partition is created at the hotspot position.
        - paragraph [ref=e1783]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1784]
        - list [ref=e1785]:
          - listitem [ref=e1786]: Drop the hotspot at the desired position to create the partition.
        - paragraph [ref=e1787]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1788]
        - list [ref=e1789]:
          - listitem [ref=e1790]: You can continue to add any number of partitions. Once you’ve finished, move the palette slider to the X
        - paragraph [ref=e1791]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1792]
        - paragraph [ref=e1793]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1794]
        - list [ref=e1795]:
          - listitem [ref=e1796]: The editing palette will disappear, and the cabinet will display in full detail.
        - paragraph [ref=e1797]:
          - img "How to Partition a Cabinet Graphically 示意图" [ref=e1798]
