        - generic [ref=e396]:
          - paragraph [ref=e397]: Quantities 中的测量定义在配方中，这符合这样一个理念：成本的计算通常是许多"食材"的组合，而不是简单地清点构件的某个属性或将其总计。一个配方可以将任意数量的测量项绑定在一起，每一项测量都可以引用任意组合的构件属性和几何，并通过规则将它们与"贡献到哪个清单条目"以及"何时进行每项测量"关联起来。
          - paragraph [ref=e398]: 接下来的各节将从基本的计数配方开始，逐步过渡到实现计算、可选/自动测量，最后以一些常见示例和问题收尾。
          - paragraph [ref=e399]: 测量配方在工程量管理器中查看，可通过点击菜单项 CI Tools > Quantities > Quantity Take-off Manager 并选择"配方"选项卡打开。所有 Quantities 面板还都显示一个图标，可快速打开该管理器对话框（
          - paragraph [ref=e400]:
            - img "4.2 Measurement Recipes 示意图" [ref=e401]
          - paragraph [ref=e402]: ）。
          - paragraph [ref=e403]:
            - img "4.2 Measurement Recipes 示意图" [ref=e404]
          - paragraph [ref=e405]: 管理器的主要功能如下：
          - list [ref=e406]:
            - listitem [ref=e407]: 可选择管理清单结构或测量配方。界面结构体现了清单结构与配方之间的紧密联系。点击 Recipes 以配合本节内容。
          - list [ref=e408]:
            - listitem [ref=e409]: 不可编辑的清单结构视图，主要用于定义清单条目与测量项之间的关联（更多细节见面板 4）。其功能包括： a. 清单筛选器 —— 输入名称的任何部分即可仅显示匹配的项目。 b. 清单结构。分类可以展开或折叠，且同时包含项目清单和已链接的清单。 c. 更多清单筛选器。"视图方式"菜单主要用于层级化清单结构，可显示"完整 BoQ 结构"（如上图所示）或"扁平清单条目列表"（省略全部分类，仅列出清单条目）。"仅显示未使用项目"会将清单筛选为仅显示尚未链接到配方的项目，有助于确保项目成本未被忽略（参见第 6 节 审计，了解更多质量检查功能）。
          - list [ref=e410]:
            - listitem [ref=e411]: 配方列表，附带用于创建、删除、导入和导出清单条目的按钮。每个配方前面都有一个复选框，用于切换其启用或停用（停用后该配方不会计算数量）。由该配方进行的测量列在下方的面板中（见下文第 4 项）。可以选择多个项目以快速编辑或删除，但后续面板中只有最靠前的所选配方的测量项可以编辑。
          - list [ref=e412]:
            - listitem [ref=e413]: 所选配方的属性，包括： a. 一段表达式，可将配方自动附加到目标构件。只要该表达式为真，配方就会附加到相应构件。例如，如果某配方适用于任何含砖材质的墙体，其链接表达式可以是：
          - paragraph [ref=e414]: wall.material contains “brick”
          - paragraph [ref=e415]: 更多信息见第 4.5 节，表达式示例见第 4.5.6 节。 b. 该配方所进行的测量列表，汇总显示所链接的清单条目键/名称以及数量计算。所选测量项的详情显示在下方面板中（并可编辑）（见下文面板 5）。可以选择多个测量项，但只能查看或编辑最靠前的所选行的详情。 c. 当面板 2 中至少选中一个清单条目时，此按钮可用。点击后，所选清单条目将被添加到配方测量列表中。每个清单条目只能添加到配方一次 —— 任何后续尝试都将被忽略。 d. 当面板 2 中选中了某个项目、且在测量列表中也选中了某个项目时，此按钮可用。点击后，所选清单条目将替换所选测量项原本链接的清单条目。这比先移除旧条目、再添加替换项并重新创建计算要快捷得多。 e. 当在测量列表中选中了某个项目时，此按钮可用。点击后，该项目将从测量列表中移除。
          - list [ref=e416]:
            - listitem [ref=e417]: 所选测量项的属性（在面板 4 中）。这些表达式决定了何时进行测量以及如何计算： a. 一段可选表达式，用于确定何时应进行测量。如果不输入任何内容，数量计算将应用于该配方所附加的每一个构件。此选项有助于降低 4a 中表达式的复杂度，有助于避免为非常狭窄的用途创建大量配方，并允许配方进行多项针对共同主题的测量。例如，可以创建一个用于计算与砖墙相关数量的配方，其中包含一项计算砖砌拉结件数量的计算 —— 但仅针对相关的墙体。目标墙体可以基于几何、构造和/或属性来查找。另一种用途是测量需要针对各种尺寸定价的产品，例如废料管。该配方可以有一个通用条件，自动附加到相关的排水对象，而与废料管产品相关联的各个清单条目则可以各自带有一段表达式，以确保只计入相关尺寸。Quantities 会立即检查新输入的表达式，并在无法理解时给出反馈。只要该测量项在列表中保持选中，无效表达式的文本就会一直保留；但当选中另一个测量项或配方时，该文本将被丢弃（并恢复先前的文本）。 b. 数量计算。第 4.4 节对此有更深入的讲解，表达式文档详见第 7 节 构件计算表达式。计算的范围非常广，从固定的数值一直到涉及属性、参数、几何、属性项等诸多的复杂表达式。第 4.3.1 节展示了一个仅对每个项目进行计数的简单示例。任何带名称的内容，例如属性项、属性和参数，都可以按名称单独引用，例如墙体中保温层皮层的体积可用以下方式测量：
          - paragraph [ref=e418]: wall.material("Insulation").volume
          - paragraph [ref=e419]: 如果计算的任何部分无法应用于被测量的构件，Quantities 始终会确保结果为零，例如将上述表达式用于非墙体或没有名为 "Insulation" 的材质的构件时。表达式也可以引用当前项目中并不存在的材质、属性等名称。其目的是允许以通用方式编写计算，从而广泛适用，而不必担心出现一连串的错误消息或无意义的结果，从而支持可在众多项目间共享的模板配方这一理念。Quantities 会立即检查新输入的表达式，并在无法理解时给出反馈。只要该测量项在列表中保持选中，无效表达式的文本就会一直保留；但当选中另一个测量项或配方时，该文本将被丢弃（并恢复先前的文本）。
