          - heading "3.1 背景" [level=3] [ref=e100]
        - link "MyCi 官方原文 ↗" [ref=e102] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393675-3-1-Background
        - generic [ref=e103]:
          - paragraph [ref=e104]: 建筑项目通常通过工程量清单来定价，将建造内容分解为离散的、明确理解的、成本已知的条目。条目列表可能非常庞大，因此通常以层级方式组织：顶部是宽泛的分类，越往下描述越加细致。对建筑构件进行测量，并将数量记入相应的清单条目。一面墙可能对许多不同的成本都有贡献，例如砖/砌块/骨架、保温层和饰面。
          - paragraph [ref=e105]: 清单结构可以在内部自行编制、逐个项目定制，也可以从外部数据源导入，例如数据库或基于云的数据源。该软件的设计旨在涵盖上述所有情形，并计划在未来提供额外的连接能力，以直接链接第三方工程量清单。
          - paragraph [ref=e106]: 本节讨论不同类型的清单结构，以及创建、导入、编辑和导出的方法。
        - group [ref=e107]:
          - generic "▸ 英文原文对照" [ref=e108] [cursor=pointer]:
            - text: ▸
            - generic [ref=e109]: 英文原文对照
