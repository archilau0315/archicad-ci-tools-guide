            - text: 中的第 4a 项）在跟踪清单条目的使用情况方面发挥着关键作用：
          - paragraph [ref=e1422]:
            - img "5.2.7 How to audit correct bill item usage 示意图" [ref=e1423]
          - paragraph [ref=e1424]: 该菜单的选项用于筛选所显示的项目，如下：
          - list [ref=e1425]:
            - listitem [ref=e1426]: 已计算的条目 仅显示计算后总计不为零的清单条目。
          - list [ref=e1427]:
            - listitem [ref=e1428]: 全部清单条目 显示所有清单条目
          - list [ref=e1429]:
            - listitem [ref=e1430]: 零数量 仅显示在算量过程中执行过测量计算但总计仍为零的清单条目
          - list [ref=e1431]:
            - listitem [ref=e1432]: 未使用的条目 仅显示完全未用于算量的清单条目
          - paragraph [ref=e1433]:
            - text: 使用此菜单和
            - emphasis [ref=e1434]: Quantities
            - text: 的其他功能，信息板审计流程包括：
          - list [ref=e1435]:
            - listitem [ref=e1436]: 检查构件一致性
          - paragraph [ref=e1437]: 第 5.2.6 节描述了一种将成本追溯到源构件的方法。这种选择技术与其他审计流程配合使用时非常强大，例如使用 Quantities 信息板（第 2.2 节）检查属性不一致情况，以及检查模型中缺失的构件。请留意配方附加关系或属性值上的异常差异 —— 信息板会以蓝色高亮显示不同的取值，使其醒目突出。使用其筛选功能可以隔离出设置异常的构件，或通过搜索扩展到其他应当同样计量的相似构件。
          - paragraph [ref=e1438]: 例如，选中与外墙覆面相关的构件可能会发现某些模型墙体被遗漏，而另一些则被错误地包含在内。如果配方规则或测量与属性值相关，信息板可以迅速高亮显示这些不一致之处，并且可以通过同一信息板立即更新。
          - list [ref=e1439]:
            - listitem [ref=e1440]: 检查清单条目使用情况
          - paragraph [ref=e1441]:
            - text: 未被任何配方引用的清单条目可能意味着疏漏。虽然某些条目对特定项目而言可能无关紧要，但仍应予以检查。将 Show 菜单设为 Unused items 即可快速复核。这些条目还可以通过在左侧清单结构中选中条目或分类进一步筛选（
            - link "示意图" [ref=e1442] [cursor=pointer]:
              - /url: "#5.2.Scheduling%20Quantities|outline"
            - text: 中的第 1b 项）。
          - list [ref=e1443]:
            - listitem [ref=e1444]: 检查计算结果
          - paragraph [ref=e1445]: 某个清单条目在算量结果中总计为零，即使配方已表示存在并且正在对项目构件运行相关规则或数量计算。虽然有可能这些构件确实都不产生成本，但仍建议进行检查。
          - paragraph [ref=e1446]: 将 Show 菜单设为 Z e ro quantities（零数量）可查看受影响的条目，并应用上文"检查构件一致性"中所述的技术方法。如果构件本身没有问题，或者配方关联了错误的构件，请使用工程量管理器（Quantity Take-off Manager）的"配方"选项卡（参见第 4.2 节）来复核与受影响清单条目相关联的配方规则和/或计算。
          - paragraph [ref=e1447]: 所有审计方法的汇总可见第 6 章。
