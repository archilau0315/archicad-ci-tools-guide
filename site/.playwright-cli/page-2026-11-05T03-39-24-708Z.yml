        - link "MyCi 官方原文 ↗" [ref=e142] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001401136-3-3-Creating-and-managing-a-Bill-structure
        - generic [ref=e143]:
          - paragraph [ref=e144]: 工程量清单可以在工程量管理器中查看和编辑，可通过点击菜单项 CI Tools > Quantities > Quantity Take-off Manager 并选择"清单结构"选项卡打开。所有 Quantities 面板还都显示一个图标，可快速打开该管理器对话框。
          - paragraph [ref=e145]:
            - img "3.3 Creating and managing a Bill structure 示意图" [ref=e146]
          - paragraph [ref=e147]: 管理器的主要功能如下：
          - list [ref=e148]:
            - listitem [ref=e149]: 可选择管理清单结构或测量配方。点击 Bill Structure 以配合本节内容。
          - list [ref=e150]:
            - listitem [ref=e151]: 清单结构概览，附带用于创建、删除、导入和导出清单条目的按钮。所选条目的详情显示在下方面板中（见下文第 3 项）。清单结构以当前打开项目的名称为标题。项目之下的下一项以 Project Bill 为标题。在管理器中创建的任何条目都显示在该标题之下；它们保存在项目文件中，且只能应用于当前项目。如果有清单结构从外部数据源（例如外部文件或数据库）链接到本项目，它将显示在单独的标题之下且不可编辑（详见第 3.3.7 节和第 3.3.8 节）。可以选择多个项目以快速编辑或删除。
          - list [ref=e152]:
            - listitem [ref=e153]: 所选清单条目的详情。如果选中了多个项目，则只显示第一个项目的详情。以下字段可以对多个项目同时编辑，但键和名称除外（键和名称只会更改第一个项目）。 a. 条目键。它可以是字母和数字的任意组合，但不应与同一层级中的任何其他条目重复（为了清晰起见，因为计算出的项目数量会在算量表中针对该键进行登记）。这些键通常反映既有的构造分类体系，例如 Uniclass。完整的条目键显示在此字段旁。当条目以层级方式归入某个分类之下时，完整键会在条目键前加上祖先分类的键，例如'10.24.73'。如果清单是扁平列表（即没有分类），则键与完整键相同。 b. 条目标题。可以输入任何内容。 c. 可选的外部引用，例如制造商或外部数据库代码，仅供信息参考。此信息会包含在导出的算量表中。 d. 单价，即每单位成本。如果成本是依据导出的数量在外部计算的，可以为零。 e. 计量单位，例如'metre'、'mm'、'each'，在弹出菜单中显示。这些项目由用户自行定义 —— 更多信息参见第 3.3.5 节。 f. 可选的描述，通常用于说明应计量什么（或如何计量）。此信息不包含在算量表中。
          - paragraph [ref=e154]: 请注意，只有点击 OK 按钮后对清单结构的更改才会生效。如果点击 Cancel，则所有更改都将被丢弃。
