          - paragraph [ref=e1154]: 如果附加配方的规则是自动化测量的唯一机制，那么它很容易需要一个庞大的配方列表，通过细微差异来应对每一种情况。在实践中，许多配方大体的条件相同，只是在数量计算或目标清单条目上略有不同。
          - paragraph [ref=e1155]: 这引出了"配方"概念的核心：许多不同的"食材"可以组合在一个方案中。例如，考虑一个大体上用于核算砖砌体成本的配方。只要材质命名恰当，就可以轻松地基于"材质名称包含 brick 一词"这一依据附加配方。即使成本或砖的类型是通过属性来识别的，也存在两个潜在问题：
          - list [ref=e1156]:
            - listitem [ref=e1157]: 每种砖类型的单价（成本）可能取决于清单或外部数据库中的数据，在这种情况下，每种砖类型的数量将归入不同的条目
          - list [ref=e1158]:
            - listitem [ref=e1159]: 单个墙体中可能存在多种砖皮层，且其类型或厚度可能各不相同。
          - paragraph [ref=e1160]:
            - text: 一旦创建了"brick"配方并附加了指向所有相关墙体的规则，就可以为每个清单条目附加一条规则和一项计算，用以决定何时以及如何进行测量。参见第 4.2 节的插图，注意
            - emphasis [ref=e1161]: Recipe
            - emphasis [ref=e1162]: Manager
            - text: 的以下特点：
          - list [ref=e1163]:
            - listitem [ref=e1164]:
              - text: 已添加到配方中的清单条目列表，见
              - link "面板 4" [ref=e1165] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ；
          - list [ref=e1166]:
            - listitem [ref=e1167]:
              - text: 针对所选清单条目进行测量的规则，见
              - link "面板 5，字段 a" [ref=e1168] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ；
          - list [ref=e1169]:
            - listitem [ref=e1170]:
              - text: 所选清单条目的数量计算，见
              - link "面板 5，字段 b" [ref=e1171] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ；
          - paragraph [ref=e1172]: 对于砖的类型，理想的做法是用材质名称来定义砖的类型（通过供应商代码或产品名称）。例如，如果某种特定砖的材质命名为"Brick – Furness Handbridge Blend 215"，则规则可以是：
          - paragraph [ref=e1173]:
            - emphasis [ref=e1174]: wall.material includes “Brick – Furness Handbridge Blend 215”
          - paragraph [ref=e1175]: ……从而确保当墙体包含该确切砖类型时，数量计算会针对该清单条目进行测量。此后数量计算还可以引用该特定材质的体积，将其除以单块砖的单位体积（此情况下可以把砂浆计入其中，但也有许多其他做法）：
          - paragraph [ref=e1176]:
            - emphasis [ref=e1177]: wall.material(“Brick – Furness Handbridge Blend 215”).volume / 0.00125
          - paragraph [ref=e1178]: 如果数量需要向上取整到最近的整数，则可以写为：
          - paragraph [ref=e1179]:
            - emphasis [ref=e1180]: roundUp(wall.material(“Brick – Furness Handbridge Blend 215”).volume / 0.00125, 1)
          - paragraph [ref=e1181]: 并没有规则来决定何时应新建一个配方，而不是在现有配方中使用可选测量。技术上完全可以只做一个附加到所有构件的配方，让可选测量来分配数量，但该配方以及可选测量的规则很可能复杂而臃肿。反过来，为每一项数量测量都设置不同的配方也是可能的，但这样的列表很可能长得难以实施，且附加规则也会非常复杂。
          - paragraph [ref=e1182]: 最佳策略是：让配方面向大体相似的清单条目组或构件组，并让可选测量去处理细节。
