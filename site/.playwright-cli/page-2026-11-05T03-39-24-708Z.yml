            - listitem [ref=e1399]: 对成本有贡献的构件可以在模型中实时交互式查看，包括其在 Quantities 信息板（第 2.2 节）中所分配的属性、分类和配方。这可以快速解释异常成本模式（意外偏低或偏高）的原因，并高亮显示模型或构件属性中不一致之处。
          - list [ref=e1400]:
            - listitem [ref=e1401]: Quantities 可以区分完全未使用的清单条目与被计算命中但结果仍为零的清单条目。这两种情况都提示存在错误，但原因各不相同。更多信息请参见第 5.2.7 节。
          - paragraph [ref=e1402]:
            - text: 要使用此功能，请在面板 3 中选中任意数量的算量条目，然后点击
            - emphasis [ref=e1403]: Select
            - text: （
            - link "示意图" [ref=e1404] [cursor=pointer]:
              - /url: "#5.2.Scheduling%20Quantities|outline"
            - text: 中的第 2d 项）。
            - emphasis [ref=e1405]: Quantities
            - text: 将在当前视图中选中并缩放到所有为所选清单条目成本做出贡献的构件。如果某些条目当前处于隐藏状态，其所在图层将被设为可见。
          - paragraph [ref=e1406]:
            - text: 请注意，可能无法在当前视图中看到所有条目，例如当平面图处于激活状态而条目跨越多个楼层时。最佳选择通常是三维窗口，其中除填充图案外的一切均可见。最初计算算量时所依据的视图对此过程没有影响，即您可以从一个视图进行计算，然后在任意其他视图中点击
            - emphasis [ref=e1407]: Select
            - text: 。
