        - generic [ref=e384]:
          - paragraph [ref=e385]: 标准化的测量方法是 Quantities 的核心，它定义了应如何以及何时从 ARCHICAD 模型构件中计算数量。
          - paragraph [ref=e386]: 除基本的设施和配件计数之外，构件很少与单个清单条目存在简单关联。一面墙可能对外墙覆面、多种构造材料（包括保温层）、配筋、内部/外部饰面的任意组合以及更多内容都有所贡献。不仅如此，一个构件所代表的构造可能并不与其绘制所用工具所暗示的相同，例如一面墙可能代表管沟，可以对其开挖、支护、基础/垫层、人工、敷设长度（管道/电缆等）、设备租赁以及任意数量的其他构件进行计量。
