        - generic [ref=e111]:
          - generic [ref=e112]: "04"
          - heading "3.2 清单结构" [level=3] [ref=e113]
        - link "MyCi 官方原文 ↗" [ref=e115] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393695-3-2-Bill-structure
        - generic [ref=e116]:
          - paragraph [ref=e117]: 清单可以采用 2 种方式组织，以反映项目和工作流程的需求：
          - list [ref=e118]:
            - listitem [ref=e119]: 简单型
          - paragraph [ref=e120]: 清单只是一个扁平的条目列表，即没有分类。这可能适合规模较小的项目，或只需对部分可能的条目或工种进行报价的工作流程。条目以标准图标显示在 Project Bill 之下：
          - paragraph [ref=e121]:
            - img "3.2 Bill structure 示意图" [ref=e122]
          - list [ref=e123]:
            - listitem [ref=e124]: 层级型
          - paragraph [ref=e125]: 大型 BoQ 中的条目若按分类分组为树状结构（可能有多层深），管理起来会更容易。除了便于查找特定条目之外，分类还将相似条目归拢在一起，并在算量时提供小计。分类以文件夹图标显示，并按类似标准文件系统的树状结构排列：
          - paragraph [ref=e126]:
            - img "3.2 Bill structure 示意图" [ref=e127]
          - paragraph [ref=e128]: 可以通过相邻的箭头显示或隐藏分类的内容。请注意，Quantities 提供了在某些视图中省略分类的选项，仅以扁平列表显示条目。
          - paragraph [ref=e129]: 层级中任何条目的完整键都会自动加上其父分类的键作为前缀，例如：
          - paragraph [ref=e130]:
            - img "3.2 Bill structure 示意图" [ref=e131]
          - paragraph [ref=e132]: 清单结构对软件的其他功能没有影响，并且可以随时更改。请注意，尽管清单条目键中包含父分类的键，但仍可以通过手动添加分类键来省略层级中的任意部分，例如扁平列表中的条目可以直接被赋予键'10.24.73'。这些不同的做法可以混用，例如创建一个部分层级，并手动为任何被省略的分类的子条目加上键前缀。
          - paragraph [ref=e133]: 另请注意，带有计算数量的清单条目无论结构如何，都会以扁平列表形式导出为 CSV，便于导入电子表格，并符合条目编号、描述、单位、数量、单价和总金额的标准表头（详见第 5.2.5 节）。
