        - link "MyCi 官方原文 ↗" [ref=e2380] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004151275-7-5-Element-Properties
        - generic [ref=e2381]:
          - paragraph [ref=e2382]:
            - text: Expressions to reference element properties. These will typically be prefixed with
            - emphasis [ref=e2383]: element
            - text: ", e.g. *element.p**roperty"
            - emphasis [ref=e2384]: ", but any specific element type can be used, e.g."
            - text: wall.
            - strong [ref=e2385]: p
            - text: roperty*, if attributes are only required for that type.
          - paragraph [ref=e2386]:
            - text: Elements usually have multiple properties, but a rule or calculation will be focussed on the value of just one – therefore the name of the target property in enclosed in parentheses should be appended, e.g. *element.
            - strong [ref=e2387]: p
            - text: roperty
            - strong [ref=e2388]: (“M
            - text: anufacturer**”)*.
          - paragraph [ref=e2389]:
            - text: Property names are only guaranteed to be unique within a single group. If only a name is specified,
            - emphasis [ref=e2390]: Quantities
            - text: will take the first matching property it finds. If there is any doubt about the uniqueness of the name, it can be prefixed with the group name and a double colon, e.g. *element.
            - strong [ref=e2391]: p
            - text: roperty
            - strong [ref=e2392]: (“
            - text: "General::"
            - strong [ref=e2393]: M
            - text: anufacturer**”).*
          - paragraph [ref=e2394]:
            - text: Refer to section 4.4.7,
            - emphasis [ref=e2395]: How to use properties
            - text: for more detail.
          - table [ref=e2397]:
            - rowgroup [ref=e2398]:
