            - emphasis [ref=e823]: "false"
            - text: . An expression like this can be used as the basis for automatically attached recipes (section 4.5) or taking optional measurements (section 4.6).
          - paragraph [ref=e824]: "It is also possible to enter a list of values to be compared to data from ARCHICAD in order to avoid long, repetitive statements like:"
          - paragraph [ref=e825]:
            - emphasis [ref=e826]: (element.type = “Wall”) or (element.type = “Column”) or (element.type = “Beam”)
