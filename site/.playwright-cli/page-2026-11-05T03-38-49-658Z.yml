          - paragraph [ref=e2628]:
            - emphasis [ref=e2629]: not(element.finish contains “Paint”)
          - paragraph [ref=e2630]:
            - text: This function is intended to work on true/false values. If it receives a numeric value,
            - emphasis [ref=e2631]: zero
            - text: is interpreted as
            - emphasis [ref=e2632]: "false"
            - text: and anything else as
            - emphasis [ref=e2633]: "true"
            - text: . Text will generally be interpreted as
            - emphasis [ref=e2634]: "false"
