                - cell "endsWith" [ref=e2818]
                - cell "The result will be true if one text item ends with the other. For example, a rule to find zones with a category name ending with “Area”:*z**one.category**e**nds**With “A**rea**”*" [ref=e2819]
                - cell [ref=e2820]
              - row [ref=e2821]:
                - cell "contains" [ref=e2822]
                - cell "The result will be true if one text item contains the other. For example, a rule to find zones names containing the word “Office”:*z**one.name**c**ontains**“O**ffice**”*" [ref=e2823]
