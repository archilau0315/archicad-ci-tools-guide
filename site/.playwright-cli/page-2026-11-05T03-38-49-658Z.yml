          - generic [ref=e80]: "02"
          - heading "2.4.8 How to inject a property with a specific value into selected elements" [level=3] [ref=e81]
        - link "MyCi 官方原文 ↗" [ref=e83] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393655-2-4-8-How-to-inject-a-property-with-a-specific-value-into-selected-elements
        - generic [ref=e84]:
          - paragraph [ref=e85]: When Live Edit is on, a property can be added in the same way as any other trait (with the add trait button
          - paragraph [ref=e86]:
            - img "2.4.8 How to inject a property with a specific value into selected elements 示意图" [ref=e87]
          - paragraph [ref=e88]: ). The value can be set by selecting all values of that property and editing it the required value.
          - paragraph [ref=e89]: Alternatively, when Live Edit is off, the required property can be added to the list, set to the required value and set in the selected elements by clicking the inject button (
          - paragraph [ref=e90]:
            - img "2.4.8 How to inject a property with a specific value into selected elements 示意图" [ref=e91]
          - paragraph [ref=e92]: ).
          - paragraph [ref=e93]: There is a subtle difference in these two approaches – the former will modify the element classification if necessary to ensure the property is attached before setting the correct value, whereas the latter will only set the property value in elements that already have that property.
        - group [ref=e94]:
          - generic "▸ Official English Original" [ref=e95] [cursor=pointer]:
