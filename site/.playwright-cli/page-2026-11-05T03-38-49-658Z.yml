        - generic [ref=e2337]:
          - generic [ref=e2338]: "84"
          - heading "7.4 Element Attributes" [level=3] [ref=e2339]
        - link "MyCi 官方原文 ↗" [ref=e2341] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004057896-7-4-Element-Attributes
        - generic [ref=e2342]:
          - paragraph [ref=e2343]:
            - text: Expressions to reference element attributes, e.g. materials and finishes (ARCHICAD
            - emphasis [ref=e2344]: surfaces
            - text: ). These will typically be prefixed with
            - emphasis [ref=e2345]: element
            - text: ", e.g. *element.m**aterial"
            - emphasis [ref=e2346]: ", but any specific element type can be used, e.g."
            - text: wall.
            - strong [ref=e2347]: m
            - text: aterial*, if attributes are only required for that type.
          - paragraph [ref=e2348]:
            - text: Elements often have multiple materials or finishes, so these expressions provide a list instead of a single value. The list can be searched with
            - emphasis [ref=e2349]: contains
            - text: (for a partial match) or
            - emphasis [ref=e2350]: includes
            - text: (for an exact match). The materials can also be compared to another list of names using
            - emphasis [ref=e2351]: has
            - text: (partial match) or
            - emphasis [ref=e2352]: in
            - text: (exact match). A single item can be referenced by name in parentheses, e.g.
            - emphasis [ref=e2353]: material(“Brick”)
            - text: .
          - paragraph [ref=e2354]:
            - text: Refer to section 4.4.6,
            - emphasis [ref=e2355]: How to use a list of values
            - text: for more detail.
          - table [ref=e2357]:
            - rowgroup [ref=e2358]:
              - row [ref=e2359]:
                - columnheader "material" [ref=e2360]
                - 'columnheader "The list of materials assigned to the element. This is generally a single item, but multi-skin construction elements like walls include every material defined in composites. For a fill, the list will be empty. Referencing a specific material , e.g. *material(“Brick”)*, provides access to additional information about the material application: area: The area of the specified material, e.g. *material(“Brick”).area* volume: The total volume of the specified material, e.g. *material(“Brick”).volume* thickness: The total thickness of skins using the specified material, e.g. *material(“Brick”).t**hickness* skins: The total number of skins using the specified material, e.g. *material(“Brick”).s**kins* See section 4.4.8 for a detailed discussion of materials in expressions." [ref=e2361]'
                - columnheader [ref=e2362]
            - rowgroup [ref=e2363]:
              - row [ref=e2364]:
                - cell "finishes" [ref=e2365]
                - cell "The list of finishes assigned to the element (ARCHICAD *surfaces*). The list is extracted from the 3D body of the element, so any finish seen in the model will appear in this list. For a fill, the list will be empty. Referencing a specific finish , e.g. *material(“P**aint**”)*, provides access to the total area with that finish applied. See section 4.4.9 for a detailed discussion of finishes in expressions." [ref=e2366]
                - cell [ref=e2367]
              - row [ref=e2368]:
                - cell "fill" [ref=e2369]
                - cell "The name of the fill applied to the element. Can be a composite or simple fill name." [ref=e2370]
                - cell [ref=e2371]
        - group [ref=e2372]:
          - generic "▸ Official English Original" [ref=e2373] [cursor=pointer]:
