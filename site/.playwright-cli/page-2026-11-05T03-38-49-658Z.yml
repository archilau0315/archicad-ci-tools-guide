        - link "MyCi 官方原文 ↗" [ref=e175] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393775-3-3-2-How-to-organise-bill-items-into-a-heirarchy-of-categories
        - generic [ref=e176]:
          - paragraph [ref=e177]: "If a bill item is dragged and dropped onto another item, the target becomes a parent category for the dragged item:"
          - paragraph [ref=e178]:
            - img "3.3.2 How to organise bill items into a heirarchy of categories 示意图" [ref=e179]
          - paragraph [ref=e180]: Note that the category item displays a folder icon and an adjacent disclosure triangle to expand or collapse the child content. Therefore, categories are created in the same way as bill items – but they become categories at the moment child items are dropped into them. Categories can be nested under categories to any depth, and selections containing any combination of categories and items can be dragged and dropped to rearrange the bill hierarchy.
          - paragraph [ref=e181]: The only constraint on drag and drop is that items cannot be dragged from one bill to another, e.g. from a bill in an external file the project bill.
