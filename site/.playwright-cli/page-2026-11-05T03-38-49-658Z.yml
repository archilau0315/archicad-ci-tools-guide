          - heading "3.3.4 How to view and restore deleted bill items" [level=3] [ref=e199]
        - link "MyCi 官方原文 ↗" [ref=e201] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001401156-3-3-4-How-to-view-and-restore-deleted-bill-items
        - generic [ref=e202]:
          - paragraph [ref=e203]: Because accidental or mistaken bill item deletion could have serious implications for the calculated BoQ, the add-on has some features that simplify the process of identifying and correcting this problem. For example, a recipe linked to a deleted bill item will be highlighted in red in the manager dialog.
          - paragraph [ref=e204]: "The software also maintains a history of deleted bill items to facilitate recovery. Select either of the following in the Status menu (see 2h in the illustration) to allow previously deleted items to be visible:"
          - paragraph [ref=e205]: "• All: Both active and deleted items are shown (deleted items are displayed in italics)"
          - paragraph [ref=e206]: "• Deleted: Only deleted items are shown"
          - paragraph [ref=e207]: When a deleted item is selected, the Delete button changes to Restore, and clicking it restores the bill item(s) to normal use.
          - paragraph [ref=e208]: Set the Status menu to Current to resume viewing active items only.
        - group [ref=e209]:
