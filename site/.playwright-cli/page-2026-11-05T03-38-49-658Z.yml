        - link "MyCi 官方原文 ↗" [ref=e1974] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004057876-7-2-Element-Geometry
        - generic [ref=e1975]:
          - paragraph [ref=e1976]: Expressions that can be applied to any BIM element to retrieve generic measurements like bounding size.
          - paragraph [ref=e1977]: These will typically be prefixed with element, e.g. element.length, in order to make the measurement applicable to any element type, but any specific element type can be used, e.g. wall.length, if the measurement is only required for that type. Restricting the measurement to a single element type does not cause an error – the result of the calculation is simply voided for any other types.
          - paragraph [ref=e1978]: Also refer to section 4.4.4 for more detail about using element geometry in calculations.
          - table [ref=e1980]:
            - rowgroup [ref=e1981]:
              - row [ref=e1982]:
