        - generic [ref=e70]:
          - paragraph [ref=e71]: The trait filter button (
          - paragraph [ref=e72]:
            - img "2.4.7 How to filter an element selection for those matching specific property values 示意图" [ref=e73]
          - paragraph [ref=e74]: ) works with properties in the same way as other traits, but also filters the selection to elements with the same property and a matching value. If multiple values are selected in the palette, elements with a property and value matching any one of those items will pass the filter.
        - group [ref=e75]:
