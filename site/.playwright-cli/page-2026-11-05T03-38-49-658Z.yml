        - generic [ref=e992]:
          - paragraph [ref=e993]: "There are two ways to identify a specific element type:"
          - list [ref=e994]:
            - listitem [ref=e995]: "If the purpose is only to confirm that an element is a specific type, e.g. in the rule to attach a recipe to an element, the easiest method is to request the type for comparison, e.g.:"
