          - heading "4.5.6 Example expressions for automatic linking" [level=3] [ref=e1111]
        - link "MyCi 官方原文 ↗" [ref=e1113] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004150615-4-5-6-Example-expressions-for-automatic-linking
        - generic [ref=e1114]:
          - paragraph [ref=e1115]: There is a practically unlimited number of possible expressions for automating recipes. The following table is intended to provide a limited number of examples to stimulate ideas for possible ingredients. Individual expressions can also be combined in most cases.
          - table [ref=e1117]:
            - rowgroup [ref=e1118]:
              - row [ref=e1119]:
                - columnheader "**The target elements**" [ref=e1120]
                - columnheader "**A suitable expression**" [ref=e1121]
