          - heading "4.4.2 Does the data type matter?" [level=3] [ref=e683]
        - link "MyCi 官方原文 ↗" [ref=e685] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001401776-4-4-2-Does-the-data-type-matter
        - generic [ref=e686]:
          - paragraph [ref=e687]: "Quantities is very tolerant with mixed data types. If it finds a number where text is expected, it converts the number to text (and vice-versa). Where text is found when a number is expected, a conversion from the text to a number will be attempted – the result will be zero if no numeric characters are found. So the following statements are functionally identical:"
          - code [ref=e689]: element.height > 2
          - code [ref=e691]: element.height > “2”
          - paragraph [ref=e692]: "The same is true for different unit types, e.g. you can mix any type of property even if they mix volume, length etc., e.g.:"
          - code [ref=e694]: element.area > element.perimeter
          - paragraph [ref=e695]: The unit type of the bill item is also irrelevant to the units of any values used in the calculation. A bill can measure quantities in non-standard ways, e.g. bags, so the software assumes the user knows what is required.
        - group [ref=e696]:
          - generic "▸ Official English Original" [ref=e697] [cursor=pointer]:
