          - paragraph [ref=e812]: "Note that no errors or problems arise if the name can’t be found in the list – it simply means that any calculations using that item are void, i.e. the result will always be zero. If the item has multiple values, it can be followed with the expression for the required value, e.g. the volume of a specific material would be:"
          - paragraph [ref=e813]:
            - emphasis [ref=e814]: element.material(“Red Brick”).volume
          - paragraph [ref=e815]: "Some list items are also arranged in groups, including ARCHICAD properties (section 4.4.7) and IFC properties (section 4.4.11). The item name might only be unique within its own group, in which case it can be prefixed with the group name as follows:"
          - paragraph [ref=e816]:
