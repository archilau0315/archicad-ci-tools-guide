      - generic [ref=e97]:
        - generic [ref=e98]:
          - generic [ref=e99]: "03"
          - heading "3.1 Background" [level=3] [ref=e100]
        - link "MyCi 官方原文 ↗" [ref=e102] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393675-3-1-Background
        - generic [ref=e103]:
          - paragraph [ref=e104]: Building projects are typically priced in a bill of quantities, breaking the construction down into discrete, well-understood items of a known cost. The list of items can be very large, so is typically arranged in a hierarchy with broad categories at the top and increasing detailed descriptions at the lower levels. Building elements are measured and quantities entered against applicable bill items. A single wall could potentially contribute to many different costs, e.g. bricks/blocks/framing, insulation and finishes.
          - paragraph [ref=e105]: The bill structure may be developed in-house, customised project-by-project or imported from an external source, e.g. database or cloud-based. The software is designed to provide for all of these scenarios, and additional connectivity is planned for direct links to 3rd-party bills of quantity in future.
          - paragraph [ref=e106]: This section discusses different types of bill structures, with methods for creating, importing, editing and exporting.
        - group [ref=e107]:
          - generic "▸ Official English Original" [ref=e108] [cursor=pointer]:
            - text: ▸
            - generic [ref=e109]: Official English Original
      - generic [ref=e110]:
        - generic [ref=e111]:
          - generic [ref=e112]: "04"
          - heading "3.2 Bill structure" [level=3] [ref=e113]
        - link "MyCi 官方原文 ↗" [ref=e115] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393695-3-2-Bill-structure
        - generic [ref=e116]:
          - paragraph [ref=e117]: "The bill can be structured in 2 ways to reflect the requirements of the project and workflow:"
          - list [ref=e118]:
            - listitem [ref=e119]: Simple
          - paragraph [ref=e120]: "The bill is simply a flat list of items, i.e. no categories. This may suit smaller projects or workflows that only price a subset of possible items or trades. Items are displayed with a standard icon under the Project Bill:"
          - paragraph [ref=e121]:
            - img "3.2 Bill structure 示意图" [ref=e122]
          - list [ref=e123]:
            - listitem [ref=e124]: Hierarchical
          - paragraph [ref=e125]: "Items in a large BoQ are easier to manage when grouped into categories in a tree structure, potentially multiple levels deep. In addition to making it easier to find a specific item, categories group similar items together and provide sub-totals when scheduled. Categories are displayed with a folder icon and arranged in a tree structure similar to standard file systems:"
          - paragraph [ref=e126]:
            - img "3.2 Bill structure 示意图" [ref=e127]
          - paragraph [ref=e128]: The content of a category can be revealed or hidden with the adjacent arrow. Note that Quantities provides an option to omit the categories in some views, displaying just the items in a flat list.
          - paragraph [ref=e129]: "The full key of any item in a hierarchy is automatically prefixed with the keys of any parent categories, e.g.:"
          - paragraph [ref=e130]:
            - img "3.2 Bill structure 示意图" [ref=e131]
          - paragraph [ref=e132]: The bill structure has no effect on other software functionality and can be changed at any time. Note that although bill item keys include the keys of parent categories, it is possible to omit any part of the hierarchy by manually adding category keys, e.g. an item in a flat list could be directly assigned the key ‘10.24.73’. These different approaches can be mixed, e.g. creating a partial hierarchy and manually prefixing the keys of any omitted categories to the child items.
          - paragraph [ref=e133]: Also note that bill items are exported to CSV with calculated quantities in a flat list irrespective of the structure, suitable for import to a spreadsheet and conforming to standard headings of item number, description, unit, quantity, rate and total amount (see section 5.2.5 for more detail).
        - group [ref=e134]:
          - generic "▸ Official English Original" [ref=e135] [cursor=pointer]:
            - text: ▸
            - generic [ref=e136]: Official English Original
      - generic [ref=e137]:
        - generic [ref=e138]:
          - generic [ref=e139]: "05"
          - heading "3.3 Creating and managing a Bill structure" [level=3] [ref=e140]
        - link "MyCi 官方原文 ↗" [ref=e142] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001401136-3-3-Creating-and-managing-a-Bill-structure
        - generic [ref=e143]:
          - paragraph [ref=e144]: The BoQ can be viewed and edited in the Quantity Take-off Manager, which can be opened by clicking the menu item CI Tools > Quantities > Quantity Take-off Manager and selecting the Bill Structure tab. All Quantities palettes also display an icon to quickly open the manager dialog.
          - paragraph [ref=e145]:
            - img "3.3 Creating and managing a Bill structure 示意图" [ref=e146]
          - paragraph [ref=e147]: "The key features of the manager are:"
          - list [ref=e148]:
            - listitem [ref=e149]: An option to manage either the bill structure or measurement recipes. Click Bill Structure for the purpose of this section.
          - list [ref=e150]:
            - listitem [ref=e151]: An overview of the bill structure with buttons for creating, deleting, importing and exporting bill items. Details of the selected item are shown in the panel below (see 3 below). The bill structure is headed up with the name of the open project. The next item under the project is headed up Project Bill. Any items created in the manager are displayed under this heading; they are saved in the project file and can only be applied to the current project. If a bill structure is linked to this project from an eternal source, e.g. an external file or database, it will be displayed under a separate heading and cannot be edited (see sections 3.3.7 and 3.3.8 for more details). Multiple items can be selected for quick editing or deletion.
          - list [ref=e152]:
            - listitem [ref=e153]: Details of the selected bill item. If multiple items are selected, only the details of the first are displayed. The following fields can be edited for multiple items simultaneously apart from the key and name (where only the first item will be changed). a. The item key. It can be any combination or letters and numbers, but should not duplicate any other item at the same level (for clarity, because calculated project quantities will be set against the key in the schedule). The keys often reflect established construction classification systems, e.g. Uniclass. The full item key is displayed beside this field. When the item is arranged in a hierarchy under a category, the full key is prefixes the ancestor category keys to the item key, e.g. ‘10.24.73’. If the bill is a flat list, i.e. no categories, the key and full key are the same. b. The item title. Anything can be entered. c. An optional external reference, e.g. a manufacturer or external database code, for informational purposes only. This information is included in exported schedules. d. Rate, i.e. cost per unit. Can be zero if the costing is calculated externally based on exported quantities. e. Unit of measurement, e.g. ‘metre’, ‘mm’, ‘each’, displayed in a popup menu. These items are user-defined – refer to section 3.3.5 for more information. f. An optional description, usually to clarify what should be measured (or how). This information is not included in the schedule.
          - paragraph [ref=e154]: Note that changes to the bill structure only become permanent the OK button is clicked. If Cancel is clicked, all changes will be discarded.
        - group [ref=e155]:
          - generic "▸ Official English Original" [ref=e156] [cursor=pointer]:
            - text: ▸
            - generic [ref=e157]: Official English Original
