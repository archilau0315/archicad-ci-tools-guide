        - generic [ref=e2834]:
          - paragraph [ref=e2835]: All expression operators that work on list, primarily to determine if they contain certain items. Refer to section 4.4.6 for examples and more detail.
          - table [ref=e2837]:
            - rowgroup [ref=e2838]:
              - row [ref=e2839]:
                - columnheader "contains" [ref=e2840]
                - columnheader "The result true if the list contains a partial match to the specified value. For example, a rule to attached to any wall with a material containing the word “brick”:*wall.material contains “brick”*" [ref=e2841]
                - columnheader [ref=e2842]
            - rowgroup [ref=e2843]:
              - row [ref=e2844]:
                - cell "includes" [ref=e2845]
                - cell "The result true if the list contains an exact match to the specified value. For example, a rule to attached to any slab with a material called “Structural concrete”:*slab.material includes “Structural concrete”*" [ref=e2846]
                - cell [ref=e2847]
              - row [ref=e2848]:
                - cell "has" [ref=e2849]
                - cell "The result is true if the value contains a partial match to any item in a specified list. For example, a rule to attach to any element with a material containing either the word “brick” or “concrete”:*element.material has (“**b**rick”, “**c**oncrete”)* Note that this can be used on a single value too, for example a test for a room name containing either “office” or “admin”:*zone.name has (“office”, “admin”)*" [ref=e2850]
                - cell [ref=e2851]
              - row [ref=e2852]:
                - cell "in" [ref=e2853]
                - cell "The result is true if the value contains an exact match to any item in a specified list. For example, a rule to attach to any wall with a material called “Red brick” or “Structural concrete”:*w**all**.material i**n**(“Red brick”, “Structural concrete”)* Note that this can be used on a single value too, for example a test for any element type of “door” or “window”:*e**lement.type* *in**(“d**oor**”, “w**indow**”)*" [ref=e2854]
                - cell [ref=e2855]
