          - heading "4.4.1 What happens if a calculation relies on data that doesn't exist in the project?" [level=3] [ref=e625]
        - link "MyCi 官方原文 ↗" [ref=e627] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001401756-4-4-1-What-happens-if-a-calculation-relies-on-data-that-doesn-t-exist-in-the-project
        - generic [ref=e628]:
          - paragraph [ref=e629]: When a calculation references data that doesn’t exist – for whatever reason – it does not cause an error or interrupt the measurement process. The value for that property is treated as void or empty, and the result of any calculation using that value will also become void, ultimately yielding a zero/false result. This means that the tests for attaching a recipe or actioning a measurement can include a property name – if the property doesn’t exist, the result is false and the action is not taken.
          - paragraph [ref=e630]: This makes it far easier to create and maintain template recipes that are applicable across a wide range of projects, even when the currently open project is completely empty.
        - group [ref=e631]:
          - generic "▸ Official English Original" [ref=e632] [cursor=pointer]:
            - text: ▸
            - generic [ref=e633]: Official English Original
