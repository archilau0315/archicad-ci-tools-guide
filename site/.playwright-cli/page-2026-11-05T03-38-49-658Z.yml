            - text: provides a list (see section 4.4.6 for more detail). The list could be empty (e.g. for a
            - emphasis [ref=e901]: fill
            - text: "element) or have a single item, but should always be treated as a list in calculations. It has two possible uses:"
          - list [ref=e902]:
            - listitem [ref=e903]: Searching for materials based on the name
          - paragraph [ref=e904]: "This is often useful for attaching recipes automatically based on its materials (see section 4.5) or determining which measurements the recipe should make (see section 4.6). Consider a recipe intended to take measurement of all types of brick – it might automatically attach to any wall with a material containing the word “brick”:"
          - paragraph [ref=e905]: wall.material contains “brick”
