          - heading "5.2.7 How to audit correct bill item usage" [level=3] [ref=e1417]
        - link "MyCi 官方原文 ↗" [ref=e1419] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004150795-5-2-7-How-to-audit-correct-bill-item-usage
        - generic [ref=e1420]:
          - paragraph [ref=e1421]:
            - emphasis [ref=e1422]: Quantities
            - text: provides several methods for auditing scheduled quantities. The
            - emphasis [ref=e1423]: Show
            - text: menu(item 4a in
            - link "the illustration" [ref=e1424] [cursor=pointer]:
              - /url: "#5.2.Scheduling%20Quantities|outline"
            - text: ") plays a key role in tracking bill item use:"
          - paragraph [ref=e1425]:
            - img "5.2.7 How to audit correct bill item usage 示意图" [ref=e1426]
          - paragraph [ref=e1427]: "The menu options are used to filter the displayed items as follows:"
          - list [ref=e1428]:
            - listitem [ref=e1429]: Ca lculated items Only bill items with a calculated non-zero total are shown.
          - list [ref=e1430]:
            - listitem [ref=e1431]: All bill items All bill items are shown
          - list [ref=e1432]:
            - listitem [ref=e1433]: Zero quantities Only bill items that processed a measurement calculation during the scheduling process but still have a zero total are shown
          - list [ref=e1434]:
            - listitem [ref=e1435]: Unused items Only bill items not used at all for the schedule are shown
          - paragraph [ref=e1436]:
            - text: Using this menu and other
            - emphasis [ref=e1437]: Quantities
            - text: "features, the palette auditing processes include:"
          - list [ref=e1438]:
            - listitem [ref=e1439]: Checking element consistency
          - paragraph [ref=e1440]: Section 5.2.6 describes a method for tracking costs to the source elements. This selection technique is very powerful in conjunction with other auditing processes, e.g. checking for property inconsistencies using the Quantities Info palette (section 2.2) and checking the model for missing elements. Look for unexpected variations in recipe attachments or property values – the Info palette will highlight different values in blue so they stand out. Use its filtering to isolate elements with unusual settings, or searching to expand to similar elements that should be measured alike.
          - paragraph [ref=e1441]: For example, selecting elements linked to exterior cladding may reveal that some model walls have been omitted and other incorrectly included. If the recipe rules or measurement relate to property values, the Info palette may quickly highlight these inconsistencies and can be immediately updated through the same palette.
          - list [ref=e1442]:
            - listitem [ref=e1443]: Checking bill item usage
          - paragraph [ref=e1444]:
            - text: A bill item that isn’t referenced in any recipes suggests a possible oversight. While it’s possible that some items are irrelevant for a given project, it should be checked. Setting the Show menu to Unused items enables a quick review. These items can be further filtered by selecting items or categories in the bill structure to the left (item 1b in
            - link "the illustration" [ref=e1445] [cursor=pointer]:
              - /url: "#5.2.Scheduling%20Quantities|outline"
            - text: ).
          - list [ref=e1446]:
            - listitem [ref=e1447]: Checking calculation results
          - paragraph [ref=e1448]: A bill item may have a zero total in the schedule despite recipe representation and actively running associated rules or quantity calculations on project elements. While it’s possible that none of these elements contribute to cost, checking is advisable.
          - paragraph [ref=e1449]: Set the Show menu to Z e ro quantities to view affected item and apply the techniques described in Checking element consistency above. If either the elements seem fine or the wrong elements are associated with the recipe, use the Recipe tab of the Quantity Take-off Manager (refer to section 4.2) to review the rules and/or calculations of recipes associated with the affected bill items.
          - paragraph [ref=e1450]: A summary of all auditing methods can be found in chapter 6.
        - group [ref=e1451]:
          - generic "▸ Official English Original" [ref=e1452] [cursor=pointer]:
            - text: ▸
