          - heading "6.1 Overview" [level=3] [ref=e1457]
        - link "MyCi 官方原文 ↗" [ref=e1459] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004057516-6-1-Overview
        - paragraph [ref=e1461]: The ability to audit scheduling quantities and metadata interactively within the BIM project is a key feature of Quantities. Auditing features are designed to be used at every stage of the project development, not just at latter stages as final cost estimates are produced, and are therefore woven into all the tools and processes already described in the previous chapters. The purpose of this chapter is to review the overall auditing process through the project lifecycle with links to detailed information elsewhere in this document.
