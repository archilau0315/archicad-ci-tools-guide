                - cell "*wall.material contains “brick”*" [ref=e1131]
              - row [ref=e1132]:
                - cell "Any element falling under the Uniclass 2015 *Waste disposal functions* category" [ref=e1133]
                - cell "*element.classification(\"Uniclass 2015\").code startsWith “EF_50”*" [ref=e1134]
              - row [ref=e1135]:
                - cell "Any element with a parameter called *gs_list_manufacturer*set to “Armitage Shanks”" [ref=e1136]
                - cell "*element.parameter.gs_list_manufacturer = “Armitage Shanks”*" [ref=e1137]
              - row [ref=e1138]:
                - cell "Only objects (placed with the *Object* tool) with a property called “Under Ground Power” set to “Single Phase”" [ref=e1139]
                - cell "*Object.property(“Under Ground Power”) = “Single Phase”*" [ref=e1140]
          - paragraph [ref=e1141]: This list will be expanded over time to include examples thought to be broadly useful.
