                - cell "IFC attribute" [ref=e672]
                - cell "*element.ifc**A**ttribute**(\"Description\")*" [ref=e673]
          - paragraph [ref=e674]:
            - text: The resulting value is void if the element doesn’t have an IFC property/attribute with the requested name – this does not cause errors and any calculations using that value will yield a result of zero.
            - emphasis [ref=e675]: Quantities
            - text: is highly tolerant of property value type differences, as noted in section 4.4.2,
            - emphasis [ref=e676]: Does the data type matter?
