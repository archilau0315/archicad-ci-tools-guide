        - generic [ref=e1398]:
          - paragraph [ref=e1399]:
            - text: This is a powerful feature of
            - emphasis [ref=e1400]: Quantities
            - text: that sets it apart from external scheduling tools. While the schedule is displayed in ARCHICAD, all the quantities are connected to the contributing elements.
          - list [ref=e1401]:
            - listitem [ref=e1402]: T he elements contributing the cost can be interactively inspected live in the model, including their assigned properties, classifications and recipes in the Quantities Info palette (section 2.2). This can quickly explain the reasons for unusual cost patterns (unexpectedly low or high) and highlight inconsistencies in the model or element properties.
          - list [ref=e1403]:
            - listitem [ref=e1404]: It is possible for Quantities to differentiate between bill items that weren’t used at all vs those that were targeted by a calculation and still yielded a zero result. Both situations suggest an error, but for different reasons. See section 5.2.7 for additional information.
          - paragraph [ref=e1405]:
            - text: To use this feature, select any number of scheduled items in panel 3 and click
            - emphasis [ref=e1406]: Select
            - text: (item 2d in
            - link "the illustration" [ref=e1407] [cursor=pointer]:
              - /url: "#5.2.Scheduling%20Quantities|outline"
            - text: ).
            - emphasis [ref=e1408]: Quantities
            - text: will select and zoom to all elements that contributed to the cost of the selected bill items in the current view. If some items are currently hidden, their layer(s) will be made visible.
          - paragraph [ref=e1409]:
            - text: Note that it may not be possible to see all items in the current view, e.g. when the floor plan is active and the items range across multiple storeys. The best option is usually the 3D window, where all but fill patterns are visible. The view the schedule was originally calculated from has no bearing on this process, i.e. you can calculate from one view and click
            - emphasis [ref=e1410]: Select
            - text: in any other view.
        - group [ref=e1411]:
          - generic "▸ Official English Original" [ref=e1412] [cursor=pointer]:
            - text: ▸
