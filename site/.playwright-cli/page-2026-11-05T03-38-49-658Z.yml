          - heading "3.3.1 How to create a bill item" [level=3] [ref=e161]
        - link "MyCi 官方原文 ↗" [ref=e163] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360001393755-3-3-1-How-to-create-a-bill-item
        - generic [ref=e164]:
          - paragraph [ref=e165]: Click the New button (item 2b in the illustration). A new bill item will be displayed and selected in panel 2, with its details shown in panel 3. A key with the next highest number in the bill is automatically assigned, but this can be freely edited.
          - paragraph [ref=e166]: If an existing bill item is selected when New is clicked, the new bill item will be an exact duplicate of the selected item (apart from the key). If the bill is arranged in a hierarchy, the new item will be at the same level as the selected item and will be assigned the next highest number at that level. If a category is selected, the new item will fall under that category and receive the next highest number under that category.
        - group [ref=e167]:
