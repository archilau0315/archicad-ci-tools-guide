          - paragraph [ref=e909]: The associated quantity calculation will only be made when the wall includes a material exactly matching the name “Brick – Furness Handbridge Blend 215”.
          - list [ref=e910]:
            - listitem [ref=e911]: Calculating geometric material quantities
          - paragraph [ref=e912]: "Every material in a list has an area and volume that can be used in quantity calculations. A specific material can be referenced in a list by appending its name, e.g. for a material called “Red Brick”:"
          - paragraph [ref=e913]: element.material(“Red Brick”)
          - paragraph [ref=e914]: "The name must be an exact match, e.g. the above would not find “Red Brick 1”. The material quantities include:"
