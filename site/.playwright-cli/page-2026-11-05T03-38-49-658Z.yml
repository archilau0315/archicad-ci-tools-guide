        - generic [ref=e957]:
          - paragraph [ref=e958]:
            - text: All recipes can define a rule to automatically bind it to target elements – refer to item 4a in the illustration of section 4.2 for
            - emphasis [ref=e959]: Measurement Recipes
            - text: . The rule is an expression which is true for the target elements. If the target is
            - emphasis [ref=e960]: any element of a wall type
            - text: ", the expression would be:"
          - paragraph [ref=e961]:
            - emphasis [ref=e962]: element.type = “Wall”
          - paragraph [ref=e963]:
            - text: Conversely, if we wanted everything that was
            - emphasis [ref=e964]: not
            - text: "a wall type:"
          - paragraph [ref=e965]:
            - emphasis [ref=e966]: not(element.type = “Wall”)
          - paragraph [ref=e967]: "There can be multiple conditions in the rule joined with “and” or “or”. If, for example, drainage services are represented by elements that are:"
          - list [ref=e968]:
            - listitem [ref=e969]: of a wall type wall or a beam type
          - list [ref=e970]:
            - listitem [ref=e971]: … and its ID contains the text “pipe”
          - paragraph [ref=e972]: "…we could write this as:"
          - paragraph [ref=e973]:
            - emphasis [ref=e974]:
              - text: (element.type = “Wall”
              - strong [ref=e975]: or
              - text: element.type = “Beam”)
              - strong [ref=e976]: and
              - text: element.id contains “pipe”
          - paragraph [ref=e977]: "Note that the check for a wall or beam are enclosed in parentheses – this means it will be checked first, i.e. before looking at anything outside the parentheses. The rule would still be accepted without them, but the meaning is ambiguous – another possible meaning is the elements are:"
          - list [ref=e978]:
            - listitem [ref=e979]: o f a wall type
          - list [ref=e980]:
            - listitem [ref=e981]: … or of a beam type and its ID contains “pipe”
          - paragraph [ref=e982]: …which would target all walls and any beam with any ID containing “pipe”. A useful guideline is that you only need parentheses if the expression combines both “and” and “or”, and put them around any conditions containing “and”.
