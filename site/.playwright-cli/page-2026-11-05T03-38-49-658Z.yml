        - generic [ref=e658]:
          - paragraph [ref=e659]:
            - text: IFC properties and attributes can be used in exactly the same way as ARCHICAD properties (see section 4.4.7,
            - emphasis [ref=e660]: How to use properties
            - text: "). IFC property sets are referenced just like ARCHICAD property groups, and prefixing the set name to the IFC property name is also optional (if you are confident the property name is unique). IFC attributes are not arranged in sets and should be referenced by name alone. Examples follow below:"
          - table [ref=e662]:
            - rowgroup [ref=e663]:
              - row [ref=e664]:
                - columnheader "IFC property with set" [ref=e665]
