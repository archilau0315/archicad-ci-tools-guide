          - heading "4.6 Optional Measurements" [level=3] [ref=e1150]
        - link "MyCi 官方原文 ↗" [ref=e1152] [cursor=pointer]:
          - /url: https://cadimage.zendesk.com/hc/en-us/articles/360004150635-4-6-Optional-Measurements
        - generic [ref=e1153]:
          - paragraph [ref=e1154]: If the rule for attaching a recipe was the only mechanism for automated measurement, it could easily necessitate a huge list of recipes with slight variations to account for every situation. In practice, many recipes broadly share the same conditions but differ slightly in either the quantity calculation or target bill item.
          - paragraph [ref=e1155]: "This leads to the core of the ‘recipe’ concept, where many different ingredients can be combined in a single solution. Consider, for example, a recipe broadly accounting for the cost of brick masonry. With appropriately named materials, it would be easy to attach a recipe on the basis that the material name contains the word “brick”. Even if the cost or brick type is identified by properties, there are 2 potential problems:"
          - list [ref=e1156]:
            - listitem [ref=e1157]: The unit rate (cost) for each brick type may depend on data in the bill or an external database, in which case the quantity for each brick type will be allocated to a different item
          - list [ref=e1158]:
            - listitem [ref=e1159]: There may be multiple brick skins, potentially of different types or thicknesses, in a single wall.
          - paragraph [ref=e1160]:
            - text: Once a ‘brick’ recipe has been created with a rule to attach to all relevant walls, all bill items can be attached with a rule and calculation for each governing when and how a quantity is measured. Referring to the illustration in section 4.2, note the following features of the
            - emphasis [ref=e1161]: Recipe
            - emphasis [ref=e1162]: Manager
            - text: ":"
          - list [ref=e1163]:
            - listitem [ref=e1164]:
              - text: The list of bill items added to the recipe in
              - link "panel 4" [ref=e1165] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ;
          - list [ref=e1166]:
            - listitem [ref=e1167]:
              - text: The rule for taking a measurement against the selected bill item in
              - link "panel 5, field a" [ref=e1168] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ;
          - list [ref=e1169]:
            - listitem [ref=e1170]:
              - text: The quantity calculation for the selected bill item in
              - link "panel 5, field b" [ref=e1171] [cursor=pointer]:
                - /url: "#4.2.Measurement%20Recipes|outline"
              - text: ;
          - paragraph [ref=e1172]: "For brick types, the material names would ideally define the brick type (by supplier code or product name). If, for example, a specific brick material is named “Brick – Furness Handbridge Blend 215”, the rule could be:"
          - paragraph [ref=e1173]:
            - emphasis [ref=e1174]: wall.material includes “Brick – Furness Handbridge Blend 215”
          - paragraph [ref=e1175]: "…ensuring the quantity calculation take a measurement against the bill item when the wall includes that exact brick type. The quantity calculation could then also reference the volume of that specific material, dividing it by the unit volume of a single brick (mortar could be included in this case, but there are many alternatives):"
          - paragraph [ref=e1176]:
            - emphasis [ref=e1177]: wall.material(“Brick – Furness Handbridge Blend 215”).volume / 0.00125
          - paragraph [ref=e1178]: "If the quantity should be rounded up to to the nearest whole number, it could be:"
          - paragraph [ref=e1179]:
            - emphasis [ref=e1180]: roundUp(wall.material(“Brick – Furness Handbridge Blend 215”).volume / 0.00125, 1)
          - paragraph [ref=e1181]: There is no rule for deciding when a new recipe is preferable to an optional measurement in an existing recipe. It’s technically possible to make just one recipe that is attached to all elements and allow optional measurements to allocate quantities, but that recipe and the rules for optional measurements would likely be complex and bloated. Conversely it’s also possible to have a different recipe for every quantity measurement, but the list would likely be impracticably long and the attachment rules would be complicated.
          - paragraph [ref=e1182]: The best strategy is to target recipes to groups of bill items or elements that are broadly similar, and allow the optional measurements to take care of the detail.
        - group [ref=e1183]:
