          - paragraph [ref=e645]: Note that it not necessary to enclose the parameter name in quote marks or parentheses. The resulting value is void if the element either doesn’t have parameters or doesn’t have a parameter with the requested name – this does not cause errors and any calculations using that value will yield a result of zero.
