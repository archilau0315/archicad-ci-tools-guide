            - text: Annotate 的大小写转换工具可以更改大多数项目元素的文本内容，并可选包含诸如（字符串）属性和参数之类的设置。若只想转换某一部分选定项目的大小写，请先选中它们。要启动转换工具，请点击菜单项
            - emphasis [ref=e91]: CI Tools > Annotate > Convert Case…
            - text: （转换大小写）
          - paragraph [ref=e92]:
            - img "1.1 Convert Text Case 示意图" [ref=e93]
          - paragraph [ref=e94]:
            - text: 首先会弹出
            - emphasis [ref=e95]: Case Conversion Options
            - text: （大小写转换选项）对话框。请从以下选项中选择：
          - list [ref=e96]:
            - listitem [ref=e97]: Case（大小写）指定所需的文本大小写，以及是否需要遵守例外情况。可选项包括：
          - list [ref=e98]:
            - listitem [ref=e99]: Sentence case（句首字母大写）
          - list [ref=e100]:
            - listitem [ref=e101]: UPPER CASE（全大写）
          - list [ref=e102]:
            - listitem [ref=e103]: lower case（全小写）
          - list [ref=e104]:
            - listitem [ref=e105]: Title Case（标题式大小写）
          - paragraph [ref=e106]:
            - text: 如果某些单词或缩写应保持固定大小写，请勾选
            - emphasis [ref=e107]: Observe case exceptions
            - text: （遵守大小写例外）。此时会出现一个
            - emphasis [ref=e108]: Edit
            - text: （编辑）按钮用于查看这些例外（详见 1.2 节）。
          - list [ref=e109]:
            - listitem [ref=e110]: Scope（范围）指定文本转换的范围，包括：
          - paragraph [ref=e111]: Selected items only（仅选定项目） . 若在活动图纸视图中未选中任何内容，则该选项不可用。
          - list [ref=e112]:
            - listitem [ref=e113]: Text in the current drawing（当前图纸中的文本） . 仅影响活动的图纸视图。若当前为平面图，则仅针对当前楼层。
          - list [ref=e114]:
            - listitem [ref=e115]: Text in floor plan (all storeys)（平面图中的文本，所有楼层） . 平面图中的所有楼层都将被处理。
          - list [ref=e116]:
            - listitem [ref=e117]: Text in all drawings（所有图纸中的文本）。所有图纸，包括剖面图、详图等都将被处理。
          - paragraph [ref=e118]:
            - text: 勾选
            - emphasis [ref=e119]: String properties
            - text: （字符串属性）可转换任意字符串属性值。请注意，这不会影响从预设选项菜单中选取的文本 —— 若要更改这类文本，请使用属性管理器（Property Manager）。
          - paragraph [ref=e120]:
            - text: 勾选
            - emphasis [ref=e121]: String parameters
            - text: （字符串参数）可转换参数文本。已锁定或隐藏的参数不会受到影响（因为它们大概不是要更改的对象）。若选择了
            - emphasis [ref=e122]: If displayed
            - text: （如果已显示）选项，则只有与对象在 2D 中当前显示的文本完全匹配的字符串参数值才会被转换。如果该对象还含有其他可见、未锁定且不应更改的文本，此选项要安全得多。
          - list [ref=e123]:
            - listitem [ref=e124]: Ignore（忽略）选择任何不应被转换的项目或图层，包括：
          - paragraph [ref=e125]: Hidden items（隐藏项目） ，例如隐藏图层上的所有内容；
          - list [ref=e126]:
            - listitem [ref=e127]: Locked items（锁定项目） ，即已被显式锁定的元素；
          - list [ref=e128]:
            - listitem [ref=e129]: Locked layers（锁定图层） ，例如锁定图层上的所有内容。
          - paragraph [ref=e130]:
            - text: 点击
            - emphasis [ref=e131]: Ok
            - text: （确定）开始转换过程。
