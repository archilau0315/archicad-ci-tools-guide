          - paragraph [ref=e148]: 例外列表与项目相关，但可以导出后导入到其他项目。该管理器对话框包含以下内容：
          - list [ref=e149]:
            - listitem [ref=e150]: 例外列表
          - paragraph [ref=e151]: 列表分为 2 列，两列都可在列表中直接编辑：
          - list [ref=e152]:
            - listitem [ref=e153]: Text（文本）字面文本，即其在文档中应呈现的大小写形式。
          - list [ref=e154]:
            - listitem [ref=e155]: Context（上下文）此例外所适用的上下文
          - paragraph [ref=e156]: 例如，millimetre（毫米）的缩写 mm 通常为小写，但我们不希望任何含有双 m 的单词受到影响，例如 "common" 被转换为 "COmmON"。该单位应跟在数字之后，例如 100mm，因此上下文应设置为 "After number"（数字之后）。对于整个单词都应使用特定大小写的情况（例如专有名词），上下文可设置为 "Entire word"（整个单词）。如果一系列字母、符号甚至单词无论出现在何处都应采用特定大小写，则上下文为 "Anywhere"（任意位置）。请注意，对于任何包含非字母数字字符（如 "." 或 "?"）的表达式，必须选择 "Anywhere"。
