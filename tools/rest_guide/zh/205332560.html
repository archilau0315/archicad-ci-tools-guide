<p>安装 <strong>Ci Tools</strong> 后你会发现，每次启动 <strong>ARCHICAD</strong> 时会弹出一条<strong>「Archicad 每日贴士」</strong>（Tip of the Day），可以选择在浏览器里查看该条贴士。</p>
<p><img src="img/205332560_0.jpg" alt="每日贴士" loading="lazy"></p>
<p>装好工具后首次启动 ARCHICAD 时，会看到这条信息：</p>
<p><img src="img/205332560_1.jpg" alt="首次启动提示" loading="lazy"></p>
<p>如果想更改查看偏好（即打开或关闭每日贴士）：</p>
<p>1. 在 ARCHICAD 中选择 <strong>Ci Tools &gt; MyCi Tools &gt; Preferences</strong>：</p>
<p>2. 按需勾选或取消「<strong>Display Tip of the Day at Launch</strong>」（启动时显示每日贴士）选项：</p>
<p><img src="img/205332560_2.jpg" alt="偏好设置" loading="lazy"></p>
