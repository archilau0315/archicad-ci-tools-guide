<h2>问题：</h2>
<p>打开 Archicad 文件时报错，提示项目或某个 Ci Tools 的插件库版本较旧。</p>
<p><img src="img/360003865516_0.jpg" alt="版本警告弹窗" loading="lazy"></p>
<p>原因可能有多种，主要两种是：</p>
<ul>
<li>有人用新版 Archicad 把文件回存（Back save）成了旧版 Archicad 可用的格式；</li>
<li>这是一个团队协作项目，或是一个使用了 BIMcloud Basic / BIMcloud 上库的独享项目。</li>
</ul>
<h2>解决：</h2>
<p><a href="https://cadimage.zendesk.com/hc/en-us/articles/6569505413647" target="_blank" rel="noopener">请参见 CI Tools Library 版本警告</a></p>
