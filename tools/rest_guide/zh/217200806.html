<p>先在工具箱的 <strong>Design</strong> 上<strong>右键</strong>，选择 <strong>Toolbox...</strong></p>
<p>1. 选择 <strong>Design</strong> 作为要加入工具的工具箱分组。</p>
<p>2. 在 <strong>Available Tools</strong>（可用工具）区域选中所需工具。</p>
<p>3. 点 <strong>Add Selected</strong>，把工具加进工具箱的 Design 分组。</p>
<p>4. 点 <strong>OK</strong>。</p>
<p>工具就会出现在你的工具箱里。</p>
