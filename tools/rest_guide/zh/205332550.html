<p>你可能已经注意到，Cadimage Installer 随工具一起装了一个名为「Cadimage Update」的附加模块，它让你可以在 ARCHICAD 内部检查更新。</p>
<p>方法是：进入 <strong>Cadimage 菜单</strong>，选择 <strong>myCadimage &gt; Check for Updates</strong>：</p>
<p><img src="img/205332550_0.png" alt="Check for Updates 菜单" loading="lazy"></p>
<p><strong>如果工具已是最新</strong>，会看到如下提示：</p>
<p><img src="img/205332550_1.jpg" alt="已是最新版提示" loading="lazy"></p>
<p><strong>如果工具不是最新</strong>，电脑会提示你打开 Cadimage Installer 搜索并安装更新。</p>
<p><img src="img/205332550_2.png" alt="提示打开安装器" loading="lazy"></p>
