<p>1. 进入要布置支撑的平面视图。从 <strong>Cadimage</strong> 菜单选择 <strong>Bracing &gt; Wind Earthquake Zone</strong>。</p>
<p><img src="img/360000549475_0.jpg" alt="Wind Earthquake Zone 菜单" loading="lazy"></p>

<p>2. 在弹出的 Wind &amp; Earthquake Zones 窗口中设置 <strong>Wind Zone</strong>（风区）、<strong>Earthquake Zone</strong>（地震区）和 <strong>Soil Class</strong>（场地土类别）。</p>
