<p>如果工具已经装好，只需运行 Ci Tool Installer 即可更新。</p>
<p>登录 Ci Tool Installer 后，点界面上方的 Update 标签，就能看到可用更新列表。</p>
<p><img src="img/360001004575_0.jpg" alt="更新列表" loading="lazy"></p>

<p>与安装过程类似：按各工具旁的 <strong>Update</strong> 按钮只装想要的更新，或按 <strong>Update All</strong> 一键全部更新。</p>
<p>完成后点 <strong>Close</strong> 退出安装器即可。</p>
