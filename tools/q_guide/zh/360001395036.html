<p><em>Quantities Info</em> 面板中特征标记的文字样式，是判断其状态的重要反馈。例如：</p>
<ul>
<li><p><strong>蓝色</strong>表示该特征标记并非所选构件共有——用来发现本应统一的特征标记非常好用。配合 ARCHICAD 的 Find &amp; Select（查找并选择）面板效果更佳：先找出本应相同的构件，再用 <em>Quantities Info</em> 查不一致的地方。</p></li>
<li><p><strong>红色</strong>表示一个手工挂接的配方已被删除——多半是误删。</p></li>
<li><p><strong>加粗</strong>表示某属性在所选构件间有多个不同的值；点开折叠三角即可查看这些值。</p></li>
</ul>
<p>发现异常的特征标记或属性值后，在列表里选中它们、点「按特征标记筛选」按钮，相关的构件就被单独隔离出来了。</p>
