<p>新构件的设置通常由对应工具的 Settings 对话框决定。ARCHICAD 的 Info 面板和 <em>Quantities Info</em> 面板都能交互查看这些设置，但<strong>这些设置从不在多个工具之间共享</strong>。</p>
<p>不过，<em>Quantities Info</em> 面板在 <strong>Live Edit 关闭</strong>时可以把特征标记套用到<strong>任何类型</strong>的新构件上：面板里显示的所有特征标记，都会加到此后新建的每个构件上，不限类型。想停掉这个效果，清空面板列表或折叠对应分区即可。Settings 对话框里的数据不受影响。</p>
<p>当一批构件必须共享某些特征标记或取值时，这个功能很省事——不用打开多个 Settings 对话框反复做同样的修改。</p>
