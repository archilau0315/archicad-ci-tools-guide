<p>选中目标构件，点击对应列表下方的「添加」按钮（<img src="img/360001394936_0.png" alt="添加按钮" loading="lazy">），在弹出的列表中勾选要添加的特征标记：</p>
<p><img src="img/360001394936_1.png" alt="选择特征标记列表" loading="lazy"></p>
<p>可以一次勾选多项一步添加，但注意<strong>每个分类系统只能加一个分类</strong>。Live Edit 开启时，所选特征标记立即加到选中构件上。</p>
<p>Live Edit 关闭时需要多一步：先在面板列表里选中要添加的特征标记，再点「注入」按钮（<img src="img/360001394936_2.png" alt="注入按钮" loading="lazy">）。注意：Live Edit 关闭时面板列表不受构件选择和视图切换影响，所以在后续构件上重复这套操作非常顺手。</p>
<p>配方也可以通过 ARCHICAD 的 Settings 对话框添加（见 2.3.8）。属性的添加详见 2.4.4。</p>
